# The image's smoke test, run by build.py test on the build machine: one site
# with every app, the same processes the catalog template runs, plain compose
# rather than swarm. IMG and the values the template's backend reads come from
# build.py.
x-app: &app
  image: ${IMG}
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

services:
  # The catalog template's backend, script and all: it writes the bench
  # config, creates the site, runs install-app, then starts the app server. A
  # step that fails ends the script, and the container exits or restarts under
  # the template's restart policy; build.py fails on either.
  backend:
    extends:
      file: ../../blueprints/erpnext/docker-compose.yml
      service: backend
    image: ${IMG}
  frontend:
    <<: *app
    restart: on-failure
    command: [nginx-entrypoint.sh]
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${ERPNEXT_HOSTNAME}
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    ports: ["8080:8080"]
  websocket:
    <<: *app
    restart: on-failure
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]
  queue-short:
    <<: *app
    restart: on-failure
    command: [bench, worker, --queue, "short,default"]
  queue-long:
    <<: *app
    restart: on-failure
    command: [bench, worker, --queue, "long,default,short"]
  scheduler:
    <<: *app
    restart: on-failure
    command: [bench, schedule]

  db:
    image: mariadb:11.8.9
    restart: on-failure
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes: [db-data:/var/lib/mysql]
  redis-cache:
    image: redis:8.6.3-alpine3.23
    restart: on-failure
  redis-queue:
    image: redis:8.6.3-alpine3.23
    restart: on-failure

volumes:
  db-data:
  sites:
  logs:
