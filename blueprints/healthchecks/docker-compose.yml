x-catena:
  schema: 2
  version_from: app
  env:
    SUBDOMAIN:
      setting:
        default: healthchecks
        label:
          en: "Address prefix (the address moves the next time the server applies its configuration)"
          fr: "Préfixe de l'adresse (l'adresse change à la prochaine application de la configuration du serveur)"
    SECRET_KEY:
      generated: {length: 50, alphabet: alnum}
    HC_URL:
      managed: {expr: "http://healthchecks:8000"}
    ADMIN_EMAIL:
      managed: {expr: "{{ admin_email }}"}
    PING_KEY:
      managed: {expr: "{{ healthchecks_ping_key | default('') }}"}
    READ_KEY:
      managed: {expr: "{{ healthchecks_api_key_readonly | default('') }}"}
    API_KEY:
      managed: {expr: "{{ healthchecks_api_key_readwrite | default('') }}"}
    SUPERUSER_PASSWORD:
      generated: {length: 32, alphabet: alnum}
    EMAIL_HOST_PASSWORD:
      managed: {expr: "{{ smtp_password | default('') }}"}
  # The three keys are the ones the server's own jobs and Gatus use; the configure hook
  # sets them on the project, and the ping key is what the other monitoring apps read
  # through provided.healthchecks.ping_key. smtp_password is the outgoing mail's password.
  secrets: [healthchecks_ping_key, healthchecks_api_key_readonly, healthchecks_api_key_readwrite, smtp_password]
  provides:
    healthchecks: {url: HC_URL, ping_key: PING_KEY}
  # configure runs after every deploy in the app's own container: it sets up the one
  # superuser and the project, pins the project's keys, and keeps the admin's email
  # channel while outgoing mail is on. verify asks the status endpoint, which reads
  # the database, with the Host the app always allows.
  hooks:
    service: app
    timeout_seconds: 300
    configure:
      - - python3
        - -c
        - |
          import json
          import os
          import sys
          import uuid

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "hc.settings")
          sys.path.insert(0, os.getcwd())
          import django

          django.setup()

          from django.contrib.auth import get_user_model
          from hc.accounts.models import Profile, Project
          from hc.api.models import Channel

          # The folder's .env is this script's environment. A missing key raises KeyError, so a
          # wiring break fails the deploy.
          email = os.environ["ADMIN_EMAIL"]
          password = os.environ["SUPERUSER_PASSWORD"]
          ping_key = os.environ.get("PING_KEY", "")
          read_key = os.environ.get("READ_KEY", "")
          write_key = os.environ.get("API_KEY", "")
          project_name = os.environ.get("HC_PROJECT_NAME", "")
          mail_on = bool(os.environ.get("EMAIL_HOST", ""))
          if not email:
              sys.exit("ADMIN_EMAIL is empty")

          User = get_user_model()
          login = email.lower()

          # The superuser owns the project that holds the ping key, so an admin email change
          # renames that one user. With no such project yet it is the user named after the
          # admin email, created when missing. Keycloak sends the address in lower case and the
          # sign-in gate's header is matched exactly, so the username and email are lower case;
          # the email channel keeps the address as given. The password is set on creation only.
          project = Project.objects.filter(ping_key=ping_key).first() if ping_key else None
          operator = project.owner if project else (
              User.objects.filter(username=login).first()
              or User.objects.filter(email__iexact=login).first())
          if operator is None:
              operator = User.objects.create_superuser(username=login, email=login, password=password)
          else:
              # A gated visit that found no exact match made a second user on the lower case
              # address: its projects go to the operator and it is deleted. A user on any other
              # address is left alone.
              for dup in list(User.objects.filter(email__iexact=login).exclude(pk=operator.pk)):
                  Project.objects.filter(owner=dup).update(owner=operator)
                  dup.delete()
              wanted = {"username": login, "email": login, "is_superuser": True, "is_staff": True}
              changed = [f for f, v in wanted.items() if getattr(operator, f) != v]
              for field in changed:
                  setattr(operator, field, wanted[field])
              if changed:
                  operator.save(update_fields=changed)

          # The theme is NULL until a person chooses; "" is a deliberate Light. Only NULL
          # follows the browser's preference.
          profile = Profile.objects.for_user(operator)
          if profile.theme is None:
              profile.theme = "system"
              profile.save(update_fields=["theme"])

          # Project.objects.create skips the sign-up flow's tutorial check and email channel.
          if project is None:
              project = Project.objects.filter(owner=operator).first()
          if project is None:
              project = Project.objects.create(owner=operator, name=project_name or "Catena")

          # GET /api/v3/checks/ needs the read-only key; creating, updating, pausing and
          # resuming a check need the full key. An empty value leaves the project's key as it is.
          fields = ["name"]
          if project_name:
              project.name = project_name
          elif not project.name:
              project.name = "Catena"
          for field, value in (("api_key_readonly", read_key), ("api_key", write_key), ("ping_key", ping_key)):
              if value:
                  setattr(project, field, value)
                  fields.append(field)
          project.save(update_fields=fields)

          # The admin's email is an alert channel while outgoing mail is on, notified on down
          # and on up; it carries a fixed code, so a deploy updates or removes that one row
          # and never a channel a person added. It is attached to every check when it is
          # created and never again, so a check a person detaches it from stays detached. An email
          # channel is marked verified: Healthchecks sends nothing to an unverified one.
          code = uuid.uuid5(uuid.NAMESPACE_URL, "catena:healthchecks:admin-email")
          if mail_on:
              channel, created = Channel.objects.update_or_create(
                  project=project,
                  code=code,
                  defaults={
                      "kind": "email",
                      "value": json.dumps({"value": email, "up": True, "down": True}),
                      "name": "Admin email",
                      "email_verified": True,
                  },
              )
              if created:
                  channel.assign_all_checks()
              print("OK email=" + str(channel.code))
          else:
              Channel.objects.filter(project=project, code=code).delete()
              print("OK email=none")
    verify:
      - - python3
        - -c
        - |
          import sys
          import urllib.request

          request = urllib.request.Request("http://127.0.0.1:8000/api/v3/status/", headers={"Host": "localhost"})
          try:
              body = urllib.request.urlopen(request, timeout=20).read().decode().strip()
          except Exception as e:
              print("Healthchecks does not answer its status endpoint: " + str(e), file=sys.stderr)
              sys.exit(1)
          if body != "OK":
              print("the status endpoint answered " + body[:80], file=sys.stderr)
              sys.exit(1)
          print("Healthchecks answers and reads its database")
  data:
    app: {volume: healthchecks-data, upgrade: in_place}

services:
  app:
    image: healthchecks/healthchecks:v5.0.3
    deploy:
      restart_policy:
        condition: any
        delay: 5s
      # healthchecks-data is the SQLite database holding every check and its
      # ping history. An empty one on another node is a monitoring plane that
      # has forgotten what it watches.
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      # The values the server writes into the app's .env for its own address and
      # mail; the defaults let a server with none of them start the app.
      SITE_ROOT: ${SITE_ROOT:-http://localhost:8000}
      SITE_NAME: ${SITE_NAME:-heartbeats}
      # Django matches ALLOWED_HOSTS against the literal Host header, and the
      # consumers on the server dial the loopback publish below by IP, so 127.0.0.1
      # is listed beside the network alias.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,healthchecks}
      # Minted by the server on the first deploy (the block's generated key);
      # no value stands in for it.
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      REGISTRATION_OPEN: "False"
      DB: sqlite
      DB_NAME: /data/hc.sqlite
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      # The server's sign-in gate sets X-Forwarded-Email on every request it
      # passes and drops the browser's copy. Healthchecks takes the header as
      # the signed-in user from whoever sends it, so the network decides who may
      # call it: it is on catena-healthchecks alone, which the gate and the
      # services that read or ping it join and no client app does.
      REMOTE_USER_HEADER: HTTP_X_FORWARDED_EMAIL
    labels:
      - "vps.auto-update=patch"
    volumes:
      - healthchecks-data:/data
    # Host mode with the long syntax: the short form publishes through the
    # ingress mesh. The server's consumers on the host reach /api/v3/ here.
    ports:
      - target: 8000
        published: 18000
        protocol: tcp
        mode: host
    networks:
      catena-healthchecks:
        aliases:
          - healthchecks

volumes:
  healthchecks-data:

networks:
  catena-healthchecks:
    external: true
