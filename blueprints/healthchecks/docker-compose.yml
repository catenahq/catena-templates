x-catena:
  schema: 2
  requires_catena: 0.13.4
  version_from: app
  env:
    DOMAIN_HOST:
      setting: {default: "healthchecks.{{ cloudflare_zone }}"}
    SECRET_KEY:
      generated: {length: 50, alphabet: alnum}
    ADMIN_EMAIL:
      managed: {expr: "{{ admin_email }}"}
    PING_KEY:
      generated: {length: 32, alphabet: alnum}
    READ_KEY:
      generated: {length: 32, alphabet: alnum}
    API_KEY:
      generated: {length: 32, alphabet: alnum}
    SUPERUSER_PASSWORD:
      generated: {length: 32, alphabet: alnum}
    EMAIL_HOST:
      managed: {expr: "{{ smtp_relay_host | default('') }}"}
    EMAIL_PORT:
      managed: {expr: "{{ smtp_relay_port | default('') }}"}
    EMAIL_HOST_USER:
      managed: {expr: "{{ smtp_relay_user | default('') }}"}
    EMAIL_HOST_PASSWORD:
      managed: {expr: "{{ smtp_password | default('') }}"}
    SMTP_RELAY_TLS:
      managed: {expr: "{{ smtp_relay_tls | default('') }}"}
    DEFAULT_FROM_EMAIL:
      managed: {expr: "{{ smtp_relay_sender | default('') }}"}
    AUTH_MODE:
      setting: {default: "admin-only", label: {en: "Access: public, private or admin-only", fr: "Accès : public, private ou admin-only"}}
    UPDATE_LEVEL:
      setting: {default: "major", label: {en: "Automatic updates: major, minor, patch or off", fr: "Mises à jour automatiques : major, minor, patch ou off"}}
  # smtp_password is the outgoing mail's password.
  secrets: [smtp_password]
  # configure runs after every deploy in the app's own container: it sets up the one
  # superuser and the project, pins the project's three keys to the generated ones, and
  # keeps the admin's email channel while outgoing mail is on. verify asks the status
  # endpoint, which reads the database, with the Host the app always allows.
  hooks:
    service: app
    timeout_seconds: 300
    configure:
      - - python3
        - -c
        - |
          import json
          import os
          import sys
          import uuid

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "hc.settings")
          sys.path.insert(0, os.getcwd())
          import django

          django.setup()

          from django.contrib.auth import get_user_model
          from hc.accounts.models import Profile, Project
          from hc.api.models import Channel

          # The folder's .env is this script's environment. A missing key raises KeyError, so a
          # wiring break fails the deploy.
          email = os.environ["ADMIN_EMAIL"]
          password = os.environ["SUPERUSER_PASSWORD"]
          ping_key = os.environ.get("PING_KEY", "")
          read_key = os.environ.get("READ_KEY", "")
          write_key = os.environ.get("API_KEY", "")
          project_name = os.environ.get("HC_PROJECT_NAME", "")
          mail_on = bool(os.environ.get("EMAIL_HOST", ""))
          if not email:
              sys.exit("ADMIN_EMAIL is empty")

          User = get_user_model()
          login = email.lower()

          # The superuser owns the project that holds the ping key, so an admin email change
          # renames that one user. With no such project yet it is the user named after the
          # admin email, created when missing. The username and email are lower case, which is how
          # the sign-in form matches them; the email channel keeps the address as given. The
          # password is set on creation only.
          project = Project.objects.filter(ping_key=ping_key).first() if ping_key else None
          operator = project.owner if project else (
              User.objects.filter(username=login).first()
              or User.objects.filter(email__iexact=login).first())
          if operator is None:
              operator = User.objects.create_superuser(username=login, email=login, password=password)
          else:
              wanted = {"username": login, "email": login, "is_superuser": True, "is_staff": True}
              changed = [f for f, v in wanted.items() if getattr(operator, f) != v]
              for field in changed:
                  setattr(operator, field, wanted[field])
              if changed:
                  operator.save(update_fields=changed)

          # The theme is NULL until a person chooses; "" is a deliberate Light. Only NULL
          # follows the browser's preference.
          profile = Profile.objects.for_user(operator)
          if profile.theme is None:
              profile.theme = "system"
              profile.save(update_fields=["theme"])

          # Project.objects.create skips the sign-up flow's tutorial check and email channel.
          if project is None:
              project = Project.objects.filter(owner=operator).first()
          if project is None:
              project = Project.objects.create(owner=operator, name=project_name or "Catena")

          # GET /api/v3/checks/ needs the read-only key; creating, updating, pausing and
          # resuming a check need the full key. An empty value leaves the project's key as it is.
          fields = ["name"]
          if project_name:
              project.name = project_name
          elif not project.name:
              project.name = "Catena"
          for field, value in (("api_key_readonly", read_key), ("api_key", write_key), ("ping_key", ping_key)):
              if value:
                  setattr(project, field, value)
                  fields.append(field)
          project.save(update_fields=fields)

          # The admin's email is an alert channel while outgoing mail is on; it carries a fixed
          # code, so a deploy updates or removes that one row and never a channel a person added.
          # It is created notifying on down and on up and attached to every check, once. After
          # that a deploy sets only its address and its verified mark, so a person's up or down
          # choice stays and a check a person detaches it from stays detached. An email channel
          # is marked verified: Healthchecks sends nothing to an unverified one.
          code = uuid.uuid5(uuid.NAMESPACE_URL, "catena:healthchecks:admin-email")
          if mail_on:
              channel = Channel.objects.filter(project=project, code=code).first()
              if channel is None:
                  channel = Channel.objects.create(
                      project=project,
                      code=code,
                      kind="email",
                      value=json.dumps({"value": email, "up": True, "down": True}),
                      name="Admin email",
                      email_verified=True,
                  )
                  channel.assign_all_checks()
              else:
                  try:
                      choice = json.loads(channel.value)
                  except ValueError:
                      choice = {"up": True, "down": True}
                  choice["value"] = email
                  channel.value = json.dumps(choice)
                  channel.email_verified = True
                  channel.save(update_fields=["value", "email_verified"])
              print("OK email=" + str(channel.code))
          else:
              Channel.objects.filter(project=project, code=code).delete()
              print("OK email=none")
    verify:
      - - python3
        - -c
        - |
          import sys
          import urllib.request

          request = urllib.request.Request("http://127.0.0.1:8000/api/v3/status/", headers={"Host": "localhost"})
          try:
              body = urllib.request.urlopen(request, timeout=20).read().decode().strip()
          except Exception as e:
              print("Healthchecks does not answer its status endpoint: " + str(e), file=sys.stderr)
              sys.exit(1)
          if body != "OK":
              print("the status endpoint answered " + body[:80], file=sys.stderr)
              sys.exit(1)
          print("Healthchecks answers and reads its database")
  data:
    app: {volume: healthchecks-data, upgrade: in_place, sqlite: [/data/hc.sqlite]}

services:
  app:
    image: healthchecks/healthchecks:v5.0.3
    deploy:
      restart_policy:
        condition: any
        delay: 5s
      # healthchecks-data is the SQLite database holding every check and its
      # ping history. An empty one on another node is a monitoring plane that
      # has forgotten what it watches.
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      SITE_ROOT: https://${DOMAIN_HOST}
      SITE_NAME: heartbeats
      # Django matches ALLOWED_HOSTS against the literal Host header: the address
      # the gate passes on, and the loopback the hooks ask.
      ALLOWED_HOSTS: ${DOMAIN_HOST},localhost,127.0.0.1
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      REGISTRATION_OPEN: "False"
      DB: sqlite
      DB_NAME: /data/hc.sqlite
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      SMTP_RELAY_TLS: ${SMTP_RELAY_TLS:-}
    # Healthchecks reads EMAIL_USE_TLS and EMAIL_USE_SSL as True or False, and the
    # relay fact is tls or ssl: the wrapper maps it, then starts the image's own
    # command. Its default is STARTTLS, which is the tls fact.
    command:
      - sh
      - -c
      - |
        if [ "$$SMTP_RELAY_TLS" = ssl ]; then export EMAIL_USE_TLS=False EMAIL_USE_SSL=True; fi
        exec /opt/healthchecks/run.sh
    labels:
      - "vps.route.host=${DOMAIN_HOST}"
      - "vps.route.port=8000"
      - "vps.auth.mode=${AUTH_MODE:-admin-only}"
      - "vps.auth.protected=true"
      - "vps.auto-update=${UPDATE_LEVEL:-major}"
    volumes:
      - healthchecks-data:/data
    cap_drop:
      - NET_RAW
    networks:
      catena-network: {}
      default: {}

volumes:
  healthchecks-data:

networks:
  catena-network:
    external: true
