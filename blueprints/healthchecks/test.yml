# Test for the healthchecks template: the project the configure hook made gets a check
# and two pings through the app, and the project's API key reads them back, also after
# a restore. A seed replaces the check an earlier seed made, so the project holds one
# whatever the number of seeds before the backup. The assert sets the project's read-only key to the first 32 hex characters
# of a hash of the run id before it asks the API, because every deploy's configure hook
# puts the server's own key back. The ping and the API are asked at 127.0.0.1 with the
# Host localhost that the app always allows.

id: healthchecks
description: >-
  A check pinged twice is listed up with two pings by the API of the project the
  configure hook made, before and after the backup, the restore and the updates.

seed:
  - name: check_and_pings_in_the_hook_project
    type: docker_exec
    container: "{{ container_app }}"
    command:
      - python
      - manage.py
      - shell
      - -c
      - |
        import urllib.request
        from hc.accounts.models import Project
        from hc.api.models import Check
        project = Project.objects.order_by("id").first()
        assert project is not None, "the configure hook made no project"
        Check.objects.filter(project=project, name="catena-{{ run_id }}").delete()
        check = Check.objects.create(project=project, name="catena-{{ run_id }}", slug="catena-test", tags="catena")
        for _ in range(2):
            request = urllib.request.Request("http://127.0.0.1:8000/ping/" + str(check.code), headers={"Host": "localhost"})
            assert urllib.request.urlopen(request, timeout=20).read() == b"OK"
        print("seeded " + str(check.code))
    expect_stdout_contains: "seeded "
    timeout_s: 120

assert:
  - name: api_lists_the_check_up_with_two_pings
    type: docker_exec
    container: "{{ container_app }}"
    command:
      - python
      - manage.py
      - shell
      - -c
      - |
        import hashlib
        import json
        import sys
        import urllib.request
        from hc.accounts.models import Project
        project = Project.objects.order_by("id").first()
        api_key = hashlib.sha256(b"api-key-{{ run_id }}").hexdigest()[:32]
        project.api_key_readonly = api_key
        project.save(update_fields=["api_key_readonly"])
        request = urllib.request.Request(
            "http://127.0.0.1:8000/api/v3/checks/",
            headers={"Host": "localhost", "X-Api-Key": api_key})
        checks = json.load(urllib.request.urlopen(request, timeout=20))["checks"]
        found = [c for c in checks if c["name"] == "catena-{{ run_id }}"]
        if len(found) != 1 or found[0]["n_pings"] != 2 or found[0]["status"] != "up":
            print("unexpected checks: " + json.dumps(checks)[:400])
            sys.exit(1)
        print("healthchecks api ok")
    expect_stdout_contains: "healthchecks api ok"
    timeout_s: 120
