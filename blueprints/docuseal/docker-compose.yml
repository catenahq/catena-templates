x-catena:
  schema: 2
  env:
    DOMAIN_HOST:
      setting: {default: "sign.{{ cloudflare_zone }}"}
    DOCUSEAL_HOSTNAME:
      setting: {default: "sign.{{ cloudflare_zone }}"}
    SECRET_KEY_BASE:
      generated: {length: 128, alphabet: hex}
    DB_PASSWORD:
      generated: {length: 32, alphabet: alnum}
    SMTP_HOST:
      setting: {default: ""}
    SMTP_PORT:
      setting: {default: "587"}
    SMTP_USERNAME:
      setting: {default: ""}
    SMTP_PASSWORD:
      setting: {default: ""}
    SMTP_FROM_ADDRESS:
      setting: {default: ""}
    SMTP_AUTH:
      setting: {default: "plain"}
  images:
    db:
      rule: {kind: partial_line}
  # verify asks the running Rails server for /up and for its web manifest, which names the product.
  # X-Forwarded-Proto keeps FORCE_SSL from redirecting the loopback request.
  hooks:
    service: docuseal
    timeout_seconds: 60
    verify:
      - - sh
        - -c
        - |
          ruby -rnet/http -rjson -e '
            get = lambda do |path|
              Net::HTTP.start("127.0.0.1", 3000, open_timeout: 10, read_timeout: 20) do |http|
                http.request(Net::HTTP::Get.new(path, "X-Forwarded-Proto" => "https"))
              end
            end
            begin
              up = get.call("/up")
              manifest = get.call("/manifest")
            rescue SystemCallError, Timeout::Error, SocketError => e
              abort "DocuSeal does not answer on 3000: #{e.message}"
            end
            abort "DocuSeal /up answered #{up.code}" unless up.code == "200"
            name = begin
              JSON.parse(manifest.body)["name"]
            rescue JSON::ParserError
              nil
            end
            abort "DocuSeal /manifest answered #{manifest.code} without the product name" unless manifest.code == "200" && name == "DocuSeal"
            puts "DocuSeal answers on 3000"
          '

services:
  docuseal:
    image: docuseal/docuseal:3.2.6
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      HOST: https://${DOCUSEAL_HOSTNAME}
      FORCE_SSL: "true"
      DATABASE_URL: postgres://docuseal:${DB_PASSWORD}@db:5432/docuseal
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}

      # SMTP -- DocuSeal uses SMTP_* env vars. Optional; when unset,
      # signature-request emails are not delivered (recipients still
      # see pending requests in their dashboard if they sign in).
      SMTP_ADDRESS: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM_ADDRESS:-}
      SMTP_AUTHENTICATION: ${SMTP_AUTH:-plain}
    volumes:
      - docuseal-data:/data
    labels:
      - "vps.homepage.name=DocuSeal"
      - "vps.homepage.description=Send documents to be signed online and keep a record of each signature."
      - "vps.homepage.description-fr=Envoi de documents à signer en ligne, avec la trace de chaque signature."
      - "vps.route.host=${DOMAIN_HOST}"
      - "vps.route.port=3000"
      - "vps.auth.mode=public"
      - "vps.auto-update=patch"
    cap_drop:
      - NET_RAW
    networks:
      catena-network: {}
      default: {}

  db:
    image: postgres:18.6-alpine
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      POSTGRES_USER: docuseal
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: docuseal
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuseal"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10m
    labels:
      - "vps.auto-update=minor"
    networks:
      - default

volumes:
  docuseal-data:
  db-data:

networks:
  catena-network:
    external: true
