schema: 2
requires_catena: 0.12.2
env:
  DOMAIN_HOST:
    setting: {default: "sign.{{ cloudflare_zone }}"}
  DOCUSEAL_HOSTNAME:
    setting: {default: "sign.{{ cloudflare_zone }}"}
  SECRET_KEY_BASE:
    generated: {length: 128, alphabet: hex}
  DB_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  SMTP_HOST:
    setting: {default: ""}
  SMTP_PORT:
    setting: {default: "587"}
  SMTP_USERNAME:
    setting: {default: ""}
  SMTP_PASSWORD:
    setting: {default: ""}
  SMTP_FROM_ADDRESS:
    setting: {default: ""}
  SMTP_AUTH:
    setting: {default: "plain"}
  AUTH_MODE:
    setting: {default: "public", label: {en: "Access: public, private or admin-only", fr: "Accès : public, private ou admin-only"}}
  UPDATE_LEVEL:
    setting: {default: "major", label: {en: "Automatic updates: major, minor, patch or off", fr: "Mises à jour automatiques : major, minor, patch ou off"}}
images:
  db:
    rule: {kind: partial_line}
# verify asks the running Rails server for /up and for its web manifest, which names the product.
# X-Forwarded-Proto keeps FORCE_SSL from redirecting the loopback request.
hooks:
  service: docuseal
  timeout_seconds: 60
  verify:
    - hooks/verify.sh
