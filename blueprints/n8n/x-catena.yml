schema: 2
requires_catena: 0.14.0
env:
  DOMAIN_HOST:
    setting: {default: "automate.{{ cloudflare_zone }}"}
  N8N_HOSTNAME:
    setting: {default: "automate.{{ cloudflare_zone }}"}
  N8N_TIMEZONE:
    setting: {default: "UTC"}
  N8N_ENCRYPTION_KEY:
    generated: {length: 64, alphabet: alnum}
  N8N_JWT_SECRET:
    generated: {length: 64, alphabet: alnum}
  DB_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  AUTH_MODE:
    setting: {default: "public", label: {en: "Access: public, private or admin-only", fr: "Accès : public, private ou admin-only"}}
  UPDATE_LEVEL:
    setting: {default: "major", label: {en: "Automatic updates: major, minor, patch or off", fr: "Mises à jour automatiques : major, minor, patch ou off"}}
# The n8n service writes its data folder while it runs, so a still copy needs it stopped for the backup.
quiesce:
  stop: true
images:
  db:
    rule: {kind: partial_line}
# verify asks the running server for /healthz/readiness, which answers 200 once the database is
# connected and the migrations are done; it waits up to 90 s for a starting server.
hooks:
  service: n8n
  timeout_seconds: 120
  verify:
    - hooks/verify.js
# n8n-data holds the settings file with the encryption key and the installed community nodes; the
# workflows and executions are in the database. Watched by the backup, copied by no update.
unversioned_volumes: {n8n-data: files}
