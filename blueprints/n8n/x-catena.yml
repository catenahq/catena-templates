schema: 2
requires_catena: 0.11.12
env:
  DOMAIN_HOST:
    setting: {default: "automate.{{ cloudflare_zone }}"}
  N8N_HOSTNAME:
    setting: {default: "automate.{{ cloudflare_zone }}"}
  N8N_TIMEZONE:
    setting: {default: "UTC"}
  N8N_ENCRYPTION_KEY:
    generated: {length: 64, alphabet: alnum}
  N8N_JWT_SECRET:
    generated: {length: 64, alphabet: alnum}
  DB_PASSWORD:
    generated: {length: 32, alphabet: alnum}
images:
  db:
    rule: {kind: partial_line}
# verify asks the running server for /healthz/readiness, which answers 200 once the database is
# connected and the migrations are done.
hooks:
  service: n8n
  timeout_seconds: 60
  verify:
    - hooks/verify.js
