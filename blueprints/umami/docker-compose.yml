x-catena:
  schema: 2
  requires_catena: 0.12.6
  env:
    DOMAIN_HOST:
      setting: {default: "visits.{{ cloudflare_zone }}", label: {en: "Address of Umami", fr: "Adresse d'Umami"}}
    TRACKER_SCRIPT_NAME:
      setting: {default: "app.js", label: {en: "File name of the tracking script", fr: "Nom du fichier du script de suivi"}}
    COLLECT_API_ENDPOINT:
      setting: {default: "/api/data", label: {en: "Path where sites send their visits", fr: "Chemin où les sites envoient leurs visites"}}
    APP_SECRET:
      generated: {length: 64, alphabet: hex}
    TWO_FACTOR_ENCRYPTION_KEY:
      generated: {length: 64, alphabet: hex}
    UMAMI_ADMIN_PASSWORD:
      generated: {length: 32, alphabet: alnum, first_start_only: true, note: "Password of the Umami account admin, set at the first start; a later change here does nothing"}
    DB_PASSWORD:
      generated: {length: 32, alphabet: alnum}
    AUTH_MODE:
      setting: {default: "admin-only", label: {en: "Access: public, private or admin-only", fr: "Accès : public, private ou admin-only"}}
    UPDATE_LEVEL:
      setting: {default: "major", label: {en: "Automatic updates: major, minor, patch or off", fr: "Mises à jour automatiques : major, minor, patch ou off"}}
  lifecycle:
    service: "umami"
    ready: ["node", "-e", "require('net').connect(3000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
    migrate:
      - ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    timeout_seconds: 900
  images:
    db:
      rule: {kind: partial_line}
  # verify asks the running server for its heartbeat, its tracking script and the default sign-in, which a database that
  # answers refuses.
  hooks:
    service: umami
    timeout_seconds: 60
    verify:
      - - node
        - -e
        - |
          const fail = (m) => {
            console.error(m);
            process.exit(1);
          };
          const base = 'http://127.0.0.1:3000';
          const name = String(process.env.TRACKER_SCRIPT_NAME);
          if (!name || name.startsWith('/') || name.includes(',')) {
            fail('TRACKER_SCRIPT_NAME must be one file name with no leading / and no comma, found ' + name);
          }
          const script = '/' + name;
          const collect = process.env.COLLECT_API_ENDPOINT;
          const call = (path, init) => fetch(base + path, { ...init, signal: AbortSignal.timeout(15000) });
          (async () => {
            const heartbeat = await call('/api/heartbeat');
            const reply = await heartbeat.json().catch(() => null);
            if (heartbeat.status !== 200 || !reply || reply.ok !== true) {
              fail('Umami /api/heartbeat answered ' + heartbeat.status + ' without ok');
            }
            const tracker = await call(script);
            const body = await tracker.text();
            if (tracker.status !== 200 || !collect || !body.includes(collect)) {
              fail('Umami ' + script + ' answered ' + tracker.status + ' without the collect path ' + collect);
            }
            const login = await call('/api/auth/login', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ username: 'admin', password: 'umami' }),
            });
            if (login.status !== 401) {
              fail('Umami sign-in as admin with the default password answered ' + login.status + ', expected 401');
            }
            console.log('Umami answers its heartbeat and ' + script + ' and refuses the default password');
          })().catch((e) => fail('Umami does not answer on 3000: ' + e.message));

services:
  # Umami's first migration makes the account admin with a known default
  # password. The script UMAMI_ADMIN_JS, started beside the server, changes that
  # password to UMAMI_ADMIN_PASSWORD while the default still signs in, and leaves
  # a password someone set alone.
  umami:
    image: ghcr.io/umami-software/umami:3.5.0
    deploy:
      restart_policy:
        condition: any
    command: ["sh", "-c", "node -e \"$$UMAMI_ADMIN_JS\" & exec sh scripts/start-docker.sh"]
    environment:
      DATABASE_URL: postgresql://umami:${DB_PASSWORD}@db:5432/umami
      APP_SECRET: ${APP_SECRET}
      UMAMI_ADMIN_PASSWORD: ${UMAMI_ADMIN_PASSWORD}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY}
      TRACKER_SCRIPT_NAME: ${TRACKER_SCRIPT_NAME}
      COLLECT_API_ENDPOINT: ${COLLECT_API_ENDPOINT}
      PRIVATE_MODE: "1"
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
      UMAMI_ADMIN_JS: |
        const env = process.env;
        const api = "http://127.0.0.1:3000/api";
        const log = (m) => console.log("catena admin: " + m);
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
        const base = 3000;
        async function post(path, body, token) {
          const headers = { "content-type": "application/json" };
          if (token) headers.authorization = "Bearer " + token;
          const res = await fetch(api + path, { method: "POST", headers, body: JSON.stringify(body) });
          return { status: res.status, body: await res.json().catch(() => null) };
        }
        // The heartbeat is polled every base milliseconds until the server first
        // answers. Then only a 401 on the default password ends the script: every
        // other answer and every error is tried again, with a growing wait of at
        // most 5 minutes.
        (async () => {
          let up = false;
          for (let wait = base; ; wait = up ? Math.min(wait * 2, 300000) : base) {
            try {
              up = up || (await fetch(api + "/heartbeat")).ok;
              if (up) {
                const login = await post("/auth/login", { username: "admin", password: "umami" });
                if (login.status === 401) return log("the default password does not sign in; nothing changed");
                if (login.status < 300) {
                  const done = await post("/me/password", { currentPassword: "umami", newPassword: env.UMAMI_ADMIN_PASSWORD }, login.body.token);
                  if (done.status < 300) return log("administrator password set");
                  log("password change answered " + done.status + "; trying again");
                } else {
                  log("sign-in answered " + login.status + "; trying again");
                }
              }
            } catch (e) {
              log(e.message);
            }
            await sleep(wait);
          }
        })();
    labels:
      - "vps.route.host=${DOMAIN_HOST}"
      - "vps.route.port=3000"
      - "vps.auth.mode=${AUTH_MODE:-admin-only}"
      - "vps.auth.public_paths=/${TRACKER_SCRIPT_NAME},${COLLECT_API_ENDPOINT}"
      - "vps.health.path=/api/heartbeat"
      - "vps.health.expect=ok"
      - "vps.auto-update=${UPDATE_LEVEL:-major}"
    cap_drop:
      - NET_RAW
    networks:
      catena-network: {}
      default: {}

  db:
    image: postgres:18.7-alpine
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: umami
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10m
    labels:
      - "vps.auto-update=minor"
    networks:
      - default

volumes:
  db-data:

networks:
  catena-network:
    external: true
