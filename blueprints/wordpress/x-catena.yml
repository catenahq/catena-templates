schema: 2
requires_catena: 0.12.2
version_from: wp
env:
  DOMAIN_HOST:
    setting: {default: "www.{{ cloudflare_zone }}"}
  WORDPRESS_HOSTNAME:
    managed: {expr: "www.{{ cloudflare_zone }}"}
  WPMS_SMTP_PASS:
    managed: {expr: "{{ smtp_password | default('') }}"}
  DB_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  DB_ROOT_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  SMTP_RELAY_HOST:
    managed: {expr: "{{ smtp_relay_host | default('') }}"}
  SMTP_RELAY_PORT:
    managed: {expr: "{{ smtp_relay_port | default('') }}"}
  SMTP_RELAY_USER:
    managed: {expr: "{{ smtp_relay_user | default('') }}"}
  SMTP_RELAY_TLS:
    managed: {expr: "{{ smtp_relay_tls | default('') }}"}
  SMTP_RELAY_SENDER:
    managed: {expr: "{{ smtp_relay_sender | default('') }}"}

  UPDATE_LEVEL:
    setting: {default: "major", label: {en: "Automatic updates: major, minor, patch or off", fr: "Mises à jour automatiques : major, minor, patch ou off"}}
secrets: [smtp_password]
# configure runs after every deploy (add, settings, start, update, rollback,
# restore) once the install wizard has been run: it installs and activates
# the curated plugins that are missing, enables the Redis object cache, seeds
# the cache-purge settings and WP Mail SMTP's sender once, and puts WP Mail
# SMTP's relay back to the outgoing mail chosen in Settings. A plugin an
# administrator deactivated stays so. It leaves with 0 when the wizard has not
# been run or the plugin store does not answer, and the next deploy tries again.
hooks:
  service: wp
  user: www-data
  timeout_seconds: 1800
  configure:
    - hooks/configure.sh
  # verify asks nginx for the front page, which nginx hands to PHP, and looks for what WordPress sets: its
  # API link header, its redirect header (a site without its install wizard redirects to it) or its
  # content path.
  verify:
    - hooks/verify.php
# The configure hook fetches wp-cli from GitHub and the plugins from the WordPress.org
# plugin directory (its API and its download host).
egress: [raw.githubusercontent.com, downloads.wordpress.org, api.wordpress.org]
