x-catena:
  schema: 2
  version_from: wp
  env:
    DOMAIN_HOST:
      setting: {default: "www.{{ cloudflare_zone }}"}
    WORDPRESS_HOSTNAME:
      managed: {expr: "www.{{ cloudflare_zone }}"}
    WPMS_SMTP_PASS:
      managed: {expr: "{{ smtp_password | default('') }}"}
    DB_PASSWORD:
      generated: {length: 32, alphabet: alnum}
    DB_ROOT_PASSWORD:
      generated: {length: 32, alphabet: alnum}
    SMTP_RELAY_HOST:
      managed: {expr: "{{ smtp_relay_host | default('') }}"}
    SMTP_RELAY_PORT:
      managed: {expr: "{{ smtp_relay_port | default('') }}"}
    SMTP_RELAY_USER:
      managed: {expr: "{{ smtp_relay_user | default('') }}"}
    SMTP_RELAY_TLS:
      managed: {expr: "{{ smtp_relay_tls | default('') }}"}
    SMTP_RELAY_SENDER:
      managed: {expr: "{{ smtp_relay_sender | default('') }}"}

  secrets: [smtp_password]
  # configure runs after every deploy (add, settings, start, update, rollback,
  # restore) once the install wizard has been run: it installs and activates
  # the curated plugins that are missing, enables the Redis object cache, seeds
  # the cache-purge settings and WP Mail SMTP's sender once, and puts WP Mail
  # SMTP's relay back to the outgoing mail chosen in Settings. A plugin an
  # administrator deactivated stays so. It leaves with 0 when the wizard has not
  # been run or the plugin store does not answer, and the next deploy tries again.
  hooks:
    service: wp
    user: www-data
    timeout_seconds: 1800
    configure:
      - - sh
        - -c
        - |
          set -u
          WP_CLI=/tmp/wp-cli.phar
          SEED=/tmp/catena-seed.php
          say() { echo "catena: $$*"; }
          wp() { php -d memory_limit=512M "$$WP_CLI" --path=/var/www/html "$$@"; }

          if [ ! -f /var/www/html/wp-load.php ]; then
            say "the WordPress files are not there yet; the wiring is left for the next deploy"
            exit 0
          fi
          if [ ! -f "$$WP_CLI" ]; then
            if ! php -r 'copy("https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar", "/tmp/wp-cli.phar.part");' 2>/dev/null \
                || ! mv /tmp/wp-cli.phar.part "$$WP_CLI"; then
              say "wp-cli could not be downloaded; the wiring is left for the next deploy" >&2
              exit 0
            fi
          fi

          waited=0
          until wp core is-installed >/dev/null 2>&1; do
            if [ "$$waited" -ge 60 ]; then
              say "the install wizard has not been run; the plugins are installed by the first deploy after it"
              exit 0
            fi
            sleep 2
            waited=$$((waited + 2))
          done

          # Performance Lab ships its modules as separate plugins; the parent
          # does not install them.
          for slug in kadence-blocks performance-lab auto-sizes dominant-color-images embed-optimizer \
              image-prioritizer optimization-detective speculation-rules webp-uploads \
              fastcgi-cache-purge-and-preload-nginx redis-cache wp-mail-smtp wp-mail-logging \
              complianz-gdpr wp-consent-api seo-by-rank-math fluentform; do
            if ! wp plugin is-installed "$$slug" >/dev/null 2>&1; then
              wp plugin install "$$slug" --activate >/dev/null 2>&1 \
                || say "$$slug could not be installed; the next deploy tries again" >&2
            fi
          done

          # The constants in WORDPRESS_CONFIG_EXTRA point the plugin at the redis service.
          if wp plugin is-active redis-cache >/dev/null 2>&1 && ! wp redis status 2>&1 | grep -q Connected; then
            wp redis enable >/dev/null 2>&1 || say "the Redis object cache could not be enabled" >&2
          fi

          # Options an administrator also edits are seeded once per site, each
          # with a marker option, and are the site's from then on. Keys the site
          # already holds win over the values seeded. WP Mail SMTP's relay follows
          # Settings on every deploy; its password is not an option: the
          # WPMS_SMTP_PASS constant carries it.
          cat > "$$SEED" <<'PHP'
          <?php
          if (get_option("catena_npp_seeded") === false) {
            $$desired = array(
              "nginx_cache_path" => "/var/cache/nginx/fastcgi",
              "nginx_cache_method" => "unlink",
              "nginx_cache_reject_regex" => "/wp-admin/|/wp-.*\\.php|/feed/|/sitemap.*\\.xml",
              "nginx_cache_auto_purge" => "1",
              "nginx_cache_purge_homepage_on_edit" => "1",
              "nginx_cache_purge_homepage_on_del" => "1",
              "nginx_cache_preload_enable" => "1",
              "nginx_cache_preload_method" => "wget",
              "nginx_cache_preload_sitemap" => "/sitemap_index.xml"
            );
            $$current = get_option("nginx_cache_settings");
            if (!is_array($$current)) { $$current = array(); }
            update_option("nginx_cache_settings", array_merge($$desired, $$current));
            add_option("catena_npp_seeded", "1", "", "no");
          }
          $$host = (string) getenv("SMTP_RELAY_HOST");
          if ($$host !== "") {
            $$seed = get_option("catena_mail_seeded") === false;
            $$sender = (string) getenv("SMTP_RELAY_SENDER");
            $$old = get_option("wp_mail_smtp");
            $$o = is_array($$old) ? $$old : array();
            $$mail = (isset($$o["mail"]) && is_array($$o["mail"])) ? $$o["mail"] : array();
            $$smtp = (isset($$o["smtp"]) && is_array($$o["smtp"])) ? $$o["smtp"] : array();
            if ($$seed) {
              // WP Mail SMTP fills the sender with the site's admin email when
              // it is activated, so that value counts as unset.
              $$admin = strtolower(trim((string) get_option("admin_email")));
              $$from = strtolower(trim((string) (isset($$mail["from_email"]) ? $$mail["from_email"] : "")));
              if ($$admin !== "" && $$from === $$admin) { unset($$mail["from_email"]); }
              $$mail = $$mail + array(
                "from_email" => $$sender, "from_email_force" => true,
                "from_name" => $$sender, "from_name_force" => false, "return_path" => false
              );
            }
            $$mail["mailer"] = "smtp";
            $$smtp = array_merge($$smtp, array(
              "host" => $$host, "port" => (int) getenv("SMTP_RELAY_PORT"),
              "encryption" => (string) getenv("SMTP_RELAY_TLS"), "autotls" => true, "auth" => true,
              "user" => (string) getenv("SMTP_RELAY_USER")
            ));
            $$o["mail"] = $$mail;
            $$o["smtp"] = $$smtp;
            if ($$o !== $$old) { update_option("wp_mail_smtp", $$o); }
            if ($$seed) { add_option("catena_mail_seeded", "1", "", "no"); }
          }
          PHP
          status=0
          wp eval-file "$$SEED" >/dev/null || { echo "catena: the cache and mail settings could not be written" >&2; status=1; }
          rm -f "$$SEED"
          exit "$$status"
    # verify asks nginx for the front page, which nginx hands to PHP, and looks for what WordPress sets: its
    # API link header, its redirect header (a site without its install wizard redirects to it) or its
    # content path.
    verify:
      - - php
        - -r
        - |
          $$context = stream_context_create(['http' => [
            'timeout' => 20, 'ignore_errors' => true, 'follow_location' => 0,
            'header' => "X-Forwarded-Proto: https\r\n",
          ]]);
          $$body = @file_get_contents('http://nginx/', false, $$context);
          if ($$body === false || !isset($$http_response_header[0]) || !preg_match('/ (\d{3})/', $$http_response_header[0], $$m)) {
            fwrite(STDERR, 'WordPress does not answer through nginx' . "\n");
            exit(1);
          }
          $$code = (int) $$m[1];
          $$headers = strtolower(implode("\n", $$http_response_header));
          $$wordpress = strpos($$headers, 'api.w.org') !== false
            || strpos($$headers, 'x-redirect-by: wordpress') !== false
            || strpos($$body, 'wp-content') !== false;
          if (!in_array($$code, [200, 301, 302], true) || !$$wordpress) {
            fwrite(STDERR, 'nginx answers ' . $$code . ', but not with a WordPress page' . "\n");
            exit(1);
          }
          echo "WordPress answers through nginx and PHP\n";
services:
  wp:
    image: wordpress:7.1.4-fpm-alpine
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: "0"
      # Behind Traefik -- WP must honor X-Forwarded-Proto to build
      # HTTPS URLs. Redis + cache-key salt wire the redis-cache plugin
      # to the redis service; one site per hostname so two installs
      # cannot collide on shared object-cache keys.
      # WP Mail SMTP authenticates with the relay password from
      # WPMS_SMTP_PASS when that env is set (outgoing mail chosen in the
      # panel): WPMS_ON turns its constants on, and only the password is
      # one, so every other setting stays in its option. With the env
      # empty neither is defined and the plugin reads its own option.
      WPMS_SMTP_PASS: ${WPMS_SMTP_PASS}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'FORCE_SSL_ADMIN', true );
        if ( isset( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https' ) {
            $$_SERVER['HTTPS'] = 'on';
        }
        define( 'WP_REDIS_HOST', 'redis' );
        define( 'WP_REDIS_PORT', 6379 );
        define( 'WP_REDIS_DATABASE', 0 );
        define( 'WP_CACHE_KEY_SALT', '${WORDPRESS_HOSTNAME}_' );
        $$_wpms_smtp_pass = getenv( 'WPMS_SMTP_PASS' );
        if ( $$_wpms_smtp_pass !== false && $$_wpms_smtp_pass !== '' ) {
            define( 'WPMS_ON', true );
            define( 'WPMS_SMTP_PASS', $$_wpms_smtp_pass );
        }
    volumes:
      - wp-files:/var/www/html
      - wp-cache:/var/cache/nginx/fastcgi
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-load.php"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

  nginx:
    image: nginx:1.31.8-alpine
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    # Add www-data uid 82 (matches php-fpm-alpine) before starting nginx
    # so workers can read/write the FastCGI cache that NPP unlinks from
    # php-fpm. Ensure the cache dir is owned by www-data on first boot.
    #
    # The whole nginx.conf is written here rather than declared as a
    # `configs:` entry: a swarm stack file's `configs.file` reads a path
    # beside the compose, and neither deploy path has one -- the blueprint
    # directory carries only the compose, and a stack created from a posted
    # string has no directory at all. It replaces the distro default rather
    # than adding a server snippet because the `user` directive that aligns
    # the worker UID lives in the main context.
    #
    # `$$` is compose's escape for a literal `$`: every variable below is
    # nginx's, and must reach nginx rather than be interpolated at deploy.
    command:
      - /bin/sh
      - -c
      - |
        addgroup -g 82 -S www-data 2>/dev/null || true
        adduser -u 82 -D -S -G www-data www-data 2>/dev/null || true
        mkdir -p /var/cache/nginx/fastcgi /var/log/nginx
        chown -R www-data:www-data /var/cache/nginx/fastcgi /var/log/nginx
        cat > /etc/nginx/nginx.conf <<'NGINX'
        user www-data;
        worker_processes auto;
        pid /var/run/nginx.pid;
        error_log /var/log/nginx/error.log warn;

        events {
            worker_connections 1024;
            use epoll;
            multi_accept on;
        }

        http {
            include       /etc/nginx/mime.types;
            default_type  application/octet-stream;

            log_format main '$$remote_addr - $$remote_user [$$time_local] "$$request" '
                            '$$status $$body_bytes_sent "$$http_referer" '
                            '"$$http_user_agent" "$$http_x_forwarded_for" '
                            'cache=$$upstream_cache_status';
            access_log /var/log/nginx/access.log main;

            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;
            keepalive_timeout 65;
            types_hash_max_size 2048;
            server_tokens off;

            gzip on;
            gzip_vary on;
            gzip_proxied any;
            gzip_comp_level 6;
            gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

            fastcgi_cache_path /var/cache/nginx/fastcgi
                levels=1:2
                keys_zone=WORDPRESS:100m
                inactive=60m
                max_size=512m
                use_temp_path=off;
            # The hostname in the cache key below is intentional: it scopes the key
            # per hostname so a spoofed-Host response cannot be served to a
            # legitimate-Host visitor (cache-poisoning guard). Only the configured
            # domain reaches this nginx (Traefik host-routing behind a Cloudflare
            # tunnel), so the Host header is constrained upstream and cannot be used
            # to flood the cache zone.
            # nosemgrep: generic.nginx.security.request-host-used.request-host-used
            fastcgi_cache_key "$$scheme$$request_method$$host$$request_uri";

            map $$http_cookie $$skip_cache_cookie {
                default                       0;
                ~*comment_author              1;
                ~*wordpress_logged_in         1;
                ~*wp-postpass                 1;
                ~*woocommerce_items_in_cart   1;
                ~*woocommerce_cart_hash       1;
                ~*wp_woocommerce_session      1;
            }

            map $$request_uri $$skip_cache_uri {
                default                       0;
                ~*/wp-admin/                  1;
                ~*/wp-[^/]+\.php$$             1;
                ~*/xmlrpc\.php                1;
                ~*/feed/                      1;
                ~*\?.+                        1;
            }

            server {
                listen 80 default_server;
                listen [::]:80 default_server;
                server_name _;

                root /var/www/html;
                index index.php index.html;

                client_max_body_size 64M;

                set $$skip_cache 0;
                if ($$skip_cache_cookie)     { set $$skip_cache 1; }
                if ($$skip_cache_uri)        { set $$skip_cache 1; }
                if ($$request_method = POST) { set $$skip_cache 1; }

                location = /favicon.ico { log_not_found off; access_log off; }
                location = /robots.txt  { log_not_found off; access_log off; allow all; }

                location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|css|js|woff|woff2|ttf|eot|mp4|webm|pdf)$$ {
                    expires 30d;
                    add_header Cache-Control "public, immutable";
                    access_log off;
                    try_files $$uri =404;
                }

                location / {
                    try_files $$uri $$uri/ /index.php?$$args;
                }

                location ~ \.php$$ {
                    try_files $$uri =404;
                    include fastcgi_params;
                    fastcgi_split_path_info ^(.+\.php)(/.+)$$;
                    fastcgi_pass wp:9000;
                    fastcgi_index index.php;
                    fastcgi_param SCRIPT_FILENAME $$document_root$$fastcgi_script_name;
                    fastcgi_param PATH_INFO       $$fastcgi_path_info;
                    fastcgi_read_timeout 300;

                    fastcgi_cache WORDPRESS;
                    fastcgi_cache_valid 200 60m;
                    fastcgi_cache_valid 301 302 60m;
                    fastcgi_cache_valid 404 5m;
                    fastcgi_cache_use_stale error timeout invalid_header updating http_500 http_503;
                    fastcgi_cache_background_update on;
                    fastcgi_cache_lock on;
                    fastcgi_cache_bypass $$skip_cache;
                    fastcgi_no_cache    $$skip_cache;

                    add_header X-FastCGI-Cache $$upstream_cache_status;
                }

                location ~ /\.ht                                                  { deny all; }
                location ~* /(?:wp-config\.php|\.env|\.git|composer\.(json|lock))$$ { deny all; }
            }
        }
        NGINX
        exec nginx -g 'daemon off;'
    volumes:
      - wp-files:/var/www/html:ro
      - wp-cache:/var/cache/nginx/fastcgi
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "vps.homepage.name=WordPress"
      - "vps.homepage.description=A website and blog publishing system."
      - "vps.homepage.description-fr=Un système de publication de site web et de blogue."
      - "vps.route.host=${DOMAIN_HOST}"
      - "vps.route.port=80"
      - "vps.auth.mode=public"
      - "vps.auto-update=patch"
    cap_drop:
      - NET_RAW
    networks:
      catena-network: {}
      default: {}

  db:
    image: mariadb:12.3.3
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10m
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

  redis:
    image: redis:8.10.2-alpine
    deploy:
      restart_policy:
        condition: any
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

volumes:
  wp-files:
  wp-cache:
  db-data:

networks:
  catena-network:
    external: true
