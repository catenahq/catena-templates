schema: 2
requires_catena: 0.14.0
env:
  DOMAIN_HOST:
    setting: {default: "crm.{{ cloudflare_zone }}"}
  ESPOCRM_HOSTNAME:
    setting: {default: "crm.{{ cloudflare_zone }}"}
  ESPOCRM_ADMIN_USERNAME:
    setting: {default: "admin"}
  ESPOCRM_ADMIN_PASSWORD:
    generated: {length: 24, alphabet: alnum}
  DB_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  DB_ROOT_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  AUTH_MODE:
    setting: {default: "public", label: {en: "Access: public, private or admin-only", fr: "Accès : public, private ou admin-only"}}
  UPDATE_LEVEL:
    setting: {default: "major", label: {en: "Automatic updates: major, minor, patch or off", fr: "Mises à jour automatiques : major, minor, patch ou off"}}
lifecycle:
  service: "espocrm"
  user: "www-data"
  ready: ["php", "-r", "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
  migrate:
    - ["php", "rebuild.php"]
  versioned_volumes: ["custom", "client-custom"]
  timeout_seconds: 900
quiesce: {stop: true}
# verify asks Apache for the start page and for the REST API, which answers 401 to a request with no sign-in.
hooks:
  service: espocrm
  user: www-data
  timeout_seconds: 60
  verify:
    - hooks/verify.php
# server-data holds the config and the attachments: the image's migration only raises the version in the config, an
# older image reads it as it is, and the attachments grow without bound.
unversioned_volumes: {server-data: files}
