schema: 2
requires_catena: 0.12.2
env:
  DOMAIN_HOST:
    setting: {default: "support.{{ cloudflare_zone }}"}
  CHATWOOT_HOSTNAME:
    setting: {default: "support.{{ cloudflare_zone }}"}
  SECRET_KEY_BASE:
    generated: {length: 128, alphabet: hex}
  DB_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  AUTH_MODE:
    setting: {default: "public", label: {en: "Access: public, private or admin-only", fr: "Accès : public, private ou admin-only"}}
  UPDATE_LEVEL:
    setting: {default: "major", label: {en: "Automatic updates: major, minor, patch or off", fr: "Mises à jour automatiques : major, minor, patch ou off"}}
images:
  db:
    rule: {kind: pattern, tag_pattern: '(\d+)\.(\d+)\.(\d+)-pg18-trixie'}
# verify asks the running Rails server for /api, which reports the version and answers for Redis
# and Postgres. X-Forwarded-Proto keeps FORCE_SSL from redirecting the loopback request. The server
# listens only once the database is prepared, so the ask is repeated every 4 seconds while the port
# refuses, until 150 seconds after the hook started; the last answer is then judged.
hooks:
  service: rails
  timeout_seconds: 180
  verify:
    - hooks/verify.sh
