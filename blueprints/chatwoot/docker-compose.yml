x-catena:
  schema: 2
  env:
    DOMAIN_HOST:
      setting: {default: "support.{{ cloudflare_zone }}"}
    CHATWOOT_HOSTNAME:
      setting: {default: "support.{{ cloudflare_zone }}"}
    SECRET_KEY_BASE:
      generated: {length: 128, alphabet: hex}
    DB_PASSWORD:
      generated: {length: 32, alphabet: alnum}
  images:
    db:
      rule: {kind: partial_line}
  # verify asks the running Rails server for /api, which reports the version and answers for Redis
  # and Postgres. X-Forwarded-Proto keeps FORCE_SSL from redirecting the loopback request.
  hooks:
    service: rails
    timeout_seconds: 60
    verify:
      - - sh
        - -c
        - |
          ruby -rnet/http -rjson -e '
            begin
              res = Net::HTTP.start("127.0.0.1", 3000, open_timeout: 10, read_timeout: 20) do |http|
                http.request(Net::HTTP::Get.new("/api", "X-Forwarded-Proto" => "https"))
              end
            rescue SystemCallError, Timeout::Error, SocketError => e
              abort "Chatwoot does not answer on 3000: #{e.message}"
            end
            body = begin
              JSON.parse(res.body)
            rescue JSON::ParserError
              {}
            end
            abort "Chatwoot /api answered #{res.code} without a version" unless res.code == "200" && !body["version"].to_s.empty?
            abort "Chatwoot reports Redis #{body["queue_services"]} and Postgres #{body["data_services"]}" unless body["queue_services"] == "ok" && body["data_services"] == "ok"
            puts "Chatwoot #{body["version"]} answers, Redis and Postgres ok"
          '

services:
  rails:
    image: chatwoot/chatwoot:v4.17.1-ce
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      FRONTEND_URL: https://${CHATWOOT_HOSTNAME}
      DEFAULT_LOCALE: en
      FORCE_SSL: "true"
      INSTALLATION_NAME: "Chatwoot"
      POSTGRES_HOST: db
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      RAILS_LOG_TO_STDOUT: "true"
      ACTIVE_STORAGE_SERVICE: local
    volumes:
      - storage-data:/app/storage
    labels:
      - "vps.route.host=${DOMAIN_HOST}"
      - "vps.route.port=3000"
      - "vps.auth.mode=public"
      - "vps.auto-update=patch"
    cap_drop:
      - NET_RAW
    networks:
      catena-network: {}
      default: {}

  sidekiq:
    image: chatwoot/chatwoot:v4.17.1-ce
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      FRONTEND_URL: https://${CHATWOOT_HOSTNAME}
      POSTGRES_HOST: db
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      ACTIVE_STORAGE_SERVICE: local
    volumes:
      - storage-data:/app/storage
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

  db:
    image: postgres:18.6-alpine
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: chatwoot
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10m
    labels:
      - "vps.auto-update=minor"
    networks:
      - default

  redis:
    image: redis:8.6.7-alpine3.23
    deploy:
      restart_policy:
        condition: any
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

volumes:
  storage-data:
  db-data:

networks:
  catena-network:
    external: true
