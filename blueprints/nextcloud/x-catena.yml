schema: 2
requires_catena: 0.12.2
env:
  DOMAIN_HOST:
    managed: {expr: "nextcloud.{{ cloudflare_zone }}"}
  NEXTCLOUD_HOSTNAME:
    managed: {expr: "nextcloud.{{ cloudflare_zone }}"}
  NEXTCLOUD_ADMIN_USER:
    setting: {default: "admin"}
  NEXTCLOUD_ADMIN_PASSWORD:
    generated:
      length: 24
      alphabet: alnum
      first_start_only: true
      note: "Read only at Nextcloud's first start, which created the administrator account with it; this line keeps that first password. To change the password, sign in to Nextcloud as the administrator and change it in Settings, from the profile picture menu."
  DB_PASSWORD:
    generated:
      length: 32
      alphabet: alnum
      note: "The database keeps its own copy, as the password of its user nextcloud, and Nextcloud keeps another in config.php, as dbpassword. Change both to the new value first; until all three match, Nextcloud does not start."
  NEXTCLOUD_LOGLEVEL:
    setting: {default: "3"}
  NEXTCLOUD_VERSIONS_RETENTION:
    setting: {default: "auto, 7"}
  NEXTCLOUD_TRASH_RETENTION:
    setting: {default: "30, 30"}
  NEXTCLOUD_MAX_CHUNK_SIZE:
    setting: {default: "83886080"}
  NEXTCLOUD_DATA_LOCATION:
    setting: {default: "nc-data", first_start_only: true, label: {en: "Where Nextcloud keeps its files: nc-data, or a folder on a disk listed under Other folders to back up", fr: "Où Nextcloud garde ses fichiers : nc-data, ou un dossier d'un disque inscrit sous Autres dossiers à sauvegarder"}}
  SIGNALING_HOSTNAME:
    managed: {expr: "signaling.{{ cloudflare_zone }}"}
  SIGNALING_SECRET:
    generated:
      length: 64
      alphabet: alnum
      applied_on_deploy: true
      note: "Shared by Talk and its signaling server; both take the new value when the file is saved."
  TALK_INTERNAL_SECRET:
    generated:
      length: 64
      alphabet: alnum
      applied_on_deploy: true
      note: "Used inside the signaling server alone, which takes the new value when the file is saved."
  TURN_HOSTNAME:
    managed: {expr: "{{ provided.turn.host }}"}
  TURN_PORT:
    managed: {expr: "{{ provided.turn.port }}"}
  TURN_TLS_PORT:
    managed: {expr: "{{ provided.turn.tls_port }}"}
  TURN_SECRET:
    managed: {expr: "{{ provided.turn.secret }}"}
  WEBMAIL_HOSTNAME:
    setting: {default: "webmail.{{ cloudflare_zone }}"}
  ANTIVIRUS_HOST:
    managed: {expr: "{{ provided.antivirus.host }}"}
  ANTIVIRUS_PORT:
    managed: {expr: "{{ provided.antivirus.port }}"}
  OFFICE_EDITOR:
    managed: {expr: "{{ provided.office.editor }}"}
  OFFICE_URL:
    managed: {expr: "{{ provided.office.url }}"}
  OFFICE_JWT_SECRET:
    managed: {expr: "{{ provided.office.jwt_secret }}"}
  SMTP_RELAY_HOST:
    managed: {expr: "{{ smtp_relay_host | default('') }}"}
  SMTP_RELAY_PORT:
    managed: {expr: "{{ smtp_relay_port | default('') }}"}
  SMTP_RELAY_USER:
    managed: {expr: "{{ smtp_relay_user | default('') }}"}
  SMTP_RELAY_PASSWORD:
    managed: {expr: "{{ smtp_password | default('') }}"}
  SMTP_RELAY_TLS:
    managed: {expr: "{{ smtp_relay_tls | default('') }}"}
  SMTP_RELAY_SENDER:
    managed: {expr: "{{ smtp_relay_sender | default('') }}"}
  AUTH_MODE:
    setting: {default: "public", label: {en: "Access: public, private or admin-only", fr: "Accès : public, private ou admin-only"}}
  UPDATE_LEVEL:
    setting: {default: "major", label: {en: "Automatic updates: major, minor, patch or off", fr: "Mises à jour automatiques : major, minor, patch ou off"}}
secrets: [smtp_password]
access:
  user:
    label: {en: "Nextcloud", fr: "Nextcloud"}
lifecycle:
  service: "app"
  user: "www-data"
  ready: ["php", "occ", "status", "--exit-code"]
  migrate:
    - ["php", "occ", "db:add-missing-indices"]
    - ["php", "occ", "maintenance:repair", "--include-expensive"]
  versioned_volumes: ["nc-html", "nc-config", "nc-apps"]
  timeout_seconds: 1800
quiesce:
  service: "app"
  user: "www-data"
  pre:
    - ["php", "occ", "maintenance:mode", "--on"]
  post:
    - ["php", "occ", "maintenance:mode", "--off"]
  timeout_seconds: 60
# The boot probe starts app alone and asks Apache for status.php: installed
# and out of maintenance mode (occ status exits 0 for an uninstalled instance).
probe:
  service: app
  memory: 768m
  timeout_seconds: 180
  check:
    - php
    - -r
    - "exit(json_decode(file_get_contents('http://localhost/status.php'))->installed === true && json_decode(file_get_contents('http://localhost/status.php'))->maintenance === false ? 0 : 1);"
images:
  db:
    rule: {kind: partial_line}
  talk-hpb:
    rule: {kind: pattern, tag_pattern: '(\d{8})_(\d{6})', flat: true, registry: ghcr.io, repo: nextcloud-releases/aio-talk}
# configure runs after every deploy (add, settings, start, update, rollback,
# restore) and wires Nextcloud to the rest of the server: Keycloak sign-in,
# Mail, the virus scanner and the office editor the
# applications on this server provide, Talk with its signaling server and the
# call relay application, Nextcloud's outgoing mail from the server's mail
# relay, and the Webmail link. Talk's relay and signaling entries are written
# only while the relay application runs, and taken away when it goes; the
# signaling entry waits up to 60 seconds for the signaling server to answer; the
# mail settings follow the mail relay the same way; the entries written are
# recorded in the app settings of "catena". It leaves with 0 whenever
# occ cannot be used (first install running, maintenance mode on, a restore
# whose database is not replayed yet) and with 1 only when occ answers and a
# wiring command fails. An app an administrator disabled stays disabled; the
# scanner settings are written once. verify runs hourly and before an update:
# it asks occ, then Apache for status.php.
hooks:
  service: app
  user: www-data
  timeout_seconds: 1200
  configure:
    - hooks/configure.sh
  verify:
    - hooks/verify.sh
# The app store's index and the GitHub release downloads it links to, from
# which the configure hook installs each app it enables (Talk among them).
# apps.nextcloud.com answers most requests itself and redirects the rest to
# its mirrors garm1 to garm7.nextcloud.com.
egress: [apps.nextcloud.com, garm1.nextcloud.com, garm2.nextcloud.com, garm3.nextcloud.com, garm4.nextcloud.com, garm5.nextcloud.com, garm6.nextcloud.com, garm7.nextcloud.com, github.com, release-assets.githubusercontent.com]
