schema: 2
version_from: app
env:
  SUBDOMAIN:
    setting:
      default: beszel
      label:
        en: "Address prefix (the address moves the next time the server applies its configuration)"
        fr: "Préfixe de l'adresse (l'adresse change à la prochaine application de la configuration du serveur)"
  HUB_URL:
    managed: {expr: "http://beszel-hub:8090"}
provides:
  beszel: {url: HUB_URL}
  beszelgate: {url: HUB_URL}
# The hub image holds only the binary: no shell, curl or wget. verify runs in the
# busybox helper on the stack network and asks the hub's health endpoint.
hooks:
  service: probe
  timeout_seconds: 60
  verify:
    - hooks/verify.sh
data:
  app: {volume: beszel-hub-data, upgrade: in_place}
