services:
  app:
    image: henrygd/beszel:0.21.1
    deploy:
      restart_policy:
        condition: any
        delay: 5s
      # beszel-hub-data holds the hub's databases and its SSH key. An empty one
      # on another node is a hub that has forgotten every system it watches.
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      # The server writes these four into the app's .env. The hub treats an
      # empty TRUSTED_AUTH_HEADER or TRUSTED_PROXY_IPS as unset; the header is
      # trusted from every peer when only the proxy list is empty, so the server
      # writes the two together or not at all. The hub writes APP_URL over its
      # stored address each time it starts.
      APP_URL: ${APP_URL:-http://localhost:8090}
      USER_CREATION: ${USER_CREATION:-}
      TRUSTED_AUTH_HEADER: ${TRUSTED_AUTH_HEADER:-}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
    labels:
      - "vps.auto-update=patch"
    volumes:
      - beszel-hub-data:/beszel_data
    # Host mode with the long syntax: the short form publishes through the
    # ingress mesh. The host-network agent reaches the hub here.
    ports:
      - target: 8090
        published: 18190
        protocol: tcp
        mode: host
    networks:
      default: {}
      # The alias is on both networks: Gatus reaches the hub on catena-beszel,
      # and the sign-in gate on catena-beszelgate, which only the gate and the
      # hub join.
      catena-beszel:
        aliases:
          - beszel-hub
      catena-beszelgate:
        aliases:
          - beszel-hub

  # Reports the metrics of the node it runs on, read through that node's Docker
  # socket. It is on the host network, so it reaches the hub through the loopback
  # publish above. It connects with the universal token, which makes the hub list
  # its system on the first connection, and verifies the hub with the public key.
  # The relay's configure hook writes the key and the token to the agent-key volume,
  # which the agent reads and cannot write. The hook runs once the deploy has
  # converged, so the agent's shell waits for both files before it runs the agent: an
  # agent that exited without them would keep the deploy from converging. DISABLE_SSH
  # removes the agent's own listener, which it would open as a fallback when the hub
  # is unreachable.
  agent:
    image: henrygd/beszel-agent:0.21.1-alpine@sha256:4100e26f7b5e6ab89e73699b2366417795f5046ab36bc452daf1f105766b40a0
    entrypoint:
      - /bin/sh
      - -c
      - until [ -s /key/key.pub ] && [ -s /key/token ]; do sleep 2; done; exec /agent
    deploy:
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      DISABLE_SSH: "true"
      HUB_URL: http://127.0.0.1:18190
      KEY_FILE: /key/key.pub
      TOKEN_FILE: /key/token
    # Listens on no host port: the host network privilege asks for a port declaration
    # or this mark.
    labels:
      - "vps.expose.none=true"
      - "vps.auto-update=patch"
    # The agent saves the fingerprint the hub knows its system by in /var/lib/beszel-agent, which
    # the image declares a volume: a named one keeps it across a new container.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - type: volume
        source: agent-key
        target: /key
        read_only: true
      - agent-data:/var/lib/beszel-agent
    # The host network is the swarm's external network named host:
    # network_mode is not read by a stack deploy.
    networks:
      - hostnet

  # Receives the hub's alert webhook and turns it into Healthchecks pings, so the
  # hub's alerts reach the same channels as Gatus's. It is also the service the
  # configure and verify hooks run in: the hub image holds only the binary. It
  # listens on the app's own network and pings Healthchecks over catena-healthchecks.
  relay:
    image: python:3.15.1-alpine@sha256:54448f67d7c31c39e5cdd3ea2d6382395ce142806c284425f8e897d78a0465b3
    deploy:
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.labels.catena.role==data
    command:
      - python3
      - -c
      - |
        import json
        import re
        import sys
        import urllib.request
        from http.server import BaseHTTPRequestHandler, HTTPServer

        # Beszel notifies through Shoutrrr with one static URL per channel and cannot
        # send a triggered alert and a resolved one to different endpoints. The
        # generic webhook is a JSON POST whose title carries what is needed:
        #   status alert : "Connection to <system> is up|down"
        #   metric alert : "<system> <metric> above|below threshold"
        # A stable slug per system and metric names one Healthchecks check; a
        # resolved alert is a success ping and a triggered one a /fail ping, and
        # ?create=1 makes the check on its first ping.
        NON_SLUG = re.compile(r"[^a-z0-9]+")
        STATUS = re.compile(r"^connection to (?P<system>.+) is (?P<state>up|down)\b")
        METRIC = re.compile(r"^(?P<body>.+) (?P<dir>above|below) threshold$$")
        SLUG_MAX = 60
        PING_TIMEOUT = 10
        # The Healthchecks ping address up to the check name, which the configure hook
        # writes (empty or absent while no Healthchecks provides one). The relay holds
        # no key in its environment.
        PING_FILE = "/state/ping-url"


        def slugify(text):
            return NON_SLUG.sub("-", text.lower()).strip("-")[:SLUG_MAX].strip("-")


        def parse_alert(payload):
            """(slug, resolved) of a webhook payload, or None for a title it does not know."""
            title = (payload.get("title") or payload.get("Title") or "").strip().lower()
            found = STATUS.match(title)
            if found:
                return "beszel-" + slugify(found.group("system") + "-status"), found.group("state") == "up"
            found = METRIC.match(title)
            if found:
                return "beszel-" + slugify(found.group("body")), found.group("dir") == "below"
            return None


        class Handler(BaseHTTPRequestHandler):
            def log_message(self, *args):
                pass

            def do_POST(self):
                length = int(self.headers.get("Content-Length") or 0)
                try:
                    payload = json.loads(self.rfile.read(length).decode() or "{}") if length else {}
                except ValueError:
                    payload = {}
                parsed = parse_alert(payload if isinstance(payload, dict) else {})
                try:
                    with open(PING_FILE, encoding="utf-8") as fh:
                        base = fh.read().strip()
                except OSError:
                    base = ""
                if parsed is None or not base:
                    self.send_response(204 if parsed is None else 503)
                    self.end_headers()
                    return
                slug, resolved = parsed
                url = base + "/" + slug + ("" if resolved else "/fail") + "?create=1"
                try:
                    urllib.request.urlopen(url, timeout=PING_TIMEOUT).read()
                    self.send_response(200)
                except Exception as exc:
                    sys.stderr.write("relay: ping failed for " + slug + ": " + str(exc) + "\n")
                    self.send_response(502)
                self.end_headers()


        HTTPServer(("0.0.0.0", 8099), Handler).serve_forever()
    # agent-key is the agent's key and token; relay-state is the relay's alone: the
    # hook's record of the admin email and the ping address.
    volumes:
      - agent-key:/key
      - relay-state:/state
    networks:
      default: {}
      catena-healthchecks: {}

volumes:
  beszel-hub-data:
  agent-key:
  agent-data:
  relay-state:

networks:
  catena-beszel:
    external: true
  catena-beszelgate:
    external: true
  catena-healthchecks:
    external: true
  hostnet:
    external: true
    name: host
