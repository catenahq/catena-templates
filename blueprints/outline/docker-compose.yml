x-catena:
  schema: 2
  env:
    DOMAIN_HOST:
      setting: {default: "wiki.{{ cloudflare_zone }}"}
    OUTLINE_HOSTNAME:
      setting: {default: "wiki.{{ cloudflare_zone }}"}
    OUTLINE_SECRET_KEY:
      generated: {length: 64, alphabet: hex}
    OUTLINE_UTILS_SECRET:
      generated: {length: 64, alphabet: hex}
    DB_PASSWORD:
      generated: {length: 32, alphabet: alnum}
  lifecycle:
    service: "outline"
    ready: ["node", "-e", "require('net').connect(3000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
    migrate:
      - ["node", "node_modules/.bin/sequelize", "db:migrate", "--env", "production-ssl-disabled"]
    timeout_seconds: 900
  images:
    db:
      rule: {kind: partial_line}
  # verify asks the running server for its sign-in configuration (a public call that reads the database).
  # X-Forwarded-Proto keeps FORCE_HTTPS from redirecting the loopback request.
  hooks:
    service: outline
    timeout_seconds: 60
    verify:
      - - node
        - -e
        - |
          const fail = (m) => {
            console.error(m);
            process.exit(1);
          };
          const req = require('http').request({
            host: '127.0.0.1', port: 3000, path: '/api/auth.config', method: 'POST', timeout: 15000,
            headers: { 'Content-Type': 'application/json', 'X-Forwarded-Proto': 'https' },
          }, (res) => {
            let body = '';
            res.on('data', (d) => { body += d; });
            res.on('end', () => {
              let reply = null;
              try { reply = JSON.parse(body); } catch (e) {}
              if (res.statusCode !== 200 || !reply || reply.ok !== true || typeof reply.data !== 'object') {
                fail('Outline /api/auth.config answered ' + res.statusCode + ' without its configuration');
              }
              console.log('Outline answers /api/auth.config');
            });
          });
          req.on('timeout', () => req.destroy(new Error('no answer in 15s')));
          req.on('error', (e) => fail('Outline does not answer on 3000: ' + e.message));
          req.end('{}');

services:
  outline:
    image: outlinewiki/outline:1.10.1
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    # The endpoints are set only once the settings sync has written the
    # issuer: Outline exits at start on an endpoint that fails its URL check,
    # as a bare path does, and its discovery alternative exits when the
    # issuer does not answer at boot.
    command:
      - sh
      - -c
      - |
        set -e
        if [ -n "$$OIDC_ISSUER_URL" ]; then
          export OIDC_AUTH_URI="$$OIDC_ISSUER_URL/protocol/openid-connect/auth"
          export OIDC_TOKEN_URI="$$OIDC_ISSUER_URL/protocol/openid-connect/token"
          export OIDC_USERINFO_URI="$$OIDC_ISSUER_URL/protocol/openid-connect/userinfo"
          export OIDC_LOGOUT_URI="$$OIDC_ISSUER_URL/protocol/openid-connect/logout"
        fi
        node_modules/.bin/sequelize db:migrate --env production-ssl-disabled
        exec node build/server/index.js
    environment:
      NODE_ENV: production
      SECRET_KEY: ${OUTLINE_SECRET_KEY}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET}
      DATABASE_URL: postgres://outline:${DB_PASSWORD}@db:5432/outline
      PGSSLMODE: disable
      REDIS_URL: redis://redis:6379
      URL: https://${OUTLINE_HOSTNAME}
      PORT: "3000"
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      FILE_STORAGE_UPLOAD_MAX_SIZE: "262144000"
      FORCE_HTTPS: "true"
      ENABLE_UPDATES: "false"

      # This app's own Keycloak sign-in entry, written by the settings sync
      # from the sign-in labels below. Empty until its first pass.
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_USERNAME_CLAIM: preferred_username
      OIDC_DISPLAY_NAME: Keycloak
      OIDC_SCOPES: openid profile email
    volumes:
      - outline-data:/var/lib/outline/data
    labels:
      - "vps.homepage.name=Outline"
      - "vps.homepage.description=A team wiki for notes and documents, organised in collections."
      - "vps.homepage.description-fr=Un wiki d'équipe pour les notes et les documents, organisés en collections."
      - "vps.route.host=${DOMAIN_HOST}"
      - "vps.route.port=3000"
      - "vps.auth.mode=public"
      - "vps.auth.oidc=true"
      - "vps.auth.groups=staff"
      - "vps.auth.oidc.redirect_uris=https://${OUTLINE_HOSTNAME}/auth/oidc.callback"
      - "vps.auto-update=patch"
    cap_drop:
      - NET_RAW
    networks:
      catena-network: {}
      default: {}

  db:
    image: postgres:18.6-alpine
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      POSTGRES_USER: outline
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: outline
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outline"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10m
    labels:
      - "vps.auto-update=minor"
    networks:
      - default

  redis:
    image: redis:8.10.2-alpine3.23
    deploy:
      restart_policy:
        condition: any
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

volumes:
  outline-data:
  db-data:

networks:
  catena-network:
    external: true
