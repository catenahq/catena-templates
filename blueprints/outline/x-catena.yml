schema: 2
requires_catena: 0.14.0
env:
  DOMAIN_HOST:
    setting: {default: "wiki.{{ cloudflare_zone }}"}
  OUTLINE_HOSTNAME:
    setting: {default: "wiki.{{ cloudflare_zone }}"}
  OUTLINE_SECRET_KEY:
    generated: {length: 64, alphabet: hex}
  OUTLINE_UTILS_SECRET:
    generated: {length: 64, alphabet: hex}
  DB_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  AUTH_MODE:
    setting: {default: "public", label: {en: "Access: public, private or admin-only", fr: "Accès : public, private ou admin-only"}}
  UPDATE_LEVEL:
    setting: {default: "major", label: {en: "Automatic updates: major, minor, patch or off", fr: "Mises à jour automatiques : major, minor, patch ou off"}}
lifecycle:
  service: "outline"
  ready: ["node", "-e", "require('net').connect(3000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
  migrate:
    - ["node", "node_modules/.bin/sequelize", "db:migrate", "--env", "production-ssl-disabled"]
  timeout_seconds: 900
# The uploads in outline-data are named by rows of the database, so the backup stops the app to copy
# both from one moment.
quiesce:
  stop: true
images:
  db:
    rule: {kind: partial_line}
# verify asks the running server for its sign-in configuration (a public call that reads the database).
# X-Forwarded-Proto keeps FORCE_HTTPS from redirecting the loopback request.
hooks:
  service: outline
  timeout_seconds: 60
  verify:
    - hooks/verify.js
# outline-data holds the uploaded files: watched by the backup, copied by no update.
unversioned_volumes: {outline-data: files}
