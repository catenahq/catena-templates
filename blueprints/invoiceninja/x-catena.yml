schema: 2
requires_catena: 0.11.12
version_from: app
env:
  DOMAIN_HOST:
    setting: {default: "invoice.{{ cloudflare_zone }}"}
  INVOICENINJA_HOSTNAME:
    setting: {default: "invoice.{{ cloudflare_zone }}"}
  INVOICENINJA_APP_KEY:
    setting: {default: ""}
  INVOICENINJA_ADMIN_EMAIL:
    setting: {default: "admin@{{ cloudflare_zone }}"}
  INVOICENINJA_ADMIN_PASSWORD:
    generated: {length: 24, alphabet: alnum}
  DB_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  DB_ROOT_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  INVOICENINJA_SMTP_HOST:
    setting: {default: ""}
  INVOICENINJA_SMTP_PORT:
    setting: {default: "587"}
  INVOICENINJA_SMTP_USERNAME:
    setting: {default: ""}
  INVOICENINJA_SMTP_PASSWORD:
    setting: {default: ""}
  INVOICENINJA_MAIL_FROM:
    setting: {default: "invoice@{{ cloudflare_zone }}"}
  INVOICENINJA_MAIL_FROM_NAME:
    setting: {default: "Invoicing"}
# verify asks nginx for /health, which nginx hands to the PHP application: nginx alone
# answers /nginx-health. 127.0.0.1: busybox wget tries ::1 first for localhost.
# The application behind nginx starts after nginx does, so verify asks again every 4 seconds while the
# port refuses or nginx answers 502/503 (wget names both in its error line), for up to 150 seconds,
# then judges the last answer.
hooks:
  service: nginx
  timeout_seconds: 180
  verify:
    - hooks/verify.sh
