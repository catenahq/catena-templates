x-catena:
  schema: 2
  version_from: app
  env:
    DOMAIN_HOST:
      setting: {default: "invoice.{{ cloudflare_zone }}"}
    INVOICENINJA_HOSTNAME:
      setting: {default: "invoice.{{ cloudflare_zone }}"}
    INVOICENINJA_APP_KEY:
      setting: {default: ""}
    INVOICENINJA_ADMIN_EMAIL:
      setting: {default: "admin@{{ cloudflare_zone }}"}
    INVOICENINJA_ADMIN_PASSWORD:
      generated: {length: 24, alphabet: alnum}
    DB_PASSWORD:
      generated: {length: 32, alphabet: alnum}
    DB_ROOT_PASSWORD:
      generated: {length: 32, alphabet: alnum}
    INVOICENINJA_SMTP_HOST:
      setting: {default: ""}
    INVOICENINJA_SMTP_PORT:
      setting: {default: "587"}
    INVOICENINJA_SMTP_USERNAME:
      setting: {default: ""}
    INVOICENINJA_SMTP_PASSWORD:
      setting: {default: ""}
    INVOICENINJA_MAIL_FROM:
      setting: {default: "invoice@{{ cloudflare_zone }}"}
    INVOICENINJA_MAIL_FROM_NAME:
      setting: {default: "Invoicing"}
  # verify asks nginx for /health, which nginx hands to the PHP application: nginx alone
  # answers /nginx-health. 127.0.0.1: busybox wget tries ::1 first for localhost.
  # The application behind nginx starts after nginx does, so verify asks again every 4 seconds while the
  # port refuses or nginx answers 502/503 (wget names both in its error line), for up to 150 seconds,
  # then judges the last answer.
  hooks:
    service: nginx
    timeout_seconds: 180
    verify:
      - - sh
        - -c
        - |
          end=$$(( $$(date +%s) + 150 ))
          while :; do
            body=$$(wget -q -T 10 -O - http://127.0.0.1/health 2>&1)
            rc=$$?
            [ "$$rc" != 0 ] || break
            case "$$body" in
              *"Connection refused"*|*"error: HTTP/1.1 502"*|*"error: HTTP/1.1 503"*)
                [ "$$(date +%s)" -lt "$$end" ] || break
                sleep 4
                ;;
              *) break ;;
            esac
          done
          if [ "$$rc" != 0 ]; then
            echo "Invoice Ninja does not answer /health through nginx: $$body" >&2
            exit 1
          fi
          case "$$body" in
            *"API is healthy"*) echo "Invoice Ninja answers /health through nginx" ;;
            *)
              echo "/health answers, but not with the Invoice Ninja health reply" >&2
              exit 1
              ;;
          esac

services:
  app:
    image: invoiceninja/invoiceninja-debian:5.13.52
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${INVOICENINJA_APP_KEY}
      APP_URL: https://${INVOICENINJA_HOSTNAME}
      REQUIRE_HTTPS: "true"
      TRUSTED_PROXIES: "*"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: invoiceninja
      DB_USERNAME: invoiceninja
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      # First-run bootstrap: init.sh's ninja:create-account step
      # consumes these to create the initial admin user. After first
      # boot the values are no-ops; the operator can rotate the admin
      # password from the in-app Settings -> Account Management page.
      IN_USER_EMAIL: ${INVOICENINJA_ADMIN_EMAIL}
      IN_PASSWORD: ${INVOICENINJA_ADMIN_PASSWORD}
      # SMTP. Operator pastes managed-relay creds here.
      MAIL_MAILER: smtp
      MAIL_HOST: ${INVOICENINJA_SMTP_HOST}
      MAIL_PORT: ${INVOICENINJA_SMTP_PORT}
      MAIL_USERNAME: ${INVOICENINJA_SMTP_USERNAME}
      MAIL_PASSWORD: ${INVOICENINJA_SMTP_PASSWORD}
      MAIL_ENCRYPTION: tls
      MAIL_FROM_ADDRESS: ${INVOICENINJA_MAIL_FROM}
      MAIL_FROM_NAME: ${INVOICENINJA_MAIL_FROM_NAME}
    volumes:
      - app_public:/var/www/html/public
      - app_storage:/var/www/html/storage
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

  nginx:
    image: nginx:1.31.8-alpine
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    volumes:
      - app_public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
    # The server block is written here rather than declared as a `configs:`
    # entry: a swarm stack file's `configs.file` reads a path beside the
    # compose, and neither deploy path has one -- the blueprint directory
    # carries only the compose, and a stack created from a posted string has
    # no directory at all.
    #
    # Verbatim merge of upstream's debian/nginx/laravel.conf +
    # debian/nginx/invoiceninja.conf
    # (github.com/invoiceninja/dockerfiles/tree/debian/debian/nginx).
    # `$$` is compose's escape for a literal `$`: nginx variables have to
    # reach nginx, not be interpolated at deploy time.
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'NGINX'
        # https://nginx.org/en/docs/http/ngx_http_core_module.html
        client_max_body_size 10M;
        client_body_buffer_size 10M;
        server_tokens off;

        # https://nginx.org/en/docs/http/ngx_http_fastcgi_module.html
        fastcgi_buffers 32 16K;

        # https://nginx.org/en/docs/http/ngx_http_gzip_module.html
        gzip on;
        gzip_comp_level 2;
        gzip_min_length 1M;
        gzip_proxied any;
        gzip_types *;

        # https://laravel.com/docs/master/deployment#nginx
        server {
            listen 80 default_server;
            server_name _;
            root /var/www/html/public;

            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-Content-Type-Options "nosniff";

            index index.php;

            charset utf-8;

            location / {
                try_files $$uri $$uri/ /index.php?$$query_string;
            }

            location = /favicon.ico { access_log off; log_not_found off; }
            location = /robots.txt  { access_log off; log_not_found off; }
            # The health check's: nginx answers it alone, while the app may still be migrating.
            location = /nginx-health { access_log off; return 204; }

            error_page 404 /index.php;

            location ~ \.php$$ {
                fastcgi_pass app:9000;
                fastcgi_param SCRIPT_FILENAME $$realpath_root$$fastcgi_script_name;
                include fastcgi_params;
            }

            location ~ /\.(?!well-known).* {
                deny all;
            }
        }
        NGINX
        exec nginx -g 'daemon off;'
    healthcheck:
      # 127.0.0.1: busybox wget tries localhost's ::1 first, which `listen 80` leaves unbound.
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "vps.homepage.name=Invoice Ninja"
      - "vps.homepage.description=Invoices, quotes and expenses, with online payment by customers."
      - "vps.homepage.description-fr=Factures, soumissions et dépenses, avec paiement en ligne par les clients."
      - "vps.route.host=${DOMAIN_HOST}"
      - "vps.route.port=80"
      - "vps.auth.mode=public"
      - "vps.auto-update=patch"
    cap_drop:
      - NET_RAW
    networks:
      catena-network: {}
      default: {}

  db:
    image: mariadb:13.0.2
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: invoiceninja
      MARIADB_USER: invoiceninja
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10m
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

  redis:
    image: redis:8.10.2-alpine
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

volumes:
  app_public:
  app_storage:
  db-data:
  redis-data:

networks:
  catena-network:
    external: true
