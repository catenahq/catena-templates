schema: 2
requires_catena: 0.12.2
env:
  DOMAIN_HOST:
    setting: {default: "photos.{{ cloudflare_zone }}"}
  IMMICH_HOSTNAME:
    setting: {default: "photos.{{ cloudflare_zone }}"}
  DB_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  UPLOAD_LOCATION:
    setting: {default: "immich-library"}
  IMMICH_ADMIN_EMAIL:
    setting: {default: "{{ admin_email }}"}
  IMMICH_ADMIN_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  UPDATE_LEVEL:
    setting: {default: "major", label: {en: "Automatic updates: major, minor, patch or off", fr: "Mises à jour automatiques : major, minor, patch ou off"}}
host_paths: [/mnt, /media]
images:
  db:
    rule: {kind: pattern, tag_pattern: '(\d+)-vectorchord(\d+)\.(\d+)\.(\d+)-pgvectors(\d+)\.(\d+)\.(\d+)', registry: ghcr.io, repo: immich-app/postgres, feed: compose, leader: ghcr.io/immich-app/immich-server, compose_url: 'https://raw.githubusercontent.com/immich-app/immich/{version}/docker/docker-compose.yml', compose_service: database}
# verify asks the running server for /api/server/ping and /api/server/version.
hooks:
  service: immich-server
  timeout_seconds: 60
  verify:
    - hooks/verify.js
