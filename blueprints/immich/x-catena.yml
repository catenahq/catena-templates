schema: 2
requires_catena: 0.14.0
env:
  DOMAIN_HOST:
    setting: {default: "photos.{{ cloudflare_zone }}"}
  IMMICH_HOSTNAME:
    setting: {default: "photos.{{ cloudflare_zone }}"}
  DB_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  UPLOAD_LOCATION:
    setting: {default: "immich-library", first_start_only: true, label: {en: "Where Immich keeps its library: immich-library, or a folder on a disk listed under Other folders to back up; choose it before the first deploy", fr: "Où Immich garde sa bibliothèque : immich-library, ou un dossier d'un disque inscrit sous Autres dossiers à sauvegarder ; à choisir avant le premier déploiement"}}
  IMMICH_ADMIN_EMAIL:
    setting: {default: "{{ admin_email }}"}
  IMMICH_ADMIN_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  AUTH_MODE:
    setting: {default: "public", label: {en: "Access: public, private or admin-only", fr: "Accès : public, private ou admin-only"}}
  UPDATE_LEVEL:
    setting: {default: "major", label: {en: "Automatic updates: major, minor, patch or off", fr: "Mises à jour automatiques : major, minor, patch ou off"}}
host_paths: [/mnt, /media]
quiesce: {stop: true}
images:
  db:
    rule: {kind: pattern, tag_pattern: '(\d+)-vectorchord(\d+)\.(\d+)\.(\d+)-pgvectors(\d+)\.(\d+)\.(\d+)', registry: ghcr.io, repo: immich-app/postgres, feed: compose, leader: ghcr.io/immich-app/immich-server, compose_url: 'https://raw.githubusercontent.com/immich-app/immich/{version}/docker/docker-compose.yml', compose_service: database}
# verify asks the running server for /api/server/ping and /api/server/version.
hooks:
  service: immich-server
  timeout_seconds: 60
  verify:
    - hooks/verify.js
# immich-library is the volume UPLOAD_LOCATION names by default: the photos and videos, which no new image rewrites.
# model-cache holds the machine-learning models the service downloads again when it is empty.
unversioned_volumes: {immich-library: files, model-cache: cache}
