x-catena:
  schema: 2
  env:
    DOMAIN_HOST:
      managed: {expr: "office.{{ cloudflare_zone }}"}
    OFFICE_EDITOR:
      managed: {expr: "collabora"}
    OFFICE_URL:
      managed: {expr: "https://office.{{ cloudflare_zone }}"}
  provides:
    office: {editor: OFFICE_EDITOR, url: OFFICE_URL}
  # The image has no shell and no HTTP client. verify runs coolwsd's own probe
  # (the image's health check), which reads the server's configuration for its
  # port and scheme and asks the running server for /livez over the loopback.
  hooks:
    service: collabora
    timeout_seconds: 60
    verify:
      - ["/usr/bin/coolwsd", "--probe", "--use-env-vars"]
  images:
    collabora:
      rule: {kind: pattern, tag_pattern: '(\d+)\.(\d+)\.(\d+)\.(\d+)\.(\d+)'}

services:
  collabora:
    image: collabora/code:26.04.5.1.1
    deploy:
      restart_policy:
        condition: any
    environment:
      # Regex of WOPI hosts allowed to use this CODE instance. The
      # `nextcloud\..*` pattern matches any `nextcloud.<zone>` FQDN;
      # one Nextcloud per VPS makes this precise enough.
      domain: 'nextcloud\..*'
      # Traefik (Cloudflare Tunnel upstream) terminates TLS; coolwsd
      # speaks plain HTTP on 9980 inside the catena-network. The
      # ssl.termination flag tells coolwsd to emit https:// URLs in
      # its discovery XML even though it itself is listening on http.
      extra_params: --o:ssl.enable=false --o:ssl.termination=true
    labels:
      - "vps.homepage.name=Collabora Online (CODE)"
      - "vps.homepage.description=Edit documents, spreadsheets and presentations online with other people, from inside Nextcloud."
      - "vps.homepage.description-fr=Édition de documents, de chiffriers et de présentations en ligne à plusieurs, dans Nextcloud."
      - "vps.route.host=${DOMAIN_HOST}"
      - "vps.route.port=9980"
      # The WOPI allow-list above is what authenticates a caller, so the
      # route carries no auth proxy: the editor loads in an iframe, and
      # an auth redirect inside that iframe lands on the Keycloak login
      # page instead of the document.
      - "vps.auth.mode=public"
      - "vps.auto-update=patch"
    cap_drop:
      - NET_RAW
    networks:
      catena-network: {}
      default: {}

networks:
  catena-network:
    external: true
