x-catena:
  schema: 2
  env:
    DOMAIN_HOST:
      setting: {default: "erp.{{ cloudflare_zone }}"}
    ERPNEXT_HOSTNAME:
      setting: {default: "erp.{{ cloudflare_zone }}"}
    ERPNEXT_ADMIN_PASSWORD:
      generated: {length: 24, alphabet: alnum}
    DB_ROOT_PASSWORD:
      generated: {length: 32, alphabet: alnum}
  lifecycle:
    service: "backend"
    ready: ["bash", "-c", ": > /dev/tcp/127.0.0.1/8000"]
    before_update:
      - ["bench", "set-maintenance-mode", "on"]
    migrate:
      - ["bench", "--site", "all", "migrate"]
    # Frappe's web workers read the site settings at most once a minute, so the
    # site answers 503 for up to a minute after maintenance mode goes off: the
    # second command waits for its ping, two minutes at most, before the
    # update's check runs.
    after_update:
      - ["bench", "set-maintenance-mode", "off"]
      - - node
        - -e
        - |
          const http = require("http");
          const site = process.env.SITE_NAME;
          const deadline = Date.now() + 120000;
          let last = "no answer";
          const ping = () => new Promise((resolve) => {
            const request = http.get({host: "127.0.0.1", port: 8000, path: "/api/method/ping",
                                      headers: {Host: site}, timeout: 10000}, (answer) => {
              let body = "";
              answer.on("data", (chunk) => { body += chunk; });
              answer.on("end", () => resolve([answer.statusCode, body]));
            });
            request.on("timeout", () => request.destroy(new Error("timed out")));
            request.on("error", (error) => resolve([0, String(error)]));
          });
          (async () => {
            while (Date.now() < deadline) {
              const [status, body] = await ping();
              if (status === 200 && body.includes("pong")) process.exit(0);
              last = status ? "HTTP " + status : body;
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }
            console.error("the site " + site + " does not answer its ping after 120 s: " + last);
            process.exit(1);
          })();
    timeout_seconds: 3600
  # The scheduler's process is the container's first process, so an exec into it
  # proves it runs. From there the check asks the app server for the site's ping
  # and the queue's Redis for the registered workers: one per queue service.
  hooks:
    service: scheduler
    timeout_seconds: 120
    verify:
      - - bash
        - -c
        - |
          set -eu
          case "$$(tr '\0' ' ' < /proc/1/cmdline)" in
            *schedule*) ;;
            *) echo "the scheduler is not the container's first process" >&2; exit 1 ;;
          esac
          exec /home/frappe/frappe-bench/env/bin/python - <<'PY'
          import os
          import sys
          import urllib.request

          from redis import Redis
          from rq import Worker

          site = os.environ["SITE_NAME"]
          request = urllib.request.Request("http://backend:8000/api/method/ping", headers={"Host": site})
          answer = urllib.request.urlopen(request, timeout=20).read().decode()
          if "pong" not in answer:
              sys.exit("the site " + site + " did not answer pong: " + answer[:200])
          workers = Worker.count(connection=Redis.from_url("redis://" + os.environ["REDIS_QUEUE"]))
          if workers < 3:
              sys.exit("only " + str(workers) + " of 3 queue workers are registered")
          print("site " + site + " answers, " + str(workers) + " queue workers registered")
          PY
  data:
    db: {volume: db-data, upgrade: dump_restore}

x-common: &frappe-env
  SITE_NAME: ${ERPNEXT_HOSTNAME}
  DB_HOST: db
  DB_PORT: "3306"
  REDIS_CACHE: redis-cache:6379
  REDIS_QUEUE: redis-queue:6379

services:
  # Sets the site up, then serves it. The image's entrypoint links its assets
  # into the sites volume and runs this script, which ends in the image's own
  # start.sh. Every start runs each step, and each is a no-op once done: the
  # bench config is written once, the site is created on the first start, and
  # install-app skips an app the site already has. A step that fails exits, and
  # swarm starts the task again. The two setup secrets leave the environment
  # before the app server starts.
  backend:
    image: frappe/erpnext:v16.52.1
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    command:
      - bash
      - -c
      - |
        set -e
        ls -1 apps > sites/apps.txt
        if [ -z "$$(jq -r '.db_host // empty' sites/common_site_config.json)" ]; then
          bench set-config -g db_host "$$DB_HOST"
          bench set-config -gp db_port "$$DB_PORT"
          bench set-config -g redis_cache "redis://$$REDIS_CACHE"
          bench set-config -g redis_queue "redis://$$REDIS_QUEUE"
          bench set-config -g redis_socketio "redis://$$REDIS_QUEUE"
          bench set-config -gp socketio_port 9000
        fi
        wait-for-it -t 120 "$$DB_HOST:$$DB_PORT"
        wait-for-it -t 120 "$$REDIS_CACHE"
        wait-for-it -t 120 "$$REDIS_QUEUE"
        if [ ! -d "sites/$$SITE_NAME" ]; then
          bench new-site --mariadb-user-host-login-scope='%' \
            --admin-password="$$ERPNEXT_ADMIN_PASSWORD" \
            --db-root-username=root --db-root-password="$$DB_ROOT_PASSWORD" \
            --set-default "$$SITE_NAME"
        fi
        bench --site "$$SITE_NAME" install-app erpnext
        unset ERPNEXT_ADMIN_PASSWORD DB_ROOT_PASSWORD
        exec start.sh
    environment:
      <<: *frappe-env
      ERPNEXT_ADMIN_PASSWORD: ${ERPNEXT_ADMIN_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    labels:
      - "vps.auto-update=minor"
    networks:
      - default

  frontend:
    image: frappe/erpnext:v16.52.1
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${ERPNEXT_HOSTNAME}
      UPSTREAM_REAL_IP_ADDRESS: 0.0.0.0/0
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "On"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    labels:
      - "vps.route.host=${DOMAIN_HOST}"
      - "vps.route.port=8080"
      - "vps.auth.mode=public"
      - "vps.health.path=/api/method/ping"
      - "vps.health.expect=pong"
      - "vps.auto-update=minor"
    cap_drop:
      - NET_RAW
    networks:
      catena-network: {}
      default: {}

  websocket:
    image: frappe/erpnext:v16.52.1
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment: *frappe-env
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    labels:
      - "vps.auto-update=minor"
    networks:
      - default

  queue-default:
    image: frappe/erpnext:v16.52.1
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    command: ["bench", "worker", "--queue", "default"]
    environment: *frappe-env
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    labels:
      - "vps.auto-update=minor"
    networks:
      - default

  queue-short:
    image: frappe/erpnext:v16.52.1
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    command: ["bench", "worker", "--queue", "short,default"]
    environment: *frappe-env
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    labels:
      - "vps.auto-update=minor"
    networks:
      - default

  queue-long:
    image: frappe/erpnext:v16.52.1
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    command: ["bench", "worker", "--queue", "long,default,short"]
    environment: *frappe-env
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    labels:
      - "vps.auto-update=minor"
    networks:
      - default

  scheduler:
    image: frappe/erpnext:v16.52.1
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    command: ["bench", "schedule"]
    environment: *frappe-env
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    labels:
      - "vps.auto-update=minor"
    networks:
      - default

  # The MariaDB line Frappe v16 is tested on; its patch label keeps it there.
  db:
    image: mariadb:11.8.9
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10m
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

  redis-cache:
    image: redis:8.6.7-alpine3.23
    deploy:
      restart_policy:
        condition: any
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

  redis-queue:
    image: redis:8.6.7-alpine3.23
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    volumes:
      - redis-queue-data:/data
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

volumes:
  sites:
  logs:
  db-data:
  redis-queue-data:

networks:
  catena-network:
    external: true
