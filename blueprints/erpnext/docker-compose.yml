x-catena:
  schema: 2
  env:
    DOMAIN_HOST:
      setting: {default: "erp.{{ cloudflare_zone }}"}
    ERPNEXT_HOSTNAME:
      setting: {default: "erp.{{ cloudflare_zone }}"}
    ERPNEXT_ADMIN_PASSWORD:
      generated: {length: 24, alphabet: alnum}
    DB_ROOT_PASSWORD:
      generated: {length: 32, alphabet: alnum}
  access:
    customer:
      label: {en: "Customer portal", fr: "Portail client"}
  lifecycle:
    service: "backend"
    ready: ["bash", "-c", ": > /dev/tcp/127.0.0.1/8000"]
    before_update:
      - ["bench", "set-maintenance-mode", "on"]
    migrate:
      - ["bench", "--site", "all", "migrate"]
    # Frappe's web workers read the site settings at most once a minute, so the
    # site answers 503 for up to a minute after maintenance mode goes off: the
    # second command waits for its ping, two minutes at most, before the
    # update's check runs.
    after_update:
      - ["bench", "set-maintenance-mode", "off"]
      - - node
        - -e
        - |
          const http = require("http");
          const site = process.env.SITE_NAME;
          const deadline = Date.now() + 120000;
          let last = "no answer";
          const ping = () => new Promise((resolve) => {
            const request = http.get({host: "127.0.0.1", port: 8000, path: "/api/method/ping",
                                      headers: {Host: site}, timeout: 10000}, (answer) => {
              let body = "";
              answer.on("data", (chunk) => { body += chunk; });
              answer.on("end", () => resolve([answer.statusCode, body]));
            });
            request.on("timeout", () => request.destroy(new Error("timed out")));
            request.on("error", (error) => resolve([0, String(error)]));
          });
          (async () => {
            while (Date.now() < deadline) {
              const [status, body] = await ping();
              if (status === 200 && body.includes("pong")) process.exit(0);
              last = status ? "HTTP " + status : body;
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }
            console.error("the site " + site + " does not answer its ping after 120 s: " + last);
            process.exit(1);
          })();
    timeout_seconds: 3600
  # Once its start has finished, the scheduler's process is the container's first
  # process, so an exec into it proves it runs; while the start waits for the
  # backend the first process is bash. From there the check asks the app server
  # for the site's ping and the queue's Redis for the registered workers: one per
  # queue service. The users hook gives the Customer role to the people invited
  # with customer access and removes it when they lose it; what it did is kept
  # in the site's global default catena_access_customer, as
  # {email: made | added | had | closed}: made is an account the hook created,
  # added a role it put on an existing account, had a role the account held
  # already, closed an account it disabled.
  hooks:
    service: scheduler
    timeout_seconds: 120
    users:
      - - bash
        - -c
        - |
          set -eu
          export CATENA_MEMBERS="$$(cat)"
          cd /home/frappe/frappe-bench/sites
          exec ../env/bin/python - <<'PY'
          import json
          import os
          import sys

          import frappe

          LEVEL = "customer"
          ROLE = "Customer"
          KEY = "catena_access_customer"

          wanted = {}
          for member in json.loads(os.environ.get("CATENA_MEMBERS") or "[]"):
              email = (member.get("email") or "").strip().lower()
              if email and member.get("enabled", True) and LEVEL in (member.get("access") or []):
                  wanted[email] = member

          try:
              frappe.init(os.environ["SITE_NAME"])
              frappe.connect()
          except Exception as error:
              sys.exit("catena access: the site does not answer: " + str(error))


          def roles_of(user):
              return {row.role for row in user.roles}


          def grant(email, member, state):
              if not frappe.db.exists("User", email):
                  user = frappe.new_doc("User")
                  user.update({"name": email, "email": email, "enabled": 1,
                               "first_name": member.get("first_name") or email.split("@")[0],
                               "last_name": member.get("last_name") or "",
                               "user_type": "Website User", "send_welcome_email": 0})
                  user.insert()
                  user.add_roles(ROLE)
                  return "made"
              user = frappe.get_doc("User", email)
              if ROLE in roles_of(user):
                  return state if state in ("made", "added") else "had"
              if state == "closed":
                  user.enabled = 1
              user.add_roles(ROLE)
              return "made" if state in ("made", "closed") else "added"


          def revoke(email, state):
              if state == "closed":
                  return state
              if state == "had" or not frappe.db.exists("User", email):
                  return None
              user = frappe.get_doc("User", email)
              user.remove_roles(ROLE)
              if state == "made" and not user.roles:
                  user.enabled = 0
                  user.save()
                  return "closed"
              return None


          try:
              stored = frappe.db.get_value("DefaultValue", {"parent": "__default", "defkey": KEY}, "defvalue")
              record = json.loads(stored) if stored else {}
              granted = removed = 0
              for email, member in sorted(wanted.items()):
                  state = grant(email, member, record.get(email))
                  granted += state != record.get(email) and state in ("made", "added")
                  record[email] = state
              for email in sorted(set(record) - set(wanted)):
                  removed += record[email] in ("made", "added")
                  state = revoke(email, record[email])
                  if state:
                      record[email] = state
                  else:
                      del record[email]
              frappe.defaults.set_global_default(KEY, json.dumps(record, sort_keys=True))
              frappe.db.commit()
              print("catena access: customer: " + str(granted) + " granted, " + str(removed) + " removed", flush=True)
          finally:
              frappe.destroy()
          PY
    verify:
      - - bash
        - -c
        - |
          set -eu
          case "$$(tr '\0' ' ' < /proc/1/cmdline)" in
            bash\ *) echo "the scheduler has not started: its start waits for the backend" >&2; exit 1 ;;
            *schedule*) ;;
            *) echo "the scheduler is not the container's first process" >&2; exit 1 ;;
          esac
          exec /home/frappe/frappe-bench/env/bin/python - <<'PY'
          import os
          import sys
          import urllib.request

          from redis import Redis
          from rq import Worker

          site = os.environ["SITE_NAME"]
          request = urllib.request.Request("http://backend:8000/api/method/ping", headers={"Host": site})
          answer = urllib.request.urlopen(request, timeout=20).read().decode()
          if "pong" not in answer:
              sys.exit("the site " + site + " did not answer pong: " + answer[:200])
          workers = Worker.count(connection=Redis.from_url("redis://" + os.environ["REDIS_QUEUE"]))
          if workers < 3:
              sys.exit("only " + str(workers) + " of 3 queue workers are registered")
          print("site " + site + " answers, " + str(workers) + " queue workers registered")
          PY
  data:
    db: {volume: db-data, upgrade: dump_restore}

x-common: &frappe-env
  SITE_NAME: ${ERPNEXT_HOSTNAME}
  DB_HOST: db
  DB_PORT: "3306"
  REDIS_CACHE: redis-cache:6379
  REDIS_QUEUE: redis-queue:6379

services:
  # Sets the site up, then serves it. The image's entrypoint links its assets
  # into the sites volume and runs this script, which ends in the image's own
  # start.sh. Every start runs each step, and each is a no-op once done: the
  # bench config is written once, the site is created on the first start, and
  # install-app skips an app the site already has. A step that fails exits, and
  # swarm starts the task again. The two setup secrets leave the environment
  # before the app server starts.
  backend:
    image: frappe/erpnext:v16.51.0
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    command:
      - bash
      - -c
      - |
        set -e
        ls -1 apps > sites/apps.txt
        if [ -z "$$(jq -r '.db_host // empty' sites/common_site_config.json)" ]; then
          bench set-config -g db_host "$$DB_HOST"
          bench set-config -gp db_port "$$DB_PORT"
          bench set-config -g redis_cache "redis://$$REDIS_CACHE"
          bench set-config -g redis_queue "redis://$$REDIS_QUEUE"
          bench set-config -g redis_socketio "redis://$$REDIS_QUEUE"
          bench set-config -gp socketio_port 9000
        fi
        wait-for-it -t 120 "$$DB_HOST:$$DB_PORT"
        wait-for-it -t 120 "$$REDIS_CACHE"
        wait-for-it -t 120 "$$REDIS_QUEUE"
        if [ ! -d "sites/$$SITE_NAME" ]; then
          bench new-site --mariadb-user-host-login-scope='%' \
            --admin-password="$$ERPNEXT_ADMIN_PASSWORD" \
            --db-root-username=root --db-root-password="$$DB_ROOT_PASSWORD" \
            --set-default "$$SITE_NAME"
        fi
        bench --site "$$SITE_NAME" install-app erpnext
        unset ERPNEXT_ADMIN_PASSWORD DB_ROOT_PASSWORD
        exec start.sh
    environment:
      <<: *frappe-env
      ERPNEXT_ADMIN_PASSWORD: ${ERPNEXT_ADMIN_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    labels:
      - "vps.auto-update=minor"
    networks:
      - default

  frontend:
    image: frappe/erpnext:v16.51.0
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${ERPNEXT_HOSTNAME}
      UPSTREAM_REAL_IP_ADDRESS: 0.0.0.0/0
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "On"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    labels:
      - "vps.homepage.name=ERPNext"
      - "vps.homepage.description=Business management with accounting, inventory, sales, purchasing, payroll and projects."
      - "vps.homepage.description-fr=Gestion d'entreprise avec comptabilité, inventaire, ventes, achats, paie et projets."
      - "vps.route.host=${DOMAIN_HOST}"
      - "vps.route.port=8080"
      - "vps.auth.mode=public"
      - "vps.health.path=/api/method/ping"
      - "vps.health.expect=pong"
      - "vps.auth.oidc=true"
      - "vps.auth.groups=staff"
      - "vps.auth.oidc.redirect_uris=https://${ERPNEXT_HOSTNAME}/api/method/frappe.integrations.oauth2_logins.custom/keycloak"
      - "vps.auto-update=minor"
    cap_drop:
      - NET_RAW
    networks:
      catena-network: {}
      default: {}

  websocket:
    image: frappe/erpnext:v16.51.0
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment: *frappe-env
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    labels:
      - "vps.auto-update=minor"
    networks:
      - default

  queue-default:
    image: frappe/erpnext:v16.51.0
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    command: ["bench", "worker", "--queue", "default"]
    environment: *frappe-env
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    labels:
      - "vps.auto-update=minor"
    networks:
      - default

  queue-short:
    image: frappe/erpnext:v16.51.0
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    command: ["bench", "worker", "--queue", "short,default"]
    environment: *frappe-env
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    labels:
      - "vps.auto-update=minor"
    networks:
      - default

  queue-long:
    image: frappe/erpnext:v16.51.0
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    command: ["bench", "worker", "--queue", "long,default,short"]
    environment: *frappe-env
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    labels:
      - "vps.auto-update=minor"
    networks:
      - default

  # Once the sign-in values are in the environment, the start waits until the
  # backend serves the site, then puts the Keycloak entry of Social Login Keys
  # in step with them (FRAPPE_SIGNIN_PY): it creates the entry when absent and
  # corrects the client, the secret and Keycloak's addresses when they differ.
  # The client secret leaves the environment before the scheduler runs.
  scheduler:
    image: frappe/erpnext:v16.51.0
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    command:
      - bash
      - -c
      - |
        set -e
        if [ -n "$${OIDC_CLIENT_ID:-}" ]; then
          echo "catena sign-in: waiting for the backend to serve the site"
          until (: > /dev/tcp/backend/8000) 2>/dev/null; do sleep 5; done
          (cd sites && ../env/bin/python -c "$$FRAPPE_SIGNIN_PY")
        fi
        unset OIDC_CLIENT_SECRET
        exec bench schedule
    environment:
      <<: *frappe-env
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      SIGNIN_SIGN_UPS: "Deny"
      FRAPPE_SIGNIN_PY: |
        import json
        import os

        import frappe

        client_id = os.environ.get("OIDC_CLIENT_ID", "")
        secret = os.environ.get("OIDC_CLIENT_SECRET", "")
        issuer = os.environ.get("OIDC_ISSUER_URL", "").rstrip("/")
        sign_ups = os.environ.get("SIGNIN_SIGN_UPS", "Deny")
        site = os.environ["SITE_NAME"]


        def say(message):
            print("catena sign-in: " + message, flush=True)


        if not (client_id and secret and issuer):
            say("no sign-in values yet; Keycloak sign-in stays off")
            raise SystemExit(0)
        endpoint = issuer + "/protocol/openid-connect/"
        owned = {
            "client_id": client_id, "base_url": issuer, "custom_base_url": 0,
            "authorize_url": endpoint + "auth", "access_token_url": endpoint + "token",
            "api_endpoint": endpoint + "userinfo",
            "redirect_url": "https://" + site + "/api/method/frappe.integrations.oauth2_logins.custom/keycloak",
        }
        frappe.init(site)
        frappe.connect()
        try:
            if frappe.db.exists("Social Login Key", "keycloak"):
                doc = frappe.get_doc("Social Login Key", "keycloak")
                changed = sorted(key for key, value in owned.items() if doc.get(key) != value)
                if doc.get_password("client_secret", raise_exception=False) != secret:
                    changed.append("client_secret")
                if changed:
                    doc.update(owned)
                    doc.client_secret = secret
                    doc.save()
                    say("Keycloak sign-in entry put back in step: " + ", ".join(changed))
            else:
                doc = frappe.new_doc("Social Login Key")
                doc.update({"provider_name": "Keycloak", "social_login_provider": "Custom",
                            "enable_social_login": 1, "sign_ups": sign_ups, "user_id_property": "sub",
                            "show_in_resource_metadata": 0,
                            "auth_url_data": json.dumps({"response_type": "code",
                                                         "scope": "openid email profile"}),
                            **owned})
                doc.client_secret = secret
                doc.insert()
                # Set with the entry only: the site is not the company website.
                frappe.db.set_single_value("Contact Us Settings", "is_disabled", 1)
                say("Keycloak sign-in on; the public contact form off")
            frappe.db.commit()
        finally:
            frappe.destroy()
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    labels:
      - "vps.auto-update=minor"
    networks:
      - default

  # The MariaDB line Frappe v16 is tested on; its patch label keeps it there.
  db:
    image: mariadb:11.8.9
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10m
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

  redis-cache:
    image: redis:8.6.7-alpine3.23
    deploy:
      restart_policy:
        condition: any
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

  redis-queue:
    image: redis:8.6.7-alpine3.23
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    volumes:
      - redis-queue-data:/data
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

volumes:
  sites:
  logs:
  db-data:
  redis-queue-data:

networks:
  catena-network:
    external: true
