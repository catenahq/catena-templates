schema: 2
requires_catena: 0.12.2
env:
  DOMAIN_HOST:
    setting: {default: "book.{{ cloudflare_zone }}"}
  EASYAPPOINTMENTS_HOSTNAME:
    setting: {default: "book.{{ cloudflare_zone }}"}
  DB_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  DB_ROOT_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  AUTH_MODE:
    setting: {default: "public", label: {en: "Access: public, private or admin-only", fr: "Accès : public, private ou admin-only"}}
  UPDATE_LEVEL:
    setting: {default: "major", label: {en: "Automatic updates: major, minor, patch or off", fr: "Mises à jour automatiques : major, minor, patch ou off"}}
# verify asks Apache for the root page. Before its installation wizard has run, the application answers
# with a redirect to /installation; after it, with the booking page, whose title names the product.
hooks:
  service: easyappointments
  timeout_seconds: 60
  verify:
    - hooks/verify.sh
