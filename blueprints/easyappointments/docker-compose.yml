services:
  easyappointments:
    image: alextselegidis/easyappointments:1.6.0
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      BASE_URL: https://${EASYAPPOINTMENTS_HOSTNAME}
      DB_HOST: db
      DB_NAME: easyappointments
      DB_USERNAME: easyappointments
      DB_PASSWORD: ${DB_PASSWORD}
      DEBUG_MODE: "FALSE"
    volumes:
      - server-data:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      - "vps.route.host=${DOMAIN_HOST}"
      - "vps.route.port=80"
      - "vps.route.service=easyappointments"
      - "vps.auth.mode=public"
      - "vps.auto-update=patch"
      - "vps.app=catena-easyappointments"
      - "vps.component=easyappointments"
    networks:
      catena-network:
        aliases:
          - catena-easyappointments
      default: {}

  db:
    image: mariadb:12.3.2
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: easyappointments
      MARIADB_USER: easyappointments
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - "vps.auto-update=patch"
      - "vps.app=catena-easyappointments"
      - "vps.component=db"
    networks:
      - default

volumes:
  server-data:
  db-data:

networks:
  catena-network:
    external: true
