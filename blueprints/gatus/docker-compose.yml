x-catena:
  schema: 2
  requires_catena: 0.14.0
  version_from: app
  env:
    DOMAIN_HOST:
      managed: {expr: "gatus.{{ cloudflare_zone }}"}
    AUTH_MODE:
      setting: {default: "admin-only", label: {en: "Access: public, private or admin-only", fr: "Accès : public, private ou admin-only"}}
    UI_TITLE:
      managed: {expr: "{{ cloudflare_zone | default('') }}"}
    UPDATE_LEVEL:
      setting: {default: "major", label: {en: "Automatic updates: major, minor, patch or off", fr: "Mises à jour automatiques : major, minor, patch ou off"}}
  # The Gatus image has no shell, wget or curl. verify runs in the busybox helper
  # that writes the base configuration, on the stack network, and asks Gatus's own
  # health endpoint.
  hooks:
    service: base
    timeout_seconds: 60
    verify:
      - - sh
        - -c
        - |
          body=$$(wget -q -T 20 -O - http://app:8080/health) || {
            echo "Gatus does not answer on port 8080" >&2
            exit 1
          }
          case "$$body" in
            *UP*) echo "Gatus answers its health endpoint" ;;
            *)
              echo "port 8080 answers, but not with Gatus's health status" >&2
              exit 1
              ;;
          esac
  data:
    app: {volume: gatus-data, upgrade: in_place, sqlite: [/data/gatus.db]}

services:
  app:
    image: twinproduction/gatus:v5.38.0
    deploy:
      restart_policy:
        condition: any
        delay: 5s
      # gatus-data holds the status history. An empty one on another node is a
      # status page that has forgotten every past result.
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      # Gatus reads every .yaml file of this folder, in name order. The image
      # holds a /config/config.yaml that probes outside sites, and Docker fills a
      # new volume with what the image holds at its mount path, so the volume is
      # mounted at a path the image does not hold.
      GATUS_CONFIG_PATH: /catena
      GATUS_WEB_PORT: "8080"
    labels:
      - "vps.route.host=${DOMAIN_HOST}"
      - "vps.route.port=8080"
      - "vps.auth.mode=${AUTH_MODE:-admin-only}"
      - "vps.auto-update=${UPDATE_LEVEL:-major}"
    volumes:
      - gatus-data:/data
      - config:/catena:ro
    cap_drop:
      - NET_RAW
    # The image has no wget or curl, so there is no Docker health check: the
    # self-check endpoint of 00-base.yaml is the signal.
    networks:
      default: {}
      catena-network: {}

  # Writes 00-base.yaml whole into the config volume: the storage, the title and the
  # self-check endpoint that Gatus needs to start. 99- files belong to the person
  # who adds them.
  base:
    image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    environment:
      UI_TITLE: ${UI_TITLE:-}
    command:
      - sh
      - -c
      - |
        set -eu
        dir=/catena
        tmp=$$dir/.00-base.tmp
        {
          printf 'storage:\n  type: sqlite\n  path: /data/gatus.db\n\nui:\n'
          if [ -n "$$UI_TITLE" ]; then
            printf '  title: "%s -- service status"\n  header: "%s"\n' "$$UI_TITLE" "$$UI_TITLE"
          else
            printf '  title: "Service status"\n'
          fi
          printf '  description: "Live status of the Catena server"\n  default-sort-by: group\n'
          printf '  dashboard-subheading: "Click on any service for more details."\n\n'
          printf 'endpoints:\n  - name: "Gatus self-check"\n    group: "Infrastructure"\n'
          printf '    url: "http://localhost:8080/health"\n    interval: 60s\n    conditions:\n      - "[STATUS] == 200"\n'
        } > "$$tmp"
        if cmp -s "$$tmp" "$$dir/00-base.yaml"; then
          rm -f "$$tmp"
        else
          mv "$$tmp" "$$dir/00-base.yaml"
        fi
        exec sleep 2147483647
    deploy:
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.labels.catena.role==data
      resources:
        limits:
          memory: 16M
        reservations:
          memory: 16M
    cap_drop:
      - ALL
    volumes:
      - config:/catena
    networks:
      - default

volumes:
  gatus-data:
  config:

networks:
  catena-network:
    external: true
