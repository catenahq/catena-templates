x-catena:
  schema: 2
  requires_catena: 0.12.2
  privileges: [docker_socket]
  env:
    DOMAIN_HOST:
      setting: {default: "arcane.{{ cloudflare_zone }}"}
    ENCRYPTION_KEY:
      generated: {length: 64, alphabet: hex}
    ADMIN_PASSWORD:
      generated: {length: 32, alphabet: alnum, first_start_only: true, note: "Password of the Arcane account arcane after Catena-1-, set at the first start; a later change here does nothing"}
    AUTH_MODE:
      setting: {default: "admin-only", label: {en: "Access: public, private or admin-only", fr: "Accès : public, private ou admin-only"}}
    UPDATE_LEVEL:
      setting: {default: "major", label: {en: "Automatic updates: major, minor, patch or off", fr: "Mises à jour automatiques : major, minor, patch ou off"}}
  # The image has no shell, curl or wget. verify runs Arcane's own health
  # command, which asks the running server for /api/health over the loopback.
  hooks:
    service: arcane
    timeout_seconds: 60
    verify:
      - ["/app/arcane", "health", "--timeout", "10s"]

services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:v3.1.1
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role==manager
          - node.labels.catena.role==data
    environment:
      ARCANE_APP_URL: https://${DOMAIN_HOST}
      ARCANE_ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Arcane 3 creates the administrator arcane with this password when it has no
      # users yet, and refuses one its policy rejects: 12 characters with an upper
      # case letter, a lower case letter, a number and a symbol. The fixed prefix
      # carries the symbol and the number a generated alnum value may lack.
      ARCANE_DEFAULT_ADMIN_PASSWORD: Catena-1-${ADMIN_PASSWORD}
      PUID: "1000"
      PGID: "1000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
    healthcheck:
      test: ["CMD", "./arcane", "health", "--timeout", "2s"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    labels:
      - "vps.route.host=${DOMAIN_HOST}"
      - "vps.route.port=3552"
      - "vps.auth.mode=${AUTH_MODE:-admin-only}"
      - "vps.auth.protected=true"
      - "vps.auto-update=${UPDATE_LEVEL:-major}"
    cap_drop:
      - NET_RAW
    networks:
      catena-network: {}
      default: {}

volumes:
  arcane-data:

networks:
  catena-network:
    external: true
