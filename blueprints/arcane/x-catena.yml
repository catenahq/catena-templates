schema: 2
requires_catena: 0.11.12
privileges: [docker_socket]
env:
  DOMAIN_HOST:
    setting: {default: "arcane.{{ cloudflare_zone }}"}
  ENCRYPTION_KEY:
    generated: {length: 64, alphabet: hex}
# The image has no shell, curl or wget. verify runs Arcane's own health
# command, which asks the running server for /api/health over the loopback.
hooks:
  service: arcane
  timeout_seconds: 60
  verify:
    - ["/app/arcane", "health", "--timeout", "10s"]
