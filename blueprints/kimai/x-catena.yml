schema: 2
requires_catena: 0.12.2
env:
  DOMAIN_HOST:
    setting: {default: "time.{{ cloudflare_zone }}"}
  KIMAI_HOSTNAME:
    setting: {default: "time.{{ cloudflare_zone }}"}
  KIMAI_ADMIN_EMAIL:
    setting: {default: "admin@{{ cloudflare_zone }}"}
  KIMAI_ADMIN_PASSWORD:
    generated: {length: 24, alphabet: alnum}
  KIMAI_APP_SECRET:
    generated: {length: 64, alphabet: alnum}
  DB_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  DB_ROOT_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  KIMAI_MAIL_FROM:
    setting: {default: "time@{{ cloudflare_zone }}"}
  KIMAI_MAIL_URL:
    setting: {default: "null://localhost"}
  AUTH_MODE:
    setting: {default: "public", label: {en: "Access: public, private or admin-only", fr: "Accès : public, private ou admin-only"}}
  UPDATE_LEVEL:
    setting: {default: "major", label: {en: "Automatic updates: major, minor, patch or off", fr: "Mises à jour automatiques : major, minor, patch ou off"}}
# verify asks Apache for the sign-in page, which is open to everyone, and looks for the product name.
hooks:
  service: kimai
  timeout_seconds: 60
  verify:
    - hooks/verify.sh
