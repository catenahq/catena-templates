x-catena:
  schema: 2
  env:
    DOMAIN_HOST:
      setting: {default: "time.{{ cloudflare_zone }}"}
    KIMAI_HOSTNAME:
      setting: {default: "time.{{ cloudflare_zone }}"}
    KIMAI_ADMIN_EMAIL:
      setting: {default: "admin@{{ cloudflare_zone }}"}
    KIMAI_ADMIN_PASSWORD:
      generated: {length: 24, alphabet: alnum}
    KIMAI_APP_SECRET:
      generated: {length: 64, alphabet: alnum}
    DB_PASSWORD:
      generated: {length: 32, alphabet: alnum}
    DB_ROOT_PASSWORD:
      generated: {length: 32, alphabet: alnum}
    KIMAI_MAIL_FROM:
      setting: {default: "time@{{ cloudflare_zone }}"}
    KIMAI_MAIL_URL:
      setting: {default: "null://localhost"}
  # verify asks Apache for the sign-in page, which is open to everyone, and looks for the product name.
  hooks:
    service: kimai
    timeout_seconds: 60
    verify:
      - - sh
        - -c
        - |
          body=$$(curl -fsSL --max-time 20 http://127.0.0.1:8001/login) || {
            echo "Kimai does not answer on port 8001" >&2
            exit 1
          }
          case "$$body" in
            *Kimai*) echo "Kimai answers on port 8001" ;;
            *)
              echo "port 8001 answers, but not with the Kimai sign-in page" >&2
              exit 1
              ;;
          esac

services:
  kimai:
    image: kimai/kimai2:2.67.0
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      DATABASE_URL: "mysql://kimai:${DB_PASSWORD}@db:3306/kimai?charset=utf8mb4&serverVersion=11.8.6-MariaDB"
      APP_SECRET: ${KIMAI_APP_SECRET}
      ADMINMAIL: ${KIMAI_ADMIN_EMAIL}
      ADMINPASS: ${KIMAI_ADMIN_PASSWORD}
      TRUSTED_PROXIES: "0.0.0.0/0"
      # Kimai splits this list on "|"; the image's own healthcheck asks 127.0.0.1.
      TRUSTED_HOSTS: "localhost|127.0.0.1|${KIMAI_HOSTNAME}"
      MAILER_FROM: ${KIMAI_MAIL_FROM}
      MAILER_URL: ${KIMAI_MAIL_URL}
      memory_limit: "512M"
    volumes:
      - kimai-data:/opt/kimai/var
    labels:
      - "vps.route.host=${DOMAIN_HOST}"
      - "vps.route.port=8001"
      - "vps.auth.mode=public"
      - "vps.auto-update=patch"
    cap_drop:
      - NET_RAW
    networks:
      catena-network: {}
      default: {}

  db:
    image: mariadb:12.3.3
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: kimai
      MARIADB_USER: kimai
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10m
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

volumes:
  kimai-data:
  db-data:

networks:
  catena-network:
    external: true
