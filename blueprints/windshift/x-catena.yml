schema: 2
requires_catena: 0.12.2
env:
  DOMAIN_HOST:
    managed: {expr: "work.{{ cloudflare_zone }}"}
  WINDSHIFT_HOSTNAME:
    managed: {expr: "work.{{ cloudflare_zone }}"}
  SSO_SECRET:
    generated: {length: 64, alphabet: alnum}
  DB_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  UPDATE_LEVEL:
    setting: {default: "major", label: {en: "Automatic updates: major, minor, patch or off", fr: "Mises à jour automatiques : major, minor, patch ou off"}}
images:
  windshift:
    rule: {kind: semver, registry: ghcr.io, repo: windshiftapp/windshift, stops: ['v0.8.5']}
  db:
    rule: {kind: partial_line}
# The image is built from scratch: no shell, curl or wget. verify runs
# Windshift's own health command, the one its healthcheck uses, which asks
# the running server over the loopback.
hooks:
  service: windshift
  timeout_seconds: 60
  verify:
    - ["/windshift", "healthcheck"]
