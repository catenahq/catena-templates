x-catena:
  schema: 2
  env:
    DOMAIN_HOST:
      setting: {default: "twenty.{{ cloudflare_zone }}"}
    TWENTY_HOSTNAME:
      setting: {default: "twenty.{{ cloudflare_zone }}"}
    TWENTY_APP_SECRET:
      generated: {length: 64, alphabet: alnum}
    DB_PASSWORD:
      generated: {length: 32, alphabet: alnum}
  images:
    db:
      rule: {kind: partial_line}
  # verify asks the running server for /healthz, the request the image's own healthcheck makes. The server
  # is slow to listen after a deploy, so verify asks again every 4 seconds while the port refuses or the
  # answer is 502/503, for up to 150 seconds, then judges the last answer.
  hooks:
    service: server
    timeout_seconds: 180
    verify:
      - - sh
        - -c
        - |
          end=$$(( $$(date +%s) + 150 ))
          while :; do
            out=$$(curl -s --max-time 10 -w '%{http_code}' http://127.0.0.1:3000/healthz)
            rc=$$?
            code=$${out#$${out%???}}
            body=$${out%???}
            case "$$rc:$$code" in
              7:*|*:502|*:503) [ "$$(date +%s)" -lt "$$end" ] || break; sleep 4 ;;
              *) break ;;
            esac
          done
          if [ "$$rc" != 0 ] || [ "$$code" != 200 ]; then
            echo "Twenty does not answer /healthz on port 3000 (curl $$rc, status $$code)" >&2
            exit 1
          fi
          case "$$body" in
            *'"status":"ok"'*) echo "Twenty answers /healthz" ;;
            *)
              echo "/healthz answers, but not ok: $$body" >&2
              exit 1
              ;;
          esac

services:
  server:
    image: twentycrm/twenty:v2.39.5
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      NODE_ENV: production
      PG_DATABASE_URL: postgres://postgres:${DB_PASSWORD}@db:5432/default
      REDIS_URL: redis://redis:6379
      SERVER_URL: https://${TWENTY_HOSTNAME}
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/.local-storage
      APP_SECRET: ${TWENTY_APP_SECRET}
    volumes:
      - server-data:/app/.local-storage
    labels:
      - "vps.homepage.name=Twenty"
      - "vps.homepage.description=Customer records, companies and sales pipelines in one CRM."
      - "vps.homepage.description-fr=Dossiers de clients, entreprises et suivi des ventes dans un seul CRM."
      - "vps.route.host=${DOMAIN_HOST}"
      - "vps.route.port=3000"
      - "vps.auth.mode=public"
      - "vps.auto-update=patch"
    cap_drop:
      - NET_RAW
    networks:
      catena-network: {}
      default: {}

  worker:
    image: twentycrm/twenty:v2.39.5
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    command: ["yarn", "worker:prod"]
    environment:
      NODE_ENV: production
      PG_DATABASE_URL: postgres://postgres:${DB_PASSWORD}@db:5432/default
      REDIS_URL: redis://redis:6379
      SERVER_URL: https://${TWENTY_HOSTNAME}
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/.local-storage
      APP_SECRET: ${TWENTY_APP_SECRET}
    volumes:
      - server-data:/app/.local-storage
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

  db:
    image: postgres:18.6-alpine
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: default
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10m
    labels:
      - "vps.auto-update=minor"
    networks:
      - default

  redis:
    image: redis:8.6.7-alpine3.23
    deploy:
      restart_policy:
        condition: any
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

volumes:
  server-data:
  db-data:

networks:
  catena-network:
    external: true
