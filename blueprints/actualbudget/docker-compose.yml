x-catena:
  schema: 2
  requires_catena: 0.14.0
  env:
    DOMAIN_HOST:
      managed: {expr: "budget.{{ cloudflare_zone }}"}
    AUTH_MODE:
      setting: {default: "public", label: {en: "Access: public, private or admin-only", fr: "Accès : public, private ou admin-only"}}
    UPDATE_LEVEL:
      setting: {default: "major", label: {en: "Automatic updates: major, minor, patch or off", fr: "Mises à jour automatiques : major, minor, patch ou off"}}
  lifecycle:
    service: "actual"
    ready: ["node", "-e", "require('net').connect(5006, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
    versioned_volumes: ["actual-data"]
    timeout_seconds: 300
  quiesce: {stop: true}
  # verify asks the running server for /info and reads the build name.
  hooks:
    service: actual
    timeout_seconds: 60
    verify:
      - - node
        - -e
        - |
          const fail = (m) => {
            console.error(m);
            process.exit(1);
          };
          require('http').get({ host: '127.0.0.1', port: 5006, path: '/info', timeout: 10000 }, (res) => {
            let body = '';
            res.on('data', (d) => { body += d; });
            res.on('end', () => {
              let build = null;
              try { build = JSON.parse(body).build; } catch (e) {}
              if (res.statusCode !== 200 || !build || build.name !== '@actual-app/sync-server') {
                fail('Actual Budget /info answered ' + res.statusCode + ' without its build name');
              }
              console.log('Actual Budget answers /info: sync-server ' + build.version);
            });
          }).on('timeout', function () {
            this.destroy(new Error('no answer in 10s'));
          }).on('error', (e) => fail('Actual Budget does not answer on 5006: ' + e.message));

services:
  actual:
    image: actualbudget/actual-server:26.11.0-alpine
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      ACTUAL_HTTPS: "false"               # TLS terminated by Traefik
      ACTUAL_TRUST_PROXY: "true"
      ACTUAL_PORT: "5006"
    volumes:
      - actual-data:/data
    labels:
      - "vps.route.host=${DOMAIN_HOST}"
      - "vps.route.port=5006"
      - "vps.auth.mode=${AUTH_MODE:-public}"
      - "vps.auto-update=${UPDATE_LEVEL:-major}"
    cap_drop:
      - NET_RAW
    networks:
      catena-network: {}
      default: {}

volumes:
  actual-data:

networks:
  catena-network:
    external: true
