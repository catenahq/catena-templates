x-catena:
  schema: 2
  env:
    DOMAIN_HOST:
      managed: {expr: "budget.{{ cloudflare_zone }}"}
  lifecycle:
    service: "actual"
    ready: ["node", "-e", "require('net').connect(5006, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
    versioned_volumes: ["actual-data"]
    timeout_seconds: 300
  quiesce:
    service: "actual"
    pre:
      - ["pkill", "-STOP", "-x", "node"]
    post:
      - ["pkill", "-CONT", "-x", "node"]
    timeout_seconds: 10

services:
  actual:
    image: actualbudget/actual-server:26.9.0-alpine
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      ACTUAL_HTTPS: "false"               # TLS terminated by Traefik
      ACTUAL_TRUST_PROXY: "true"
      ACTUAL_PORT: "5006"
    volumes:
      - actual-data:/data
    labels:
      - "vps.route.host=${DOMAIN_HOST}"
      - "vps.route.port=5006"
      - "vps.auth.mode=public"
      - "vps.auto-update=patch"
    cap_drop:
      - NET_RAW
    networks:
      catena-network: {}
      default: {}

volumes:
  actual-data:

networks:
  catena-network:
    external: true
