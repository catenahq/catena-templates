# Test for the actualbudget template: a budget file registered with the sync server's own
# routes survives a backup and a restore. Each step runs node in the server's container against
# 127.0.0.1:5006 and waits up to 300 s for /info.
#
# The setup does the server's first run as a person does it: only while GET
# /account/needs-bootstrap answers that the server is not bootstrapped, it sets the server
# password to the one the harness gives as CATENA_TEST_PASSWORD (POST /account/bootstrap), then
# signs in with it (POST /account/login). The data seed signs in, lists the user's files (GET
# /sync/list-user-files) and uploads the file catena-<run> (POST /sync/upload-user-file, the id
# derived from the run id, the bytes fixture-<run>) only when the id is not listed, so a second
# seed changes nothing. The assert signs in with the test password, lists the files: exactly one
# named catena-<run>, and downloads it (GET /sync/download-user-file) to compare its bytes. The
# password reaches no argument list and no output. A second assert step runs SQLite's integrity
# check on a copy (journals kept) of every .sqlite file under /data, a fresh install with no budget
# file included, and prints how many it opened, so a restored file that does not read fails there.
#
# The writer runs python3 in the step helper on catena-network, which outlives the server's
# containers while the backup stops them, and asks the server at http://{{ service_actual }}:5006.
# It uploads one file after another (catena-writer-<run>-<n>) and prints `ack <n>` for each upload
# the server answered ok; a refused connection or a 503 while the server is stopped is no ack and
# is tried again, and a refused token makes it sign in again. Its after step uploads the
# record {{ writer_id }} once the backup is over. The check runs in the helper after the restore
# and reads through the API alone: every file acknowledged before the backup is listed and
# downloads with the bytes sent, and the record is not listed.
#
# {{ run_id }} is supplied by the bench at execution time so the file is unique per run.
# Each {{ container_* }} is resolved from `docker ps` before invoking.

id: actualbudget
description: >-
  The sync server lists exactly one budget file named catena-<run>, downloads it with the
  bytes fixture-<run>, and signs in with the test password, before and after the backup, the
  restore and the updates. Files uploaded while the backup runs come back from the restore as
  sent, and every SQLite file under the server's data folder passes SQLite's integrity check.

setup:
  - name: server_password
    type: docker_exec
    container: "{{ container_actual }}"
    command:
      - sh
      - -c
      - |
        set -eu
        exec node - <<'JS'
        const BASE = 'http://127.0.0.1:5006';
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
        async function call(method, path, headers, body) {
          const r = await fetch(BASE + path, { method, headers, body });
          const text = await r.text();
          let json = null;
          try { json = JSON.parse(text); } catch (e) {}
          return { status: r.status, json };
        }
        async function up() {
          for (let i = 0; i < 60; i++) {
            try { if ((await fetch(BASE + '/info')).status === 200) return; } catch (e) {}
            await sleep(5000);
          }
          throw new Error('Actual Budget did not answer /info within 300 s');
        }
        (async () => {
          await up();
          const pw = process.env.CATENA_TEST_PASSWORD;
          const json = { 'content-type': 'application/json' };
          const n = await call('GET', '/account/needs-bootstrap', {});
          if (n.status !== 200 || !n.json || !n.json.data) throw new Error('GET /account/needs-bootstrap answered ' + n.status);
          if (!n.json.data.bootstrapped) {
            const b = await call('POST', '/account/bootstrap', json, JSON.stringify({ password: pw }));
            if (b.status !== 200 || !b.json || b.json.status !== 'ok') throw new Error('POST /account/bootstrap answered ' + b.status);
          }
          const a = await call('POST', '/account/login', json, JSON.stringify({ password: pw }));
          if (a.status !== 200 || !a.json || !a.json.data || !a.json.data.token) throw new Error('the server refused the test password: ' + a.status);
          console.log('actual budget server password set');
        })().catch((e) => { console.error(String(e.message || e)); process.exit(1); });
        JS
    expect_stdout_contains: "actual budget server password set"
    timeout_s: 360

seed:
  - name: register_the_budget_file
    type: docker_exec
    container: "{{ container_actual }}"
    command:
      - sh
      - -c
      - |
        set -eu
        exec node - <<'JS'
        const crypto = require('crypto');
        const BASE = 'http://127.0.0.1:5006';
        const RUN = '{{ run_id }}';
        async function call(method, path, headers, body) {
          const r = await fetch(BASE + path, { method, headers, body });
          const text = await r.text();
          let json = null;
          try { json = JSON.parse(text); } catch (e) {}
          return { status: r.status, json };
        }
        function fileId() {
          const h = crypto.createHash('sha1').update('catena-' + RUN).digest('hex');
          return h.slice(0, 8) + '-' + h.slice(8, 12) + '-4' + h.slice(13, 16) + '-8' + h.slice(17, 20) + '-' + h.slice(20, 32);
        }
        (async () => {
          const a = await call('POST', '/account/login', { 'content-type': 'application/json' },
            JSON.stringify({ password: process.env.CATENA_TEST_PASSWORD }));
          const token = a.status === 200 && a.json && a.json.data && a.json.data.token;
          if (!token) throw new Error('the server refused the test password: ' + a.status);
          const id = fileId();
          const l = await call('GET', '/sync/list-user-files', { 'x-actual-token': token });
          if (l.status !== 200 || !l.json || !Array.isArray(l.json.data)) throw new Error('GET /sync/list-user-files answered ' + l.status);
          if (!l.json.data.some((f) => f.fileId === id)) {
            const u = await call('POST', '/sync/upload-user-file', {
              'x-actual-token': token, 'x-actual-file-id': id, 'x-actual-name': 'catena-' + RUN,
              'content-type': 'application/encrypted-file' }, Buffer.from('fixture-' + RUN));
            if (u.status !== 200 || !u.json || u.json.status !== 'ok') throw new Error('POST /sync/upload-user-file answered ' + u.status);
          }
          console.log('seeded budget file catena-' + RUN);
        })().catch((e) => { console.error(String(e.message || e)); process.exit(1); });
        JS
    expect_stdout_contains: "seeded budget file catena-{{ run_id }}"
    timeout_s: 120

assert:
  - name: server_lists_exactly_one_budget_file_of_the_run
    type: docker_exec
    container: "{{ container_actual }}"
    command:
      - sh
      - -c
      - |
        set -eu
        exec node - <<'JS'
        const BASE = 'http://127.0.0.1:5006';
        const RUN = '{{ run_id }}';
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
        async function call(method, path, headers, body) {
          const r = await fetch(BASE + path, { method, headers, body });
          const buf = Buffer.from(await r.arrayBuffer());
          let json = null;
          try { json = JSON.parse(buf.toString('utf8')); } catch (e) {}
          return { status: r.status, json, text: buf.toString('utf8') };
        }
        async function up() {
          for (let i = 0; i < 60; i++) {
            try { if ((await fetch(BASE + '/info')).status === 200) return; } catch (e) {}
            await sleep(5000);
          }
          throw new Error('Actual Budget did not answer /info within 300 s');
        }
        (async () => {
          await up();
          const a = await call('POST', '/account/login', { 'content-type': 'application/json' },
            JSON.stringify({ password: process.env.CATENA_TEST_PASSWORD }));
          const token = a.status === 200 && a.json && a.json.data && a.json.data.token;
          if (!token) throw new Error('the server refused the test password: ' + a.status);
          const l = await call('GET', '/sync/list-user-files', { 'x-actual-token': token });
          if (l.status !== 200 || !l.json || !Array.isArray(l.json.data)) throw new Error('GET /sync/list-user-files answered ' + l.status);
          const mine = l.json.data.filter((f) => f.name === 'catena-' + RUN);
          if (mine.length !== 1) throw new Error('the server lists ' + mine.length + ' files named catena-' + RUN + ', expected 1');
          const d = await call('GET', '/sync/download-user-file', { 'x-actual-token': token, 'x-actual-file-id': mine[0].fileId });
          if (d.status !== 200 || d.text !== 'fixture-' + RUN) throw new Error('the file does not download as it was uploaded: ' + d.status);
          console.log('budget files named catena-' + RUN + ': 1, bytes fixture-' + RUN);
        })().catch((e) => { console.error(String(e.message || e)); process.exit(1); });
        JS
    expect_stdout_contains: "budget files named catena-{{ run_id }}: 1, bytes fixture-{{ run_id }}"
    timeout_s: 360

  - name: sqlite_files_of_the_data_folder_are_whole
    type: docker_exec
    container: "{{ container_actual }}"
    command:
      - sh
      - -c
      - |
        set -eu
        exec node - <<'JS'
        const fs = require('fs');
        const os = require('os');
        const path = require('path');
        const DATA = '/data';
        function sqliteFiles(dir) {
          const found = [];
          for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
            const p = path.join(dir, e.name);
            if (e.isDirectory()) found.push(...sqliteFiles(p));
            else if (e.name.endsWith('.sqlite')) found.push(p);
          }
          return found;
        }
        const Database = require(require.resolve('better-sqlite3', { paths: ['/app'] }));
        const tmp = fs.mkdtempSync(path.join(os.tmpdir(), 'appci-'));
        const bad = [];
        let count = 0;
        try {
          for (const src of sqliteFiles(DATA)) {
            const dst = path.join(tmp, count++ + '.sqlite');
            for (const tail of ['', '-journal', '-wal', '-shm']) {
              if (fs.existsSync(src + tail)) fs.copyFileSync(src + tail, dst + tail);
            }
            const db = new Database(dst);
            const answer = db.prepare('PRAGMA integrity_check').all().map((r) => Object.values(r)[0]).join(';');
            db.close();
            if (answer !== 'ok') bad.push(src + ': integrity_check says ' + answer);
          }
        } catch (e) {
          bad.push(String(e.message || e));
        } finally { fs.rmSync(tmp, { recursive: true, force: true }); }
        if (bad.length) { console.error(bad.join('; ')); process.exit(1); }
        console.log('sqlite files whole: ' + count);
        JS
    expect_stdout_contains: "sqlite files whole: "
    timeout_s: 120

writer:
  container: "{{ helper_actual }}"
  command:
    - python3
    - -c
    - |
      import hashlib, json, os, sys, time, urllib.error, urllib.request
      BASE = "http://{{ service_actual }}:5006"
      RUN = "{{ run_id }}"
      def file_id(key):
          h = hashlib.sha1(key.encode()).hexdigest()
          return h[:8] + "-" + h[8:12] + "-4" + h[13:16] + "-8" + h[17:20] + "-" + h[20:32]
      def call(method, path, headers, body=None):
          req = urllib.request.Request(BASE + path, data=body, headers=headers, method=method)
          try:
              r = urllib.request.urlopen(req, timeout=60)
          except urllib.error.HTTPError as e:
              r = e
          raw = r.read()
          try:
              return r.status, json.loads(raw)
          except ValueError:
              return r.status, None
      def login():
          for _ in range(60):
              try:
                  status, answer = call("POST", "/account/login", {"content-type": "application/json"},
                                        json.dumps({"password": os.environ["CATENA_TEST_PASSWORD"]}).encode())
                  token = ((answer or {}).get("data") or {}).get("token")
                  if status == 200 and token:
                      return token
              except OSError:
                  pass
              time.sleep(5)
          sys.stderr.write("the server gave no token\n")
          sys.exit(1)
      def put(token, n):
          body = ("budget-" + RUN + "-" + str(n) + "-").encode() * 20000
          headers = {"x-actual-token": token, "x-actual-file-id": file_id("writer-" + RUN + "-" + str(n)),
                     "x-actual-name": "catena-writer-" + RUN + "-" + str(n), "content-type": "application/encrypted-file"}
          try:
              status, answer = call("POST", "/sync/upload-user-file", headers, body)
          except OSError:
              return None, False
          return status, status == 200 and (answer or {}).get("status") == "ok"
      token = login()
      n = 0
      while True:
          status, ok = put(token, n)
          if ok:
              print("ack " + str(n), flush=True)
              n += 1
              continue
          if status in (401, 403):
              token = login()
          else:
              time.sleep(1)
  after:
    - name: record_after_the_backup
      type: docker_exec
      container: "{{ container_actual }}"
      command:
        - sh
        - -c
        - |
          set -eu
          exec node - <<'JS'
          const crypto = require('crypto');
          const BASE = 'http://127.0.0.1:5006';
          const ID = '{{ writer_id }}';
          async function call(method, path, headers, body) {
            const r = await fetch(BASE + path, { method, headers, body });
            const text = await r.text();
            let json = null;
            try { json = JSON.parse(text); } catch (e) {}
            return { status: r.status, json };
          }
          function fileId(key) {
            const h = crypto.createHash('sha1').update(key).digest('hex');
            return h.slice(0, 8) + '-' + h.slice(8, 12) + '-4' + h.slice(13, 16) + '-8' + h.slice(17, 20) + '-' + h.slice(20, 32);
          }
          (async () => {
            const a = await call('POST', '/account/login', { 'content-type': 'application/json' },
              JSON.stringify({ password: process.env.CATENA_TEST_PASSWORD }));
            const token = a.status === 200 && a.json && a.json.data && a.json.data.token;
            if (!token) throw new Error('the server refused the test password: ' + a.status);
            const u = await call('POST', '/sync/upload-user-file', {
              'x-actual-token': token, 'x-actual-file-id': fileId(ID), 'x-actual-name': 'catena-' + ID,
              'content-type': 'application/encrypted-file' }, Buffer.from('record-' + ID));
            if (u.status !== 200 || !u.json || u.json.status !== 'ok') throw new Error('POST /sync/upload-user-file answered ' + u.status);
            console.log('recorded ' + ID);
          })().catch((e) => { console.error(String(e.message || e)); process.exit(1); });
          JS
      expect_stdout_contains: "recorded {{ writer_id }}"
      timeout_s: 120
  check:
    - python3
    - -c
    - |
      import hashlib, json, os, sys, time, urllib.error, urllib.request
      BASE = "http://{{ service_actual }}:5006"
      RUN = "{{ run_id }}"
      def file_id(key):
          h = hashlib.sha1(key.encode()).hexdigest()
          return h[:8] + "-" + h[8:12] + "-4" + h[13:16] + "-8" + h[17:20] + "-" + h[20:32]
      def call(method, path, headers, body=None):
          req = urllib.request.Request(BASE + path, data=body, headers=headers, method=method)
          try:
              r = urllib.request.urlopen(req, timeout=60)
          except urllib.error.HTTPError as e:
              r = e
          raw = r.read()
          try:
              return r.status, raw, json.loads(raw)
          except ValueError:
              return r.status, raw, None
      def fail(message):
          sys.stderr.write(message + "\n")
          sys.exit(1)
      data = json.load(sys.stdin)
      before, after = data["before"], data["after"]
      deadline = time.time() + 300
      while True:
          try:
              if call("GET", "/info", {})[0] == 200:
                  break
          except OSError:
              pass
          if time.time() > deadline:
              fail("Actual Budget did not answer /info within 300 s")
          time.sleep(5)
      status, _, answer = call("POST", "/account/login", {"content-type": "application/json"},
                               json.dumps({"password": os.environ["CATENA_TEST_PASSWORD"]}).encode())
      token = ((answer or {}).get("data") or {}).get("token") if status == 200 else ""
      if not token:
          fail("the server refused the test password: %s" % status)
      status, _, answer = call("GET", "/sync/list-user-files", {"x-actual-token": token})
      if status != 200 or not isinstance(answer, dict) or not isinstance(answer.get("data"), list):
          fail("GET /sync/list-user-files answered %s" % status)
      listed = set(f.get("fileId") for f in answer["data"])
      problems = []
      for n in before:
          fid = file_id("writer-" + RUN + "-" + str(n))
          if fid not in listed:
              problems.append("file %s was acknowledged before the backup and is not listed" % n)
              continue
          status, raw, _ = call("GET", "/sync/download-user-file", {"x-actual-token": token, "x-actual-file-id": fid})
          if status != 200 or raw != ("budget-" + RUN + "-" + str(n) + "-").encode() * 20000:
              problems.append("file %s does not download as it was uploaded: %s" % (n, status))
      if file_id(after) in listed:
          problems.append("the record %s, written after the backup, is listed after the restore" % after)
      if problems:
          fail("; ".join(problems))
      print("writer check ok: %d files as sent, record absent" % len(before))
