schema: 2
requires_catena: 0.12.2
env:
  DOMAIN_HOST:
    managed: {expr: "budget.{{ cloudflare_zone }}"}
  UPDATE_LEVEL:
    setting: {default: "major", label: {en: "Automatic updates: major, minor, patch or off", fr: "Mises à jour automatiques : major, minor, patch ou off"}}
lifecycle:
  service: "actual"
  ready: ["node", "-e", "require('net').connect(5006, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
  versioned_volumes: ["actual-data"]
  timeout_seconds: 300
quiesce:
  service: "actual"
  pre:
    - ["pkill", "-STOP", "-x", "node"]
  post:
    - ["pkill", "-CONT", "-x", "node"]
  timeout_seconds: 10
# verify asks the running server for /info and reads the build name. A backup or an update
# that holds the server stopped (quiesce) answers ok.
hooks:
  service: actual
  timeout_seconds: 60
  verify:
    - hooks/verify.js
