env:
  DOMAIN_HOST:
    setting: {default: "projects.{{ cloudflare_zone }}"}
  PLANE_HOSTNAME:
    setting: {default: "projects.{{ cloudflare_zone }}"}
  PLANE_SECRET_KEY:
    generated: {length: 64, alphabet: alnum}
  PLANE_LIVE_SECRET_KEY:
    generated: {length: 64, alphabet: alnum}
  DB_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  PLANE_MQ_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  PLANE_MINIO_ACCESS_KEY:
    generated: {length: 20, alphabet: alnum}
  PLANE_MINIO_SECRET_KEY:
    generated: {length: 40, alphabet: alnum}
