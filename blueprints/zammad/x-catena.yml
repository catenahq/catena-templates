schema: 2
requires_catena: 0.12.2
env:
  DOMAIN_HOST:
    setting: {default: "help.{{ cloudflare_zone }}"}
  ZAMMAD_HOSTNAME:
    setting: {default: "help.{{ cloudflare_zone }}"}
  DB_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  AUTH_MODE:
    setting: {default: "public", label: {en: "Access: public, private or admin-only", fr: "Accès : public, private ou admin-only"}}
  UPDATE_LEVEL:
    setting: {default: "major", label: {en: "Automatic updates: major, minor, patch or off", fr: "Mises à jour automatiques : major, minor, patch ou off"}}
images:
  zammad-init:
    rule: {kind: build_suffix, tag_pattern: '\d+\.\d+\.\d+-\d+'}
  zammad-railsserver:
    rule: {kind: build_suffix, tag_pattern: '\d+\.\d+\.\d+-\d+'}
  zammad-websocket:
    rule: {kind: build_suffix, tag_pattern: '\d+\.\d+\.\d+-\d+'}
  zammad-scheduler:
    rule: {kind: build_suffix, tag_pattern: '\d+\.\d+\.\d+-\d+'}
  zammad-nginx:
    rule: {kind: build_suffix, tag_pattern: '\d+\.\d+\.\d+-\d+'}
  db:
    rule: {kind: partial_line}
  elasticsearch:
    rule: {kind: semver, registry: docker.io, repo: library/elasticsearch, tag_pattern: '\d+\.\d+\.\d+'}
# verify asks the nginx of the stack for the sign-in state, a public call that nginx hands to the Rails
# server and that reads the database.
hooks:
  service: zammad-nginx
  timeout_seconds: 60
  verify:
    - hooks/verify.sh
