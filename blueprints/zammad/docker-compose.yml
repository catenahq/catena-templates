x-catena:
  schema: 2
  env:
    DOMAIN_HOST:
      setting: {default: "help.{{ cloudflare_zone }}"}
    ZAMMAD_HOSTNAME:
      setting: {default: "help.{{ cloudflare_zone }}"}
    DB_PASSWORD:
      generated: {length: 32, alphabet: alnum}
  images:
    zammad-init:
      rule: {kind: build_suffix, tag_pattern: '\d+\.\d+\.\d+-\d+'}
    zammad-railsserver:
      rule: {kind: build_suffix, tag_pattern: '\d+\.\d+\.\d+-\d+'}
    zammad-websocket:
      rule: {kind: build_suffix, tag_pattern: '\d+\.\d+\.\d+-\d+'}
    zammad-scheduler:
      rule: {kind: build_suffix, tag_pattern: '\d+\.\d+\.\d+-\d+'}
    zammad-nginx:
      rule: {kind: build_suffix, tag_pattern: '\d+\.\d+\.\d+-\d+'}
    db:
      rule: {kind: partial_line}
    elasticsearch:
      rule: {kind: semver, registry: docker.io, repo: library/elasticsearch, tag_pattern: '\d+\.\d+\.\d+'}
  # verify asks the nginx of the stack for the sign-in state, a public call that nginx hands to the Rails
  # server and that reads the database.
  hooks:
    service: zammad-nginx
    timeout_seconds: 60
    verify:
      - - sh
        - -c
        - |
          body=$$(curl -fsS --max-time 20 http://127.0.0.1:8080/api/v1/signshow) || {
            echo "Zammad does not answer /api/v1/signshow on port 8080" >&2
            exit 1
          }
          case "$$body" in
            *'"config"'*) echo "Zammad answers /api/v1/signshow through nginx" ;;
            *)
              echo "port 8080 answers, but not with the Zammad sign-in state" >&2
              exit 1
              ;;
          esac

x-zammad-env: &zammad-env
  POSTGRESQL_HOST: db
  POSTGRESQL_PORT: "5432"
  POSTGRESQL_DB: zammad_production
  POSTGRESQL_USER: zammad
  POSTGRESQL_PASS: ${DB_PASSWORD}
  REDIS_URL: redis://redis:6379
  MEMCACHE_SERVERS: memcached:11211
  ELASTICSEARCH_SCHEMA: http
  ELASTICSEARCH_HOST: elasticsearch
  ELASTICSEARCH_PORT: "9200"
  ELASTICSEARCH_NAMESPACE: zammad

services:
  # Installs or updates the database through the image's zammad-init
  # (migrations, seeds, translations, the Elasticsearch settings and index),
  # applies Keycloak sign-in (ZAMMAD_SIGNIN_RB), then stays up so swarm keeps
  # it at its replica count. The other Zammad services wait in the image's
  # entrypoint until the migrations are done, and read the sign-in settings
  # on each request, so they need no restart for them. A step that fails
  # exits, and swarm starts the task again; TERM ends the wait at once.
  zammad-init:
    image: zammad/zammad:7.0.2-0000
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    command:
      - bash
      - -c
      - |
        set -e
        /opt/zammad/bin/docker-entrypoint zammad-init
        bundle exec rails r "$$ZAMMAD_SIGNIN_RB"
        trap 'exit 0' TERM
        sleep infinity &
        wait
    environment:
      <<: *zammad-env
      # This app's own Keycloak sign-in entry, a public client with no
      # secret, written by the settings sync from the sign-in labels on
      # zammad-nginx. Empty until its first pass.
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      # Setting.set refuses a setting name Zammad does not know, which fails
      # this step after an update that renamed one.
      ZAMMAD_SIGNIN_RB: |
        id = ENV["OIDC_CLIENT_ID"].to_s
        if id.empty?
          puts "catena sign-in: no sign-in values yet; Keycloak sign-in stays off"
        else
          Setting.set("auth_openid_connect_credentials", {
            "display_name" => "Keycloak", "identifier" => id,
            "issuer" => ENV["OIDC_ISSUER_URL"], "uid_field" => "sub",
            "scope" => "openid email profile", "pkce" => true,
          })
          Setting.set("auth_openid_connect", true)
          Setting.set("auth_third_party_auto_link_at_inital_login", true)
          puts "catena sign-in: Keycloak sign-in on"
        end
    volumes:
      - zammad-storage:/opt/zammad/storage
    networks:
      - default

  zammad-railsserver:
    image: zammad/zammad:7.0.2-0000
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    command: ["zammad-railsserver"]
    environment: *zammad-env
    volumes:
      - zammad-storage:/opt/zammad/storage
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

  zammad-websocket:
    image: zammad/zammad:7.0.2-0000
    deploy:
      restart_policy:
        condition: any
    command: ["zammad-websocket"]
    environment: *zammad-env
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

  zammad-scheduler:
    image: zammad/zammad:7.0.2-0000
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    command: ["zammad-scheduler"]
    environment: *zammad-env
    volumes:
      - zammad-storage:/opt/zammad/storage
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

  # Public-facing: fronts railsserver + websocket under a single vhost.
  zammad-nginx:
    image: zammad/zammad:7.0.2-0000
    deploy:
      restart_policy:
        condition: any
    command: ["zammad-nginx"]
    environment:
      <<: *zammad-env
      NGINX_SERVER_NAME: ${ZAMMAD_HOSTNAME}
      NGINX_CLIENT_MAX_BODY_SIZE: 50M
    labels:
      - "vps.homepage.name=Zammad"
      - "vps.homepage.description=A support desk that turns emails and chats into tickets."
      - "vps.homepage.description-fr=Un service d'assistance qui transforme les courriels et les clavardages en billets."
      - "vps.route.host=${DOMAIN_HOST}"
      - "vps.route.port=8080"
      - "vps.auth.mode=public"
      - "vps.auth.oidc=true"
      - "vps.auth.oidc.public=true"
      - "vps.auth.groups=staff"
      - "vps.auth.oidc.redirect_uris=https://${ZAMMAD_HOSTNAME}/auth/openid_connect/callback"
      - "vps.auto-update=patch"
    cap_drop:
      - NET_RAW
    networks:
      catena-network: {}
      default: {}

  db:
    image: postgres:18.6-alpine
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      POSTGRES_USER: zammad
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: zammad_production
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zammad"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10m
    labels:
      - "vps.auto-update=minor"
    networks:
      - default

  redis:
    image: redis:8.6.7-alpine3.23
    deploy:
      restart_policy:
        condition: any
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

  memcached:
    image: memcached:1.6.42-alpine3.23
    deploy:
      restart_policy:
        condition: any
    command: ["memcached", "-m", "256"]
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx1024m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

volumes:
  zammad-storage:
  db-data:
  es-data:

networks:
  catena-network:
    external: true
