# Test for the postiz template: an account and a signature of its organization, made
# through Postiz's API, survive a backup, a restore and the updates. The seed runs
# node inside the postiz container against the bundled nginx on 127.0.0.1:5000 (the
# route users reach, /api/ going to the backend): it waits until the backend answers
# its root, then signs in as the account catena-<run>@catena.test and registers it
# (registration is open: DISABLE_REGISTRATION is false) only when that sign-in is
# refused, then lists the organization's signatures and adds the signature
# fixture-<run> only when it is not listed, so a second seed changes nothing. The
# account's password is the first 32 characters of the SHA-256 of JWT_SECRET (from the
# container's environment) joined with the run id, so it rides no argument list and
# is printed nowhere. The account, its organization and the signature live in the
# database, so the asserts sign in again (the account must have survived), list the
# signatures and count exactly one holding fixture-<run>.
#
# {{ run_id }} is supplied by the bench at execution time and each
# {{ container_* }} is resolved from `docker ps` before invoking.

id: postiz
description: >-
  The account catena-<run>@catena.test signs in to Postiz and its organization lists
  exactly one signature fixture-<run>, before and after the backup, the restore and
  the updates.

seed:
  - name: account_with_a_signature
    type: docker_exec
    container: "{{ container_postiz }}"
    command:
      - sh
      - -c
      - |
        set -eu
        exec node - <<'JS'
        const crypto = require("crypto");
        const api = "http://127.0.0.1:5000/api";
        const RUN = "{{ run_id }}";
        const EMAIL = ("catena-" + RUN + "@catena.test").toLowerCase();
        const TEXT = "fixture-" + RUN;
        const PASSWORD = crypto.createHash("sha256").update(process.env.JWT_SECRET + ":" + RUN).digest("hex").slice(0, 32);
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

        async function call(method, path, token, body) {
          const headers = {};
          if (token) headers.auth = token;
          if (body) headers["content-type"] = "application/json";
          const res = await fetch(api + path, {
            method, headers, signal: AbortSignal.timeout(30000),
            body: body ? JSON.stringify(body) : undefined,
          });
          const text = await res.text();
          let json = null;
          try { json = JSON.parse(text); } catch {}
          const cookie = (res.headers.getSetCookie() || []).map((c) => /^auth=([^;]+)/.exec(c)).find(Boolean);
          return { status: res.status, text, json, token: res.headers.get("auth") || (cookie && cookie[1]) };
        }

        (async () => {
          for (let i = 0; ; i++) {
            try {
              const root = await call("GET", "/");
              if (root.status === 200 && root.text.includes("App is running")) break;
            } catch {}
            if (i === 60) throw new Error("the backend did not answer within 300 s");
            await sleep(5000);
          }
          const credentials = { provider: "LOCAL", email: EMAIL, password: PASSWORD };
          let session = await call("POST", "/auth/login", null, credentials);
          if (!session.token) {
            session = await call("POST", "/auth/register", null, { ...credentials, company: "catena-" + RUN });
            if (!session.token) throw new Error("registration answered HTTP " + session.status + ": " + session.text.slice(0, 200));
          }
          const listed = await call("GET", "/signatures", session.token);
          if (listed.status !== 200 || !Array.isArray(listed.json)) throw new Error("GET /signatures answered HTTP " + listed.status);
          if (!listed.json.some((s) => s.content === TEXT)) {
            const made = await call("POST", "/signatures", session.token, { content: TEXT, autoAdd: false });
            if (made.status >= 300 || !made.json || !made.json.id) throw new Error("POST /signatures answered HTTP " + made.status);
          }
          console.log("seeded account catena-" + RUN + "@catena.test with signature " + TEXT);
        })().catch((e) => {
          console.error(e.message);
          process.exit(1);
        });
        JS
    expect_stdout_contains: "seeded account catena-{{ run_id }}@catena.test"
    timeout_s: 420

assert:
  - name: account_and_signature_through_postiz
    type: docker_exec
    container: "{{ container_postiz }}"
    command:
      - sh
      - -c
      - |
        set -eu
        exec node - <<'JS'
        const crypto = require("crypto");
        const api = "http://127.0.0.1:5000/api";
        const RUN = "{{ run_id }}";
        const EMAIL = ("catena-" + RUN + "@catena.test").toLowerCase();
        const TEXT = "fixture-" + RUN;
        const PASSWORD = crypto.createHash("sha256").update(process.env.JWT_SECRET + ":" + RUN).digest("hex").slice(0, 32);
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

        async function call(method, path, token, body) {
          const headers = {};
          if (token) headers.auth = token;
          if (body) headers["content-type"] = "application/json";
          const res = await fetch(api + path, {
            method, headers, signal: AbortSignal.timeout(30000),
            body: body ? JSON.stringify(body) : undefined,
          });
          const text = await res.text();
          let json = null;
          try { json = JSON.parse(text); } catch {}
          const cookie = (res.headers.getSetCookie() || []).map((c) => /^auth=([^;]+)/.exec(c)).find(Boolean);
          return { status: res.status, text, json, token: res.headers.get("auth") || (cookie && cookie[1]) };
        }

        (async () => {
          for (let i = 0; ; i++) {
            try {
              const root = await call("GET", "/");
              if (root.status === 200 && root.text.includes("App is running")) break;
            } catch {}
            if (i === 60) throw new Error("the backend did not answer within 300 s");
            await sleep(5000);
          }
          const session = await call("POST", "/auth/login", null, { provider: "LOCAL", email: EMAIL, password: PASSWORD });
          if (!session.token) throw new Error("the account " + EMAIL + " cannot sign in: HTTP " + session.status + " " + session.text.slice(0, 100));
          const listed = await call("GET", "/signatures", session.token);
          if (listed.status !== 200 || !Array.isArray(listed.json)) throw new Error("GET /signatures answered HTTP " + listed.status);
          const found = listed.json.filter((s) => s.content === TEXT);
          if (found.length !== 1) throw new Error("the organization lists " + found.length + " signatures " + TEXT + ", expected one");
          console.log("account ok: catena-" + RUN + "@catena.test holds " + TEXT);
        })().catch((e) => {
          console.error(e.message);
          process.exit(1);
        });
        JS
    expect_stdout_contains: "account ok: catena-{{ run_id }}@catena.test holds fixture-{{ run_id }}"
    timeout_s: 420
