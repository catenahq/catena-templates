x-catena:
  schema: 2
  env:
    DOMAIN_HOST:
      setting: {default: "social.{{ cloudflare_zone }}"}
    POSTIZ_HOSTNAME:
      setting: {default: "social.{{ cloudflare_zone }}"}
    JWT_SECRET:
      generated: {length: 64, alphabet: alnum}
    DB_PASSWORD:
      generated: {length: 32, alphabet: alnum}
  images:
    db:
      rule: {kind: partial_line}
  # verify asks the backend for its root through the /api route of the bundled nginx, then the front end.
  # The processes behind nginx start after it does, so each ask is repeated every 4 seconds while the port
  # refuses or nginx answers 502/503, until 150 seconds after the hook started; the last answer is then judged.
  hooks:
    service: postiz
    timeout_seconds: 180
    verify:
      - - node
        - -e
        - |
          const end = Date.now() + 150000;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const once = (path) => new Promise((resolve, reject) => {
            require('http').get({ host: '127.0.0.1', port: 5000, path, timeout: 15000 }, (res) => {
              let body = '';
              res.on('data', (d) => { body += d; });
              res.on('end', () => resolve({ status: res.statusCode, body }));
            }).on('timeout', function () {
              this.destroy(new Error('no answer in 15s'));
            }).on('error', reject);
          });
          const get = async (path) => {
            for (;;) {
              let res;
              try {
                res = await once(path);
              } catch (e) {
                if (e.code !== 'ECONNREFUSED' || Date.now() >= end) throw e;
                await sleep(4000);
                continue;
              }
              if ((res.status === 502 || res.status === 503) && Date.now() < end) {
                await sleep(4000);
                continue;
              }
              return res;
            }
          };
          (async () => {
            const api = await get('/api/');
            if (api.status !== 200 || !api.body.includes('App is running')) {
              throw new Error('the backend answered ' + api.status + ' on /api/');
            }
            const front = await get('/');
            if (front.status >= 400) {
              throw new Error('the front end answered ' + front.status);
            }
            console.log('Postiz backend and front end answer on 5000');
          })().catch((e) => {
            console.error('Postiz does not answer on 5000: ' + e.message);
            process.exit(1);
          });

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:v2.24.0
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      NOT_SECURED: "false"
      IS_GENERAL: "true"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      MAIN_URL: https://${POSTIZ_HOSTNAME}
      FRONTEND_URL: https://${POSTIZ_HOSTNAME}
      NEXT_PUBLIC_BACKEND_URL: https://${POSTIZ_HOSTNAME}/api
      BACKEND_INTERNAL_URL: http://localhost:3000
      DATABASE_URL: postgres://postiz:${DB_PASSWORD}@db:5432/postiz
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      DISABLE_REGISTRATION: "false"
    volumes:
      - postiz-uploads:/uploads
      - postiz-config:/config
    labels:
      - "vps.route.host=${DOMAIN_HOST}"
      - "vps.route.port=5000"
      - "vps.auth.mode=public"
      - "vps.auto-update=patch"
    cap_drop:
      - NET_RAW
    networks:
      catena-network: {}
      default: {}

  db:
    image: postgres:18.6-alpine
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postiz
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10m
    labels:
      - "vps.auto-update=minor"
    networks:
      - default

  redis:
    image: redis:8.10.2-alpine3.23
    deploy:
      restart_policy:
        condition: any
    labels:
      - "vps.auto-update=patch"
    networks:
      - default

volumes:
  postiz-uploads:
  postiz-config:
  db-data:

networks:
  catena-network:
    external: true
