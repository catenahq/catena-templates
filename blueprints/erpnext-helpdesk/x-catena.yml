schema: 2
requires_catena: 0.12.2
env:
  DOMAIN_HOST:
    setting: {default: "desk.{{ cloudflare_zone }}"}
  ERPNEXT_HOSTNAME:
    setting: {default: "desk.{{ cloudflare_zone }}"}
  ERPNEXT_ADMIN_PASSWORD:
    generated: {length: 24, alphabet: alnum}
  DB_ROOT_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  FRAPPE_APPS:
    setting: {default: "erpnext,telephony,helpdesk"}
  ERPNEXT_WEB_FORMS:
    setting:
      default: "off"
      label: {en: "ERPNext issue and task forms", fr: "Formulaires d'incident et de tâche d'ERPNext"}
  UPDATE_LEVEL:
    setting: {default: "major", label: {en: "Automatic updates: major, minor, patch or off", fr: "Mises à jour automatiques : major, minor, patch ou off"}}
lifecycle:
  service: "backend"
  ready: ["bash", "-c", ": > /dev/tcp/127.0.0.1/8000"]
  before_update:
    - ["bench", "set-maintenance-mode", "on"]
  migrate:
    - ["bench", "--site", "all", "migrate"]
  # Frappe's web workers read the site settings at most once a minute, so the
  # site answers 503 for up to a minute after maintenance mode goes off: the
  # second command waits for its ping, two minutes at most, before the
  # update's check runs.
  after_update:
    - ["bench", "set-maintenance-mode", "off"]
    - snippets/frappe-wait-ping/1.js
  timeout_seconds: 3600
images:
  backend:
    rule: {kind: build_suffix, registry: ghcr.io, repo: catenahq/erpnext-helpdesk, tag_pattern: 'v16\.\d+\.\d+-\d+'}
  frontend:
    rule: {kind: build_suffix, registry: ghcr.io, repo: catenahq/erpnext-helpdesk, tag_pattern: 'v16\.\d+\.\d+-\d+'}
  websocket:
    rule: {kind: build_suffix, registry: ghcr.io, repo: catenahq/erpnext-helpdesk, tag_pattern: 'v16\.\d+\.\d+-\d+'}
  queue-default:
    rule: {kind: build_suffix, registry: ghcr.io, repo: catenahq/erpnext-helpdesk, tag_pattern: 'v16\.\d+\.\d+-\d+'}
  queue-short:
    rule: {kind: build_suffix, registry: ghcr.io, repo: catenahq/erpnext-helpdesk, tag_pattern: 'v16\.\d+\.\d+-\d+'}
  queue-long:
    rule: {kind: build_suffix, registry: ghcr.io, repo: catenahq/erpnext-helpdesk, tag_pattern: 'v16\.\d+\.\d+-\d+'}
  scheduler:
    rule: {kind: build_suffix, registry: ghcr.io, repo: catenahq/erpnext-helpdesk, tag_pattern: 'v16\.\d+\.\d+-\d+'}
# Once its start has finished, the scheduler's process is the container's first
# process, so an exec into it proves it runs; while the start waits for the
# backend the first process is bash. From there the check asks the app server
# for the site's ping and the queue's Redis for the registered workers: one per
# queue service.
hooks:
  service: scheduler
  timeout_seconds: 120
  verify:
    - snippets/frappe-verify/2.bash
data:
  db: {volume: db-data, upgrade: dump_restore}
