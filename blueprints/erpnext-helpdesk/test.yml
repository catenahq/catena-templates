# Test for the erpnext-helpdesk template: a note and its private file, made through
# Frappe, and a ticket raised through the helpdesk's own call survive a backup, a
# restore and the updates. The seed runs Frappe in the backend (the users hook's way
# of the erpnext template: frappe.init on SITE_NAME, then frappe.connect as
# Administrator) and makes the note catena-<run> holding fixture-<run>, then attaches
# the private file catena-<run>.txt with the same content, then raises the ticket
# catena-<run> with the description fixture-<run> through
# helpdesk.helpdesk.doctype.hd_ticket.api.new, which records the connected user,
# Administrator, as the one who raised it; each only when it is missing, so a second
# seed changes nothing. A seed that fails rolls its transaction back, and Frappe's
# rollback deletes the file the insert wrote, so the next seed writes it again under
# the same name. The note and the ticket live in the site's own database and
# the file in sites/<site>/private/files, so the asserts read the database and the
# files the restore brings back. Each assert signs in as Administrator at the
# backend's own listener with the Host header of the site, then lists the note, the
# files attached to it and the ticket through the REST API, counting exactly one of
# each, and downloads the file. The password comes from the container's environment,
# so it rides no argument list and is printed nowhere.
#
# {{ run_id }} is supplied by the bench at execution time and each
# {{ container_* }} is resolved from `docker ps` before invoking.

id: erpnext-helpdesk
description: >-
  The note catena-<run> holding fixture-<run> and its private file catena-<run>.txt,
  made through Frappe, and the ticket catena-<run> raised through the helpdesk are
  listed exactly once by the site's REST API and the file downloads with its content,
  before and after the backup, the restore and the updates.

seed:
  - name: site_documents
    type: docker_exec
    container: "{{ container_backend }}"
    command:
      - bash
      - -c
      - |
        set -eu
        cd /home/frappe/frappe-bench/sites
        exec ../env/bin/python - <<'PY'
        import os

        import frappe

        TITLE = "catena-{{ run_id }}"
        FILE = "catena-{{ run_id }}.txt"
        CONTENT = "fixture-{{ run_id }}"

        frappe.init(os.environ["SITE_NAME"])
        try:
            frappe.connect()
            try:
                note = frappe.db.get_value("Note", {"title": TITLE})
                if not note:
                    note = frappe.get_doc({"doctype": "Note", "title": TITLE, "content": CONTENT}).insert().name
                attached = {"attached_to_doctype": "Note", "attached_to_name": note, "file_name": FILE}
                if not frappe.db.exists("File", attached):
                    frappe.get_doc(dict(attached, doctype="File", content=CONTENT, is_private=1)).insert()
                frappe.db.commit()
            except BaseException:
                frappe.db.rollback()
                raise
            print("seeded note " + TITLE + " as " + note)
        finally:
            frappe.destroy()
        PY
    expect_stdout_contains: "seeded note catena-{{ run_id }}"
    timeout_s: 120

  - name: helpdesk_ticket
    type: docker_exec
    container: "{{ container_backend }}"
    command:
      - bash
      - -c
      - |
        set -eu
        cd /home/frappe/frappe-bench/sites
        exec ../env/bin/python - <<'PY'
        import os

        import frappe

        SUBJECT = "catena-{{ run_id }}"

        frappe.init(os.environ["SITE_NAME"])
        try:
            frappe.connect()
            from helpdesk.helpdesk.doctype.hd_ticket.api import new

            try:
                if not frappe.db.exists("HD Ticket", {"subject": SUBJECT}):
                    new({"subject": SUBJECT, "description": "fixture-{{ run_id }}"}, attachments=[])
                frappe.db.commit()
            except BaseException:
                frappe.db.rollback()
                raise
            print("seeded ticket " + SUBJECT)
        finally:
            frappe.destroy()
        PY
    expect_stdout_contains: "seeded ticket catena-{{ run_id }}"
    timeout_s: 120

assert:
  - name: site_documents_through_the_site
    type: docker_exec
    container: "{{ container_backend }}"
    command:
      - python3
      - -c
      - |
        import json, os, sys, urllib.error, urllib.parse, urllib.request

        TITLE = "catena-{{ run_id }}"
        CONTENT = "fixture-{{ run_id }}"
        FILE_URL = "/private/files/catena-{{ run_id }}.txt"
        headers = {"Host": os.environ["SITE_NAME"]}


        def call(path, data=None, **query):
            url = "http://127.0.0.1:8000" + urllib.parse.quote(path)
            if query:
                url += "?" + urllib.parse.urlencode({key: json.dumps(value) for key, value in query.items()})
            try:
                with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=headers), timeout=30) as answer:
                    return answer.headers.get_all("Set-Cookie") or [], answer.read().decode()
            except urllib.error.HTTPError as error:
                sys.exit(f"{path} answered HTTP {error.code}")


        login = urllib.parse.urlencode({"usr": "Administrator", "pwd": os.environ["ERPNEXT_ADMIN_PASSWORD"]})
        sid = [cookie.split(";", 1)[0] for cookie in call("/api/method/login", data=login.encode())[0]
               if cookie.startswith("sid=")]
        if not sid:
            sys.exit("the login set no session cookie")
        headers["Cookie"] = sid[0]
        notes = json.loads(call("/api/resource/Note", filters=[["title", "=", TITLE]],
                                fields=["name", "content"])[1])["data"]
        if len(notes) != 1 or CONTENT not in (notes[0].get("content") or ""):
            sys.exit(f"the site lists {notes} as the notes titled {TITLE}, expected one holding {CONTENT}")
        files = json.loads(call("/api/resource/File", filters=[["attached_to_doctype", "=", "Note"],
                                                                ["attached_to_name", "=", notes[0]["name"]]],
                                fields=["file_url"])[1])["data"]
        if [entry.get("file_url") for entry in files] != [FILE_URL]:
            sys.exit(f"the note {TITLE} has the files {files} attached, expected only {FILE_URL}")
        body = call(FILE_URL)[1]
        if body != CONTENT:
            sys.exit(f"{FILE_URL} holds {body[:200]!r}, expected {CONTENT}")
        print(f"site documents ok: note {TITLE} and its file {FILE_URL}")
    expect_stdout_contains: "site documents ok: note catena-{{ run_id }}"
    timeout_s: 120

  - name: ticket_through_the_site
    type: docker_exec
    container: "{{ container_backend }}"
    command:
      - python3
      - -c
      - |
        import json, os, sys, urllib.error, urllib.parse, urllib.request

        SUBJECT = "catena-{{ run_id }}"
        CONTENT = "fixture-{{ run_id }}"
        headers = {"Host": os.environ["SITE_NAME"]}


        def call(path, data=None, **query):
            url = "http://127.0.0.1:8000" + urllib.parse.quote(path)
            if query:
                url += "?" + urllib.parse.urlencode({key: json.dumps(value) for key, value in query.items()})
            try:
                with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=headers), timeout=30) as answer:
                    return answer.headers.get_all("Set-Cookie") or [], answer.read().decode()
            except urllib.error.HTTPError as error:
                sys.exit(f"{path} answered HTTP {error.code}")


        login = urllib.parse.urlencode({"usr": "Administrator", "pwd": os.environ["ERPNEXT_ADMIN_PASSWORD"]})
        sid = [cookie.split(";", 1)[0] for cookie in call("/api/method/login", data=login.encode())[0]
               if cookie.startswith("sid=")]
        if not sid:
            sys.exit("the login set no session cookie")
        headers["Cookie"] = sid[0]
        tickets = json.loads(call("/api/resource/HD Ticket", filters=[["subject", "=", SUBJECT]],
                                  fields=["name", "description"])[1])["data"]
        if len(tickets) != 1 or CONTENT not in (tickets[0].get("description") or ""):
            sys.exit(f"the site lists {tickets} as the tickets with the subject {SUBJECT}, expected one holding {CONTENT}")
        print(f"helpdesk ticket ok: {SUBJECT} is ticket {tickets[0]['name']}")
    expect_stdout_contains: "helpdesk ticket ok: catena-{{ run_id }}"
    timeout_s: 120
