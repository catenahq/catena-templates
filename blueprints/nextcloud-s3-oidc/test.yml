# Test for the nextcloud-s3-oidc template: a file written through Nextcloud and its
# public link share survive a backup and a restore, Talk keeps its conversation, the
# signaling server answers, the file-version and trash retention settings are applied
# (occ answers auto, 7 and 30, 30), and the sign-in provider is still wired. The seed uploads
# the file with WebDAV as the administrator, so it goes through the app into its data
# folder, then makes a public link
# share of it with the OCS Share API only when the file has none, and a Talk
# conversation through Talk's OCS API only when none of that name is listed, so a
# second seed changes nothing. The asserts read the file back the same way, list the
# shares of its path and the conversations, ask the signaling service its welcome at
# http://signaling:8081/api/v1/welcome (the alias of the talk-hpb service; a name that
# does not resolve fails the step), and, when
# auth.<the zone of the Nextcloud address> resolves from the app container, ask occ
# for user_oidc enabled at a release of major 8 from 8.11.0 (the configure hook's
# USER_OIDC_VERSION) and the provider keycloak; the step prints a skip line and passes
# when the name does not resolve. Every step waits until status.php reports Nextcloud
# installed and out of maintenance mode (occ status, the lifecycle ready question, also
# passes before the install), then runs curl inside the app container against its own
# Apache. The configure hook installs Talk and user_oidc from the app store and leaves
# an install that fails for the next deploy, so when either is missing the step prints
# what `occ app:install` answers. An update leg starts at a tag whose hook may have left
# Talk uninstalled: when Talk is still not on disk after 300 s, the seed prints the time
# of the app store's last failure and Nextcloud's log lines about the app store with the
# exception each names (a timeout, an HTTP answer or a refused connection), clears
# that time (Nextcloud skips the app store for 300 s after a failed fetch) and installs
# Talk once. When the provider keycloak is not listed, the step prints what occ answers,
# the providers listed and occ status. On a test VM the sign-in address auth.<zone> is a
# line of /etc/hosts pointing at the test edge's private address, and Nextcloud resolves
# the host of an address it calls through DNS alone and refuses a private one, then
# checks its certificate against a bundle of its own. When /etc/hosts names it, the first
# seed step sets allow_local_remote_servers and points default_certificates_bundle_path at
# the container's system bundle, which holds the edge's CA, so user_oidc reads the
# provider's discovery document. The administrator's login comes from the container's
# environment and reaches
# curl on stdin, so it is printed nowhere and rides no argument list. The OCS answers
# carry their own status in the body, which the steps read with php.
#
# {{ run_id }} is supplied by the bench at execution time so the file name, the file
# content and the conversation name are unique per run. Each {{ container_* }} is
# resolved from `docker ps` before invoking.

id: nextcloud-s3-oidc
description: >-
  The file catena-<run>.txt uploaded through Nextcloud's WebDAV is read back with its
  content, the file carries exactly one public link share and Talk lists exactly one
  conversation named catena-<run>, the signaling server answers its welcome, the version
  and trash retention settings read auto, 7 and 30, 30, and where
  the sign-in domain resolves the user_oidc app at major 8 holds the keycloak provider,
  before and after the backup, the restore and the updates.

seed:
  - name: reach_the_test_edge_sign_in_address
    type: docker_exec
    container: "{{ container_app }}"
    command:
      - sh
      - -c
      - |
        set -eu
        ready() { php -r '$s = json_decode(@file_get_contents("http://localhost/status.php")); exit($s && $s->installed === true && $s->maintenance === false ? 0 : 1);'; }
        occ() { if [ "$(id -u)" -eq 0 ]; then su -s /bin/sh www-data -c "php /var/www/html/occ $*"; else php /var/www/html/occ "$@"; fi; }
        auth="auth.${NEXTCLOUD_TRUSTED_DOMAINS#*.}"
        if ! grep -qw "$auth" /etc/hosts; then
          echo "test edge settings skipped: $auth is not in /etc/hosts"
          exit 0
        fi
        waited=0
        until ready; do
          [ "$waited" -lt 600 ] || { echo "Nextcloud was not installed and out of maintenance mode within 600 s" >&2; exit 1; }
          sleep 5
          waited=$((waited + 5))
        done
        occ config:system:set allow_local_remote_servers --value=true --type=boolean
        occ config:system:set default_certificates_bundle_path --value=/etc/ssl/certs/ca-certificates.crt
        echo "test edge settings set for $auth"
    expect_stdout_contains: "test edge settings "
    timeout_s: 660

  - name: upload_the_file_and_share_it_by_public_link
    type: docker_exec
    container: "{{ container_app }}"
    command:
      - sh
      - -c
      - |
        set -eu
        ready() { php -r '$s = json_decode(@file_get_contents("http://localhost/status.php")); exit($s && $s->installed === true && $s->maintenance === false ? 0 : 1);'; }
        nc() { printf 'user = "%s:%s"\n' "$NEXTCLOUD_ADMIN_USER" "$NEXTCLOUD_ADMIN_PASSWORD" \
          | curl -sS -K - --max-time 30 -H "Host: $NEXTCLOUD_TRUSTED_DOMAINS" -H "OCS-APIRequest: true" "$@"; }
        links() { php -r '$d = json_decode(stream_get_contents(STDIN), true); if (!$d || ($d["ocs"]["meta"]["statuscode"] ?? 0) !== 200) exit(2); $n = 0; foreach ($d["ocs"]["data"] as $s) { if (($s["share_type"] ?? -1) === 3) $n++; } echo $n;'; }
        waited=0
        until ready; do
          [ "$waited" -lt 600 ] || { echo "Nextcloud was not installed and out of maintenance mode within 600 s" >&2; exit 1; }
          sleep 5
          waited=$((waited + 5))
        done
        file="catena-{{ run_id }}.txt"
        api="http://127.0.0.1/ocs/v2.php/apps/files_sharing/api/v1/shares"
        code=$(nc -o /dev/null -w '%{http_code}' -X PUT --data-binary 'fixture-{{ run_id }}' \
          "http://127.0.0.1/remote.php/dav/files/$NEXTCLOUD_ADMIN_USER/$file")
        case "$code" in
          201|204) ;;
          *) echo "WebDAV PUT of the file answered $code" >&2; exit 1 ;;
        esac
        listed=$(nc --fail "$api?path=/$file&format=json") || { echo "listing the shares of the file failed" >&2; exit 1; }
        count=$(printf '%s' "$listed" | links) || { echo "the share list answer was not an OCS success" >&2; exit 1; }
        if [ "$count" -eq 0 ]; then
          created=$(nc --fail -X POST -d shareType=3 -d format=json --data-urlencode "path=/$file" "$api") \
            || { echo "creating the public link share failed" >&2; exit 1; }
          printf '%s' "$created" | links >/dev/null || { echo "the share creation answer was not an OCS success" >&2; exit 1; }
        fi
        echo "seeded $file"
    expect_stdout_contains: "seeded catena-{{ run_id }}.txt"
    timeout_s: 660

  - name: create_the_talk_conversation
    type: docker_exec
    container: "{{ container_app }}"
    command:
      - sh
      - -c
      - |
        set -eu
        ready() { php -r '$s = json_decode(@file_get_contents("http://localhost/status.php")); exit($s && $s->installed === true && $s->maintenance === false ? 0 : 1);'; }
        nc() { printf 'user = "%s:%s"\n' "$NEXTCLOUD_ADMIN_USER" "$NEXTCLOUD_ADMIN_PASSWORD" \
          | curl -sS -K - --max-time 30 -H "Host: $NEXTCLOUD_TRUSTED_DOMAINS" -H "OCS-APIRequest: true" "$@"; }
        rooms() { ROOM="catena-{{ run_id }}" php -r '$d = json_decode(stream_get_contents(STDIN), true); if (!$d || ($d["ocs"]["meta"]["statuscode"] ?? 0) !== 200) exit(2); $n = 0; foreach ($d["ocs"]["data"] as $r) { if (($r["name"] ?? "") === getenv("ROOM")) $n++; } echo $n;'; }
        created() { php -r '$d = json_decode(stream_get_contents(STDIN), true); exit(($d["ocs"]["meta"]["statuscode"] ?? 0) === 201 ? 0 : 2);'; }
        occ() { if [ "$(id -u)" -eq 0 ]; then su -s /bin/sh www-data -c "php /var/www/html/occ $*"; else php /var/www/html/occ "$@"; fi; }
        api="http://127.0.0.1/ocs/v2.php/apps/spreed/api/v4/room"
        waited=0
        until ready; do
          [ "$waited" -lt 600 ] || { echo "Nextcloud was not installed and out of maintenance mode within 600 s" >&2; exit 1; }
          sleep 5
          waited=$((waited + 5))
        done
        store_log() {
          log=$(occ config:system:get logfile 2>/dev/null || true)
          [ -n "$log" ] || log="$(occ config:system:get datadirectory 2>/dev/null || echo /var/www/html/data)/nextcloud.log"
          echo "the app store's last failure: $(occ config:app:get settings appstore-fetcher-lastFailure 2>/dev/null || echo none), now $(date +%s); its log lines:"
          grep -iE 'appstore|apps\.nextcloud\.com|Fetcher' "$log" 2>/dev/null | tail -n 3 \
            | php -r 'while (($l = fgets(STDIN)) !== false) { $d = json_decode($l, true); $e = is_array($d) && is_array($d["exception"] ?? null) ? $d["exception"] : []; echo substr(is_array($d) ? (($d["time"] ?? "") . " " . ($d["message"] ?? "") . ($e ? " [" . ($e["Exception"] ?? "") . ": " . ($e["Message"] ?? "") . "]" : "")) : $l, 0, 600), "\n"; }' || true
        }
        waited=0
        tried=0
        until listed=$(nc --fail "$api?format=json" 2>/dev/null); do
          if [ "$waited" -ge 300 ] && [ "$tried" -eq 0 ] && ! occ app:getpath spreed >/dev/null 2>&1; then
            store_log >&2
            occ config:app:delete settings appstore-fetcher-lastFailure >/dev/null 2>&1 || true
            echo "Talk is not installed; installing it answers: $(occ app:install spreed 2>&1 | tail -n 3)" >&2
            tried=1
            waited=180
          elif [ "$waited" -ge 300 ]; then
            echo "Talk did not list conversations within 300 s; what installing it answers:" >&2
            occ app:install spreed >&2 2>&1 || true
            store_log >&2
            exit 1
          fi
          sleep 5
          waited=$((waited + 5))
        done
        count=$(printf '%s' "$listed" | rooms) || { echo "the conversation list answer was not an OCS success" >&2; exit 1; }
        if [ "$count" -eq 0 ]; then
          made=$(nc --fail -X POST -d roomType=2 -d format=json --data-urlencode "roomName=catena-{{ run_id }}" "$api") \
            || { echo "creating the conversation failed" >&2; exit 1; }
          printf '%s' "$made" | created || { echo "the conversation creation answer was not 201" >&2; exit 1; }
        fi
        echo "seeded conversation catena-{{ run_id }}"
    expect_stdout_contains: "seeded conversation catena-{{ run_id }}"
    timeout_s: 960

assert:
  - name: file_present_with_expected_content
    type: docker_exec
    container: "{{ container_app }}"
    command:
      - sh
      - -c
      - |
        set -eu
        ready() { php -r '$s = json_decode(@file_get_contents("http://localhost/status.php")); exit($s && $s->installed === true && $s->maintenance === false ? 0 : 1);'; }
        waited=0
        until ready; do
          [ "$waited" -lt 600 ] || { echo "Nextcloud was not installed and out of maintenance mode within 600 s" >&2; exit 1; }
          sleep 5
          waited=$((waited + 5))
        done
        printf 'user = "%s:%s"\n' "$NEXTCLOUD_ADMIN_USER" "$NEXTCLOUD_ADMIN_PASSWORD" \
          | curl -sS -K - --fail --max-time 30 -H "Host: $NEXTCLOUD_TRUSTED_DOMAINS" \
              "http://127.0.0.1/remote.php/dav/files/$NEXTCLOUD_ADMIN_USER/catena-{{ run_id }}.txt"
    expect_stdout_contains: "fixture-{{ run_id }}"
    timeout_s: 660

  - name: file_has_exactly_one_public_link_share
    type: docker_exec
    container: "{{ container_app }}"
    command:
      - sh
      - -c
      - |
        set -eu
        ready() { php -r '$s = json_decode(@file_get_contents("http://localhost/status.php")); exit($s && $s->installed === true && $s->maintenance === false ? 0 : 1);'; }
        links() { php -r '$d = json_decode(stream_get_contents(STDIN), true); if (!$d || ($d["ocs"]["meta"]["statuscode"] ?? 0) !== 200) exit(2); $n = 0; foreach ($d["ocs"]["data"] as $s) { if (($s["share_type"] ?? -1) === 3) $n++; } echo $n;'; }
        waited=0
        until ready; do
          [ "$waited" -lt 600 ] || { echo "Nextcloud was not installed and out of maintenance mode within 600 s" >&2; exit 1; }
          sleep 5
          waited=$((waited + 5))
        done
        listed=$(printf 'user = "%s:%s"\n' "$NEXTCLOUD_ADMIN_USER" "$NEXTCLOUD_ADMIN_PASSWORD" \
          | curl -sS -K - --fail --max-time 30 -H "Host: $NEXTCLOUD_TRUSTED_DOMAINS" -H "OCS-APIRequest: true" \
              "http://127.0.0.1/ocs/v2.php/apps/files_sharing/api/v1/shares?path=/catena-{{ run_id }}.txt&format=json") \
          || { echo "listing the shares of the file failed" >&2; exit 1; }
        count=$(printf '%s' "$listed" | links) || { echo "the share list answer was not an OCS success" >&2; exit 1; }
        [ "$count" -eq 1 ] || { echo "the file has $count public link shares, expected 1" >&2; exit 1; }
        echo "public link shares of catena-{{ run_id }}.txt: 1"
    expect_stdout_contains: "public link shares of catena-{{ run_id }}.txt: 1"
    timeout_s: 660

  - name: talk_lists_exactly_one_conversation_of_the_run
    type: docker_exec
    container: "{{ container_app }}"
    command:
      - sh
      - -c
      - |
        set -eu
        ready() { php -r '$s = json_decode(@file_get_contents("http://localhost/status.php")); exit($s && $s->installed === true && $s->maintenance === false ? 0 : 1);'; }
        rooms() { ROOM="catena-{{ run_id }}" php -r '$d = json_decode(stream_get_contents(STDIN), true); if (!$d || ($d["ocs"]["meta"]["statuscode"] ?? 0) !== 200) exit(2); $n = 0; foreach ($d["ocs"]["data"] as $r) { if (($r["name"] ?? "") === getenv("ROOM")) $n++; } echo $n;'; }
        waited=0
        until ready; do
          [ "$waited" -lt 600 ] || { echo "Nextcloud was not installed and out of maintenance mode within 600 s" >&2; exit 1; }
          sleep 5
          waited=$((waited + 5))
        done
        listed=$(printf 'user = "%s:%s"\n' "$NEXTCLOUD_ADMIN_USER" "$NEXTCLOUD_ADMIN_PASSWORD" \
          | curl -sS -K - --fail --max-time 30 -H "Host: $NEXTCLOUD_TRUSTED_DOMAINS" -H "OCS-APIRequest: true" \
              "http://127.0.0.1/ocs/v2.php/apps/spreed/api/v4/room?format=json") \
          || { echo "listing the conversations failed" >&2; exit 1; }
        count=$(printf '%s' "$listed" | rooms) || { echo "the conversation list answer was not an OCS success" >&2; exit 1; }
        [ "$count" -eq 1 ] || { echo "Talk lists $count conversations named catena-{{ run_id }}, expected 1" >&2; exit 1; }
        echo "Talk conversations named catena-{{ run_id }}: 1"
    expect_stdout_contains: "Talk conversations named catena-{{ run_id }}: 1"
    timeout_s: 660

  - name: signaling_server_answers_its_welcome
    type: docker_exec
    container: "{{ container_app }}"
    command:
      - sh
      - -c
      - |
        set -eu
        getent hosts signaling >/dev/null || { echo "the name signaling does not resolve from the app container" >&2; exit 1; }
        body=$(curl -sS --fail --max-time 10 http://signaling:8081/api/v1/welcome) \
          || { echo "the signaling welcome did not answer" >&2; exit 1; }
        printf '%s' "$body" | php -r '$d = json_decode(stream_get_contents(STDIN), true); if (!$d || ($d["nextcloud-spreed-signaling"] ?? "") !== "Welcome" || empty($d["version"])) exit(2); echo "signaling welcome version " . $d["version"] . "\n";' \
          || { echo "the signaling welcome body held no Welcome and version" >&2; exit 1; }
    expect_stdout_contains: "signaling"
    timeout_s: 60

  - name: file_versions_and_trash_retention_are_applied
    type: docker_exec
    container: "{{ container_app }}"
    command:
      - sh
      - -c
      - |
        set -eu
        ready() { php -r '$s = json_decode(@file_get_contents("http://localhost/status.php")); exit($s && $s->installed === true && $s->maintenance === false ? 0 : 1);'; }
        occ() { if [ "$(id -u)" -eq 0 ]; then su -s /bin/sh www-data -c "php /var/www/html/occ $*"; else php /var/www/html/occ "$@"; fi; }
        waited=0
        until ready; do
          [ "$waited" -lt 600 ] || { echo "Nextcloud was not installed and out of maintenance mode within 600 s" >&2; exit 1; }
          sleep 5
          waited=$((waited + 5))
        done
        versions=$(occ config:system:get versions_retention_obligation 2>&1) || true
        [ "$versions" = "auto, 7" ] || { echo "versions_retention_obligation is '$versions', expected 'auto, 7'" >&2; exit 1; }
        trash=$(occ config:system:get trashbin_retention_obligation 2>&1) || true
        [ "$trash" = "30, 30" ] || { echo "trashbin_retention_obligation is '$trash', expected '30, 30'" >&2; exit 1; }
        echo "retention applied: versions $versions, trash $trash"
    expect_stdout_contains: "retention applied: versions auto, 7, trash 30, 30"
    timeout_s: 660

  - name: sign_in_provider_is_wired_where_the_edge_resolves
    type: docker_exec
    container: "{{ container_app }}"
    command:
      - sh
      - -c
      - |
        set -eu
        ready() { php -r '$s = json_decode(@file_get_contents("http://localhost/status.php")); exit($s && $s->installed === true && $s->maintenance === false ? 0 : 1);'; }
        occ() { if [ "$(id -u)" -eq 0 ]; then su -s /bin/sh www-data -c "php /var/www/html/occ $*"; else php /var/www/html/occ "$@"; fi; }
        auth="auth.${NEXTCLOUD_TRUSTED_DOMAINS#*.}"
        if ! getent hosts "$auth" >/dev/null; then
          echo "user_oidc check skipped: $auth does not resolve"
          exit 0
        fi
        waited=0
        until ready; do
          [ "$waited" -lt 600 ] || { echo "Nextcloud was not installed and out of maintenance mode within 600 s" >&2; exit 1; }
          sleep 5
          waited=$((waited + 5))
        done
        enabled=$(occ config:app:get user_oidc enabled 2>/dev/null || true)
        if [ "$enabled" != yes ]; then
          echo "user_oidc is not enabled; what installing it answers:" >&2
          occ app:install user_oidc >&2 2>&1 || true
          exit 1
        fi
        have=$(occ config:app:get user_oidc installed_version 2>/dev/null || true)
        if [ "${have%%.*}" != 8 ] || ! printf '8.11.0\n%s\n' "$have" | sort -V -C; then
          echo "user_oidc $have is installed; expected a release of major 8 from 8.11.0" >&2
          exit 1
        fi
        named() { php -r '$d = json_decode(stream_get_contents(STDIN), true); $all = isset($d["identifier"]) ? [$d] : (is_array($d) ? $d : []); $ids = []; foreach ($all as $p) { if (isset($p["identifier"])) $ids[] = $p["identifier"]; } echo implode(" ", $ids); exit(in_array("keycloak", $ids, true) ? 0 : 1);'; }
        shown=$(occ user_oidc:provider keycloak --output=json 2>&1) || true
        if ! printf '%s' "$shown" | named >/dev/null; then
          {
            echo "the provider keycloak is not listed; asking for it answers: $(printf '%s\n' "$shown" | tail -n 5)"
            list=$(occ user_oidc:provider --output=json 2>&1) || true
            if printf '%s' "$list" | php -r 'exit(json_decode(stream_get_contents(STDIN)) === null ? 0 : 1);'; then
              echo "listing the providers answers: $(printf '%s\n' "$list" | tail -n 3)"
            else
              echo "the providers listed: $(printf '%s' "$list" | named || true)"
            fi
            echo "occ status: $(occ status --output=json 2>&1 | tail -n 3)"
          } >&2
          exit 1
        fi
        echo "user_oidc check ok: version $have, provider keycloak listed"
    expect_stdout_contains: "user_oidc check "
    timeout_s: 660
