schema: 2
requires_catena: 0.11.12
env:
  DOMAIN_HOST:
    managed: {expr: "nextcloud.{{ cloudflare_zone }}"}
  NEXTCLOUD_HOSTNAME:
    managed: {expr: "nextcloud.{{ cloudflare_zone }}"}
  NEXTCLOUD_ADMIN_USER:
    setting: {default: "admin"}
  NEXTCLOUD_ADMIN_PASSWORD:
    generated: {length: 24, alphabet: alnum}
  DB_PASSWORD:
    generated: {length: 32, alphabet: alnum}
  NEXTCLOUD_LOGLEVEL:
    setting: {default: "3"}
  NEXTCLOUD_VERSIONS_RETENTION:
    setting: {default: "auto, 7"}
  NEXTCLOUD_TRASH_RETENTION:
    setting: {default: "30, 30"}
  NEXTCLOUD_MAX_CHUNK_SIZE:
    setting: {default: "83886080"}
  S3_BUCKET:
    setting: {default: "", first_start_only: true}
  S3_REGION:
    setting: {default: "bhs", first_start_only: true}
  S3_HOST:
    setting: {default: "s3.bhs.io.cloud.ovh.net", first_start_only: true}
  S3_PORT:
    setting: {default: "443", first_start_only: true}
  S3_SSL:
    setting: {default: "true", first_start_only: true}
  S3_ACCESS_KEY:
    setting: {default: ""}
  S3_SECRET_KEY:
    setting: {default: ""}
  SIGNALING_HOSTNAME:
    managed: {expr: "signaling.{{ cloudflare_zone }}"}
  SIGNALING_SECRET:
    generated: {length: 64, alphabet: alnum}
  TALK_INTERNAL_SECRET:
    generated: {length: 64, alphabet: alnum}
  TURN_HOSTNAME:
    managed: {expr: "{{ provided.turn.host }}"}
  TURN_PORT:
    managed: {expr: "{{ provided.turn.port }}"}
  TURN_TLS_PORT:
    managed: {expr: "{{ provided.turn.tls_port }}"}
  TURN_SECRET:
    managed: {expr: "{{ provided.turn.secret }}"}
  WEBMAIL_HOSTNAME:
    setting: {default: "webmail.{{ cloudflare_zone }}"}
  ANTIVIRUS_HOST:
    managed: {expr: "{{ provided.antivirus.host }}"}
  ANTIVIRUS_PORT:
    managed: {expr: "{{ provided.antivirus.port }}"}
  OFFICE_EDITOR:
    managed: {expr: "{{ provided.office.editor }}"}
  OFFICE_URL:
    managed: {expr: "{{ provided.office.url }}"}
  OFFICE_JWT_SECRET:
    managed: {expr: "{{ provided.office.jwt_secret }}"}
  SMTP_RELAY_HOST:
    managed: {expr: "{{ smtp_relay_host | default('') }}"}
  SMTP_RELAY_PORT:
    managed: {expr: "{{ smtp_relay_port | default('') }}"}
  SMTP_RELAY_USER:
    managed: {expr: "{{ smtp_relay_user | default('') }}"}
  SMTP_RELAY_PASSWORD:
    managed: {expr: "{{ smtp_password | default('') }}"}
  SMTP_RELAY_TLS:
    managed: {expr: "{{ smtp_relay_tls | default('') }}"}
  SMTP_RELAY_SENDER:
    managed: {expr: "{{ smtp_relay_sender | default('') }}"}
secrets: [smtp_password]
access:
  user:
    label: {en: "Nextcloud", fr: "Nextcloud"}
lifecycle:
  service: "app"
  user: "www-data"
  ready: ["php", "occ", "status", "--exit-code"]
  migrate:
    - ["php", "occ", "db:add-missing-indices"]
    - ["php", "occ", "maintenance:repair", "--include-expensive"]
  versioned_volumes: ["nc-html", "nc-config", "nc-apps"]
  timeout_seconds: 1800
quiesce:
  service: "app"
  user: "www-data"
  pre:
    - ["php", "occ", "maintenance:mode", "--on"]
  post:
    - ["php", "occ", "maintenance:mode", "--off"]
  timeout_seconds: 60
# The boot probe starts app alone and asks Apache for status.php: installed
# and out of maintenance mode (occ status exits 0 for an uninstalled instance).
probe:
  service: app
  memory: 768m
  timeout_seconds: 180
  check:
    - php
    - -r
    - "exit(json_decode(file_get_contents('http://localhost/status.php'))->installed === true && json_decode(file_get_contents('http://localhost/status.php'))->maintenance === false ? 0 : 1);"
object_store:
  env:
    bucket: "S3_BUCKET"
    host: "S3_HOST"
    port: "S3_PORT"
    ssl: "S3_SSL"
    region: "S3_REGION"
    access_key: "S3_ACCESS_KEY"
    secret_key: "S3_SECRET_KEY"
  switch:
    service: "app"
    user: "www-data"
    commands:
      - ["php", "occ", "status", "--exit-code"]
images:
  db:
    rule: {kind: partial_line}
  talk-hpb:
    rule: {kind: pattern, tag_pattern: '(\d{8})_(\d{6})', flat: true, registry: ghcr.io, repo: nextcloud-releases/aio-talk}
# configure runs after every deploy (add, settings, start, update, rollback,
# restore) and wires Nextcloud to the rest of the server: the object store
# file (put back only for an instance whose database holds the bucket's object
# store, removed from an installed instance that keeps its files on disk), Keycloak sign-in, Mail, the virus scanner and the office editor the
# applications on this server provide, Talk with its signaling server and the
# call relay application, Nextcloud's outgoing mail from the server's mail
# relay, and the Webmail link. Talk's relay and signaling entries are written
# only while the relay application runs, and taken away when it goes; the
# mail settings follow the mail relay the same way; the entries written are
# recorded in the app settings of "catena". It leaves with 0 whenever
# occ cannot be used (first install running, maintenance mode on, a restore
# whose database is not replayed yet) and with 1 only when occ answers and a
# wiring command fails. An app an administrator disabled stays disabled; the
# scanner settings are written once. verify runs hourly and before an update:
# it asks occ, then Apache for status.php, then the object store; it fails,
# naming the disk, for a bucket set on an instance that keeps its files there.
# reconcile runs after a restore, an app start and a bucket repair: it counts
# the files the database indexes that the object store lacks, and reports.
hooks:
  service: app
  user: www-data
  timeout_seconds: 1200
  configure:
    - hooks/configure.sh
  verify:
    - hooks/verify.sh
  reconcile:
    - hooks/reconcile.sh
# The app store's index and the GitHub release downloads it links to, from
# which the configure hook installs each app it enables (Talk among them).
egress: [apps.nextcloud.com, github.com, release-assets.githubusercontent.com]
