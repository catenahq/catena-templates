schema: 2
requires_catena: 0.11.12
env:
  DOMAIN_HOST:
    managed: {expr: "office.{{ cloudflare_zone }}"}
  JWT_SECRET:
    generated: {length: 48, alphabet: alnum}
  OFFICE_EDITOR:
    managed: {expr: "onlyoffice"}
  OFFICE_URL:
    managed: {expr: "https://office.{{ cloudflare_zone }}"}
provides:
  office: {editor: OFFICE_EDITOR, url: OFFICE_URL, jwt_secret: JWT_SECRET}
images:
  documentserver:
    rule: {kind: pattern, tag_pattern: '(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?'}
# verify asks the document server for /healthcheck, which answers true once its database, queue and
# cache answer.
hooks:
  service: documentserver
  timeout_seconds: 60
  verify:
    - hooks/verify.sh
