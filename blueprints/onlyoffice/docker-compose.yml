x-catena:
  schema: 2
  requires_catena: 0.14.0
  env:
    DOMAIN_HOST:
      managed: {expr: "office.{{ cloudflare_zone }}"}
    JWT_SECRET:
      generated: {length: 48, alphabet: alnum}
    OFFICE_EDITOR:
      managed: {expr: "onlyoffice"}
    OFFICE_URL:
      managed: {expr: "https://office.{{ cloudflare_zone }}"}
    UPDATE_LEVEL:
      setting: {default: "major", label: {en: "Automatic updates: major, minor, patch or off", fr: "Mises à jour automatiques : major, minor, patch ou off"}}
  provides:
    office: {editor: OFFICE_EDITOR, url: OFFICE_URL, jwt_secret: JWT_SECRET}
  images:
    documentserver:
      rule: {kind: pattern, tag_pattern: '(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?'}
  # verify asks the document server for /healthcheck, which answers true once its database, queue and
  # cache answer.
  hooks:
    service: documentserver
    timeout_seconds: 60
    verify:
      - - sh
        - -c
        - |
          body=$$(curl -fsS --max-time 20 http://127.0.0.1/healthcheck) || {
            echo "ONLYOFFICE does not answer /healthcheck on port 80" >&2
            exit 1
          }
          if [ "$$body" = true ]; then
            echo "ONLYOFFICE document server answers /healthcheck"
          else
            echo "ONLYOFFICE /healthcheck answers $$body, not true" >&2
            exit 1
          fi
  # ds-data holds the WOPI keys and the release-date record the entrypoint reads to detect an upgrade;
  # ds-fonts holds the fonts an administrator adds. Watched by the backup, copied by no update.
  unversioned_volumes: {ds-data: state, ds-fonts: state, ds-cache: cache, ds-log: cache}

services:
  documentserver:
    image: onlyoffice/documentserver:10.0.0.1
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.catena.role==data
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET}
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
      USE_UNAUTHORIZED_STORAGE: "false"
    volumes:
      - ds-data:/var/www/onlyoffice/Data
      - ds-log:/var/log/onlyoffice
      - ds-cache:/var/lib/onlyoffice
      # The image's VOLUME for fonts an administrator adds.
      - ds-fonts:/usr/share/fonts/truetype/custom
    labels:
      - "vps.route.host=${DOMAIN_HOST}"
      - "vps.route.port=80"
      # Nextcloud authenticates to the document server with a JWT, so
      # the route carries no auth proxy: the editor loads in an iframe,
      # and a sign-in gate in front of it sends that iframe to the
      # Keycloak login page instead of the document.
      - "vps.auth.mode=public"
      - "vps.auto-update=${UPDATE_LEVEL:-major}"
    cap_drop:
      - NET_RAW
    networks:
      catena-network: {}
      default: {}

volumes:
  ds-data:
  ds-log:
  ds-cache:
  ds-fonts:

networks:
  catena-network:
    external: true
