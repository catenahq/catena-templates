[project]
name = "catena-templates"
version = "0.0.0"
description = "The catalog's build tools, run in one locked environment"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "pillow>=13.0",
    "pyyaml>=6.0",
    "resvg-py>=0.5.0",
]

[dependency-groups]
dev = ["pytest>=8"]
