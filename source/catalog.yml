  - id: kimai
    app_name: kimai
    bench_pack: mariadb
    # KIMAI_HOSTNAME baked into Symfony's TRUSTED_HOSTS + persisted in
    # invoice templates + the SAML AssertionConsumerService URL; flipping
    # the FQDN breaks login + reissues invoices with stale URLs.
    hostname_baked: true
    upstream_url: https://www.kimai.org/
    sso_mode: post-deploy-ui
    domain_host: "time.{{ cloudflare_zone }}"
    domain_service: kimai
    domain_port: 8001
    compose_file: "compose/kimai.compose.yml"
    # Atomic per-cycle MariaDB logical dump. Sprint 2.1 introduces
    # this lane: mariadb-dump --single-transaction uses MVCC to
    # produce a consistent snapshot without blocking concurrent
    # writers. Writes to a `.new` sidecar then atomic-renames onto
    # `/var/lib/mysql/.catena-dump.sql`; the previous cycle's dump
    # lives in the prior restic snapshot.
    quiesce_pre: "docker exec \"$(docker ps -q -f label=com.docker.compose.service=db -f label=com.docker.compose.project~=kimai | head -1)\" sh -c 'mariadb-dump --single-transaction --quick --routines --triggers --add-drop-table -u root -p\"$MARIADB_ROOT_PASSWORD\" --all-databases > /var/lib/mysql/.catena-dump.sql.new && mv /var/lib/mysql/.catena-dump.sql.new /var/lib/mysql/.catena-dump.sql'"
    quiesce_post: "true"
    quiesce_timeout_seconds: 60
    env_defaults:
      - "DOMAIN_HOST=time.{{ cloudflare_zone }}"
      - "KIMAI_HOSTNAME=time.{{ cloudflare_zone }}"
      - "KIMAI_ADMIN_EMAIL=admin@{{ cloudflare_zone }}"
      - "KIMAI_ADMIN_PASSWORD={{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
      - "KIMAI_APP_SECRET={{ lookup('password', '/dev/null length=64 chars=ascii_letters,digits') }}"
      - "DB_PASSWORD={{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
      - "DB_ROOT_PASSWORD={{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
      # SMTP. Exposed for the operator's managed-relay creds; Kimai
      # consumes them via the Symfony Mailer URL format. Leave MAILER_URL
      # blank to fall back to no-op `null://` (no emails sent). Common
      # value once relay is set: smtp://USER:PASS@HOST:587?encryption=tls
      - "KIMAI_MAIL_FROM=time@{{ cloudflare_zone }}"
      - "KIMAI_MAIL_URL=null://localhost"
    en:
      display_name: Kimai
      what_it_is: Open-source time tracker. Customers, projects, activities, timesheets, multi-user teams, invoice generation from tracked time. SAML federates with Keycloak via the post-deploy admin UI.
      replaces: ["Toggl", "Clockify", "Harvest", "TimeCamp"]
      compose_description: |
        Open-source time tracker. Customers, projects, timesheets, invoices. Replaces Toggl / Clockify / Harvest.

        https://docs.catena.run/apps/kimai/
      setup_steps: |
        1. Click **Deploy**. Wait ~1 min for the first boot (database migrations run on first start).
        2. Visit your Kimai domain. Sign in as `KIMAI_ADMIN_EMAIL` / `KIMAI_ADMIN_PASSWORD` from the Environment tab.
        3. *(Optional)* Enable Keycloak SAML SSO: **System** -> **Settings** -> **SAML** -> enable + paste:
           - **Identity Provider Entity ID:** `<OIDC_ISSUER_URL>/protocol/saml/descriptor` (your operator can mint a SAML client in Keycloak)
           - **Single Sign-On URL:** `<OIDC_ISSUER_URL>/protocol/saml`
           - **X.509 Certificate:** from the Keycloak realm metadata
           - **Username Attribute:** `username` (or `email`)
           - Save. Local admin login keeps working as break-glass.
        4. Configure your default invoice template under **Invoices** -> **Templates** -> pick one (DOCX / HTML / PDF). Set your company logo, address, and tax rates under **System** -> **Configuration**.
      extra_notes: |
        ### Time tracking in the Catena suite

        Kimai is the time-tracking master in the Catena suite. Hours tracked here flow downstream to your invoicing app (Invoice Ninja) via the operator's monthly sync (see your operator if you want this automated). Customer records in Kimai carry an `espo_account_id` custom field so each timesheet ties back to the EspoCRM Account.

        ### Invoicing built in

        Kimai can generate PDF invoices directly from tracked time. Use this if your billing flow is "email a PDF; client pays via e-transfer or wire." If you need Stripe-driven online payment, a client portal, or recurring billing, ask your operator to deploy Invoice Ninja and the suite will route invoices through that instead.

        ### Authentication

        Until SAML is wired (step 3 above), Kimai uses local username/password. Even after SAML is wired, local admin login keeps working as a break-glass path. The Keycloak `staff` group gates access at the Traefik edge via oauth2-proxy before traffic reaches Kimai, so people outside your staff group cannot reach the login page.

        ### Resource note

        Kimai runs as PHP-Apache + MariaDB. Plan for ~250 MB RAM at idle, ~500 MB under bulk export or invoice rendering on busy month-end.
    fr:
      display_name: Kimai
      what_it_is: Suivi du temps open-source. Clients, projets, activités, feuilles de temps, équipes multi-utilisateur, facturation à partir du temps suivi. SAML fédère avec Keycloak via l'UI admin post-déploiement.
      replaces: ["Toggl", "Clockify", "Harvest", "TimeCamp"]
      compose_description: |
        Suivi du temps open-source. Clients, projets, feuilles de temps, factures. Remplace Toggl / Clockify / Harvest.

        https://docs.catena.run/apps/kimai/
      setup_steps: |
        1. Cliquez **Deploy**. Patientez ~1 min pour le premier démarrage (les migrations de base s'exécutent au premier lancement).
        2. Visitez votre domaine Kimai. Connectez-vous avec `KIMAI_ADMIN_EMAIL` / `KIMAI_ADMIN_PASSWORD` de l'onglet Environment.
        3. *(Optionnel)* Activez Keycloak SAML SSO : **System** -> **Settings** -> **SAML** -> activez et collez :
           - **Identity Provider Entity ID :** `<OIDC_ISSUER_URL>/protocol/saml/descriptor` (votre contact peut générer un client SAML dans Keycloak)
           - **URL de connexion unique :** `<OIDC_ISSUER_URL>/protocol/saml`
           - **Certificat X.509 :** tiré des métadonnées du realm Keycloak
           - **Attribut nom d'utilisateur :** `username` (ou `email`)
           - Validez. La connexion admin locale continue de fonctionner comme issue de secours.
        4. Configurez votre modèle de facture par défaut sous **Invoices** -> **Templates** -> choisissez-en un (DOCX / HTML / PDF). Réglez le logo, l'adresse et les taux de taxe sous **System** -> **Configuration**.
      extra_notes: |
        ### Suivi du temps dans la suite Catena

        Kimai est le maître du suivi du temps dans la suite Catena. Les heures saisies ici alimentent votre application de facturation (Invoice Ninja) via la synchronisation mensuelle de votre contact (demandez-lui de l'automatiser si vous le souhaitez). Les fiches clients dans Kimai portent un champ personnalisé `espo_account_id` afin que chaque feuille de temps soit liée au compte EspoCRM correspondant.

        ### Facturation intégrée

        Kimai peut générer des factures PDF directement depuis le temps suivi. Utilisez cette voie si votre flux de facturation est "envoyer un PDF, le client paie par virement Interac ou bancaire". Si vous avez besoin de paiements en ligne via Stripe, d'un portail client ou de facturation récurrente, demandez à votre contact de déployer Invoice Ninja et la suite acheminera les factures à travers lui.

        ### Authentification

        Tant que SAML n'est pas câblé (étape 3 ci-dessus), Kimai utilise un identifiant local. Même après SAML, la connexion admin locale continue de fonctionner comme issue de secours. Le groupe Keycloak `staff` filtre l'accès au bord Traefik via oauth2-proxy avant que le trafic n'atteigne Kimai, donc les personnes hors de votre équipe ne peuvent pas atteindre la page de connexion.

        ### Ressources

        Kimai tourne en PHP-Apache + MariaDB. Prévoyez ~250 Mo de RAM au repos, ~500 Mo lors d'exports en masse ou de rendu de factures en fin de mois chargée.

  - id: invoiceninja
    app_name: invoiceninja
    bench_pack: mariadb
    # APP_URL baked into invoice PDFs (Stripe redirect URLs, client
    # portal links). Flipping the FQDN breaks previously-sent invoice
    # links + the Stripe webhook destination.
    hostname_baked: true
    upstream_url: https://www.invoiceninja.com/
    sso_mode: post-deploy-ui
    domain_host: "invoice.{{ cloudflare_zone }}"
    domain_service: nginx
    domain_port: 80
    compose_file: "compose/invoiceninja.compose.yml"
    # Atomic per-cycle MariaDB logical dump (Sprint 2.1).
    quiesce_pre: "docker exec \"$(docker ps -q -f label=com.docker.compose.service=db -f label=com.docker.compose.project~=invoiceninja | head -1)\" sh -c 'mariadb-dump --single-transaction --quick --routines --triggers --add-drop-table -u root -p\"$MARIADB_ROOT_PASSWORD\" --all-databases > /var/lib/mysql/.catena-dump.sql.new && mv /var/lib/mysql/.catena-dump.sql.new /var/lib/mysql/.catena-dump.sql'"
    quiesce_post: "true"
    quiesce_timeout_seconds: 60
    env_defaults:
      - "DOMAIN_HOST=invoice.{{ cloudflare_zone }}"
      - "INVOICENINJA_HOSTNAME=invoice.{{ cloudflare_zone }}"
      # APP_KEY must be set to base64:<44-char-base64-string> AFTER
      # first deploy. See setup_steps -- Portainer App Templates have
      # no per-deploy secret generator and APP_KEY needs a valid base64
      # form, so this stays empty until the operator runs
      # `php artisan key:generate --show` and pastes the output.
      - "INVOICENINJA_APP_KEY="
      - "INVOICENINJA_ADMIN_EMAIL=admin@{{ cloudflare_zone }}"
      - "INVOICENINJA_ADMIN_PASSWORD={{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
      - "DB_PASSWORD={{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
      - "DB_ROOT_PASSWORD={{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
      # SMTP. Exposed for the operator's managed-relay creds. Leaving
      # MAIL_HOST blank means Invoice Ninja queues mail to nowhere --
      # the queue worker logs the failure but the app stays usable
      # for everything except actual outbound email.
      - "INVOICENINJA_SMTP_HOST="
      - "INVOICENINJA_SMTP_PORT=587"
      - "INVOICENINJA_SMTP_USERNAME="
      - "INVOICENINJA_SMTP_PASSWORD="
      - "INVOICENINJA_MAIL_FROM=invoice@{{ cloudflare_zone }}"
      - "INVOICENINJA_MAIL_FROM_NAME=Invoicing"
    en:
      display_name: Invoice Ninja
      what_it_is: Open-source invoicing with Stripe + PayPal payment gateways, recurring billing, expense tracking, client portal for online payment. Self-hosted gets all Pro + Enterprise features.
      replaces: ["FreshBooks", "QuickBooks (invoicing module)", "Zoho Invoice", "Harvest (invoicing)"]
      compose_description: |
        Invoicing + Stripe payments + recurring + client portal. Replaces FreshBooks / Zoho Invoice / QuickBooks invoicing.

        https://docs.catena.run/apps/invoiceninja/
      setup_steps: |
        1. Click **Deploy**. Wait ~2 min for the first boot (Laravel migrations + admin user seeding via `init.sh`).
        2. **One-time: generate APP_KEY**. From a shell on your VPS:
           ```
           docker exec $(docker ps --filter name=invoiceninja-app --format '{{.Names}}' | head -1) \
             runuser -u www-data -- php artisan key:generate --show --no-interaction
           ```
           Copy the `base64:...` output. In Portainer: edit the **Environment variables** -> set `INVOICENINJA_APP_KEY` to the copied value, then click **Update the stack** to redeploy.
        3. Visit your Invoice Ninja domain. Sign in as `INVOICENINJA_ADMIN_EMAIL` / `INVOICENINJA_ADMIN_PASSWORD` from the Environment tab.
        4. Configure your **company profile** (Settings -> Company Details): logo, address, tax IDs (GST/QST for Canada), default currency.
        5. Wire **Stripe**: Settings -> Online Payments -> Add Gateway -> Stripe. Paste your Stripe publishable + secret keys. The client portal will accept card payments after this.
        6. *(Optional)* Configure SMTP: paste `INVOICENINJA_SMTP_*` in the Environment tab, click Redeploy. Mail send fails silently into the queue until SMTP is wired.
      extra_notes: |
        ### Invoicing in the Catena suite

        Invoice Ninja is the invoicing master in the Catena suite. Hours from Kimai (the time-tracking master) flow into Invoice Ninja invoices via the operator's monthly sync, and paid invoices from Invoice Ninja flow into ERPNext (the accounting master) via the operator's month-end close action. Clients in Invoice Ninja carry an `espo_account_id` custom field so each invoice ties back to the EspoCRM Account.

        ### License

        Invoice Ninja's self-hosted edition ships under the Elastic License 2.0. Two practical implications:
        - Hosting Invoice Ninja for your business on your VPS, and your operator hosting it for you and billing for the hosting service, are both explicitly within the license terms.
        - Reselling Invoice Ninja as a SaaS product, or bundling it into another SaaS, requires a commercial license from Invoice Ninja LLC. Catena's deployment model is "we deploy onto your VPS; you own the deployment" -- the licensed-and-permitted hosting path.
        - The free self-hosted edition shows "Powered by Invoice Ninja" branding on client-facing surfaces. A US$40/year white-label license removes this. Recommended once you're invoicing real clients.

        ### Authentication

        Native OIDC for self-hosted is an open feature request upstream. Until it ships, Invoice Ninja uses local username/password. The Keycloak `staff` group gates access at the Traefik edge via oauth2-proxy before traffic reaches Invoice Ninja, so people outside your staff group cannot reach the login page.

        ### Payment processing

        Invoice Ninja handles the client-payment side. When a client pays via the portal, Stripe processes the card and Invoice Ninja marks the invoice paid + records the payment. The amount is settled into your Stripe account (under your name, your tax ID); Catena does not route payments through any operator-owned account.

        ### Resource note

        Invoice Ninja runs as PHP-FPM + nginx + MariaDB + Redis -- four containers. Plan for ~400 MB RAM at idle, ~800 MB under bulk-invoice generation or queue backlog catch-up. PDF rendering for invoices uses bundled Chromium and spikes briefly during multi-page exports.
    fr:
      display_name: Invoice Ninja
      what_it_is: Facturation open-source avec passerelles de paiement Stripe + PayPal, facturation récurrente, suivi des dépenses, portail client pour paiement en ligne. L'auto-hébergement débloque toutes les fonctionnalités Pro + Enterprise.
      replaces: ["FreshBooks", "QuickBooks (module facturation)", "Zoho Invoice", "Harvest (facturation)"]
      compose_description: |
        Facturation + paiements Stripe + récurrence + portail client. Remplace FreshBooks / Zoho Invoice / la facturation QuickBooks.

        https://docs.catena.run/apps/invoiceninja/
      setup_steps: |
        1. Cliquez **Deploy**. Patientez ~2 min pour le premier démarrage (migrations Laravel + création de l'admin par `init.sh`).
        2. **Une seule fois : générez APP_KEY**. Depuis un terminal sur votre VPS :
           ```
           docker exec $(docker ps --filter name=invoiceninja-app --format '{{.Names}}' | head -1) \
             runuser -u www-data -- php artisan key:generate --show --no-interaction
           ```
           Copiez la sortie `base64:...`. Dans Portainer : modifiez les **variables d'environnement** -> réglez `INVOICENINJA_APP_KEY` à la valeur copiée, puis cliquez **Update the stack** pour redéployer.
        3. Visitez votre domaine Invoice Ninja. Connectez-vous avec `INVOICENINJA_ADMIN_EMAIL` / `INVOICENINJA_ADMIN_PASSWORD` de l'onglet Environment.
        4. Configurez votre **profil d'entreprise** (Settings -> Company Details) : logo, adresse, identifiants fiscaux (TPS/TVQ au Canada), devise par défaut.
        5. Connectez **Stripe** : Settings -> Online Payments -> Add Gateway -> Stripe. Collez vos clés publishable + secret. Le portail client accepte les paiements par carte après cela.
        6. *(Optionnel)* Configurez SMTP : collez `INVOICENINJA_SMTP_*` dans l'onglet Environment, cliquez Redeploy. L'envoi de courriel reste en file d'attente silencieusement tant que SMTP n'est pas câblé.
      extra_notes: |
        ### Facturation dans la suite Catena

        Invoice Ninja est le maître de la facturation dans la suite Catena. Les heures depuis Kimai (maître du suivi du temps) alimentent les factures Invoice Ninja via la synchronisation mensuelle de votre contact, et les factures payées depuis Invoice Ninja alimentent ERPNext (maître de la comptabilité) via l'action de fin de mois de votre contact. Les clients dans Invoice Ninja portent un champ personnalisé `espo_account_id` afin que chaque facture soit liée au compte EspoCRM correspondant.

        ### Licence

        L'édition auto-hébergée d'Invoice Ninja est sous Elastic License 2.0. Deux implications pratiques :
        - Héberger Invoice Ninja pour votre entreprise sur votre VPS, et votre contact qui l'héberge pour vous et facture pour le service d'hébergement, sont explicitement autorisés par la licence.
        - Revendre Invoice Ninja comme SaaS, ou l'intégrer comme partie d'un autre SaaS, requiert une licence commerciale d'Invoice Ninja LLC. Le modèle Catena est "nous déployons sur votre VPS ; vous possédez le déploiement" -- c'est la voie d'hébergement autorisée.
        - L'édition gratuite affiche un bandeau "Powered by Invoice Ninja" sur les surfaces client. Une licence white-label à 40 USD/an le retire. Recommandé dès que vous facturez de vrais clients.

        ### Authentification

        OIDC natif en auto-hébergement est une demande ouverte côté upstream. En attendant, Invoice Ninja utilise un identifiant local. Le groupe Keycloak `staff` filtre l'accès au bord Traefik via oauth2-proxy avant que le trafic n'atteigne Invoice Ninja, donc les personnes hors de votre équipe ne peuvent pas atteindre la page de connexion.

        ### Traitement des paiements

        Invoice Ninja gère le côté paiement client. Quand un client paie via le portail, Stripe traite la carte et Invoice Ninja marque la facture payée + enregistre le paiement. Le montant est versé sur votre compte Stripe (à votre nom, votre identifiant fiscal) ; Catena ne fait transiter aucun paiement par un compte appartenant au contact.

        ### Ressources

        Invoice Ninja tourne en PHP-FPM + nginx + MariaDB + Redis -- quatre conteneurs. Prévoyez ~400 Mo de RAM au repos, ~800 Mo en génération de factures en masse ou rattrapage de file. Le rendu PDF utilise Chromium intégré et a des pointes brèves lors d'exports multi-pages.

  - id: mailserver
    app_name: mailserver
    bench_pack: nodb
    # The mail FQDN is baked into DKIM/SPF/DMARC DNS + the MX record +
    # every sent message's headers. Rekeying the hostname breaks
    # deliverability and previously-published DNS.
    hostname_baked: true
    upstream_url: https://docker-mailserver.github.io/
    # ops converge drops the Dovecot OAuth2 introspection conf + the
    # Roundcube oauth provider config; the client never touches SSO.
    sso_mode: auto
    # Traefik routes the WEBMAIL (Roundcube) host. The mail host
    # (mail.<zone>) is NOT a Traefik route -- it is the MX / mail FQDN
    # reached directly on ports 25/465/587/993 (public-port registry).
    domain_host: "webmail.{{ cloudflare_zone }}"
    domain_service: roundcube
    domain_port: 80
    # NOTE: mail.<zone> (the MX / mail FQDN) is intentionally NOT a
    # Traefik route. It is reached directly on ports 25/465/587/993
    # (opened via the public-port registry from the compose vps.expose
    # label) and resolved by a gray-cloud DNS A record that ops creates.
    compose_file: "compose/mailserver.compose.yml"
    # MTA-STS policy host -- the only HTTP route this template adds
    # beyond webmail. Served by the mta-sts nginx service in the compose;
    # the catena converge adds the Traefik route from this extra_domains
    # entry. The
    # matching _mta-sts / _smtp._tls TXT records are created by ops
    # (roles/infrastructure mailserver_dns.yml).
    extra_domains:
      - host: "mta-sts.{{ cloudflare_zone }}"
        service: mta-sts
        port: 80
    # Outbound relay password is vault-backed + re-injected every
    # converge (separate from the transactional SMTP_* creds).
    env_managed_keys:
      - RELAY_PASSWORD
    env_defaults:
      - "DOMAIN_HOST=webmail.{{ cloudflare_zone }}"
      - "MAIL_HOSTNAME=mail.{{ cloudflare_zone }}"
      - "MAIL_DOMAIN={{ cloudflare_zone }}"
      - "WEBMAIL_HOSTNAME=webmail.{{ cloudflare_zone }}"
      # Keycloak token introspection endpoint (Dovecot/Postfix validate
      # XOAUTH2 access tokens against this). The introspection CLIENT
      # secret is wired by ops into dovecot-oauth2.conf.ext, not here.
      - "OIDC_INTROSPECTION_URL=https://{{ keycloak_hostname | default('auth.' ~ cloudflare_zone) }}/realms/{{ keycloak_realm | default('vps') }}/protocol/openid-connect/token/introspect"
      # Outbound smarthost. HOST/USER are operator-pasted (provider-
      # specific); PASSWORD is vault-backed (env_managed). Leaving HOST
      # blank queues outbound with no relay -- inbound still works.
      - "RELAY_HOST="
      - "RELAY_PORT=587"
      - "RELAY_USER="
      - "RELAY_PASSWORD={{ vault_mailserver_relay_password }}"
    en:
      display_name: Mail server + webmail
      what_it_is: Self-hosted email -- inbox storage on your VPS (Postfix + Dovecot + Rspamd) with Roundcube webmail and Keycloak single sign-on. Outbound requires an SMTP relay through a reputable provider (set up before deploy) so messages are not flagged as spam.
      replaces: ["Google Workspace (Gmail)", "Microsoft 365 (Exchange Online)"]
      compose_description: |
        Self-hosted mailboxes + Roundcube webmail, Keycloak SSO. Outbound requires an SMTP relay. Replaces Gmail / Exchange Online.

        https://docs.catena.run/apps/mailserver/
      setup_steps: |
        1. **Before deploy -- DNS + relay.** Mail needs DNS records and an outbound relay set up first. Your contact handles the MX, SPF, DKIM, DMARC, reverse-DNS, and MTA-STS / TLS-RPT records and pastes the relay credentials. See the operator runbook.
        2. Click **Deploy**. Wait ~3 minutes for the first boot (mail services + Roundcube).
        3. Sign in at your webmail domain (`webmail.<your-domain>`). The login goes through Keycloak -- one account for every app in the suite. There is no separate mail password.
        4. Mailboxes are created automatically for your staff and client users from Keycloak. A new user can sign in to webmail as soon as their account exists.
      extra_notes: |
        ### How sign-in works

        Roundcube sends you to Keycloak to log in, then connects to your mailbox on your behalf using a single-sign-on token. You never type a separate email password, and nothing stores one. Because this needs a normal browser tab, webmail opens in its own tab from the suite menu rather than embedded inside another app.

        ### Desktop and phone mail apps

        This template targets **webmail**. Standard desktop clients (Thunderbird, Apple Mail) and phone Mail apps cannot use Keycloak single sign-on with a self-hosted server, so they are not supported here -- use Roundcube in the browser.

        ### Why outbound goes through a relay

        Sending mail straight from a VPS lands in spam: large providers distrust new server IPs. Outbound is relayed through a reputable provider so your messages are delivered, while your inbox and data stay on your VPS. This relay is separate from the suite's notification email.

        ### Spam and virus scanning

        Incoming mail is checked for spam (sender reputation, content scoring) and every attachment is scanned for viruses before it reaches your inbox, the same protection a hosted suite gives you. The virus scanner is shared with Nextcloud when both are deployed, so files you upload there are scanned by the same engine.
    fr:
      display_name: Serveur de courriel + webmail
      what_it_is: Courriel auto-hébergé -- stockage des boîtes sur votre VPS (Postfix + Dovecot + Rspamd) avec le webmail Roundcube et l'authentification unique Keycloak. L'envoi requiert un relais SMTP via un fournisseur réputé (configuré avant le déploiement) pour éviter le classement en pourriel.
      replaces: ["Google Workspace (Gmail)", "Microsoft 365 (Exchange Online)"]
      compose_description: |
        Boîtes auto-hébergées + webmail Roundcube, SSO Keycloak. Un relais SMTP est requis pour l'envoi. Remplace Gmail / Exchange Online.

        https://docs.catena.run/apps/mailserver/
      setup_steps: |
        1. **Avant le déploiement -- DNS + relais.** Le courriel nécessite des enregistrements DNS et un relais d'envoi configurés au préalable. Votre contact s'occupe des enregistrements MX, SPF, DKIM, DMARC, DNS inverse, et MTA-STS / TLS-RPT, et colle les identifiants du relais. Voir le guide de l'exploitant.
        2. Cliquez **Deploy**. Patientez ~3 minutes pour le premier démarrage (services de courriel + Roundcube).
        3. Connectez-vous à votre domaine webmail (`webmail.<votre-domaine>`). La connexion passe par Keycloak -- un seul compte pour toutes les applications de la suite. Aucun mot de passe de courriel distinct.
        4. Les boîtes sont créées automatiquement pour vos utilisateurs staff et client depuis Keycloak. Un nouvel utilisateur peut se connecter au webmail dès que son compte existe.
      extra_notes: |
        ### Fonctionnement de la connexion

        Roundcube vous redirige vers Keycloak pour vous connecter, puis accède à votre boîte en votre nom à l'aide d'un jeton d'authentification unique. Vous ne saisissez jamais de mot de passe de courriel distinct, et aucun n'est stocké. Comme cela exige un onglet de navigateur standard, le webmail s'ouvre dans son propre onglet depuis le menu de la suite plutôt qu'intégré dans une autre application.

        ### Applications de bureau et mobiles

        Ce modèle vise le **webmail**. Les clients de bureau classiques (Thunderbird, Apple Mail) et les apps Mail des téléphones ne peuvent pas utiliser l'authentification unique Keycloak avec un serveur auto-hébergé ; ils ne sont donc pas pris en charge ici -- utilisez Roundcube dans le navigateur.

        ### Pourquoi l'envoi passe par un relais

        Envoyer du courriel directement depuis un VPS finit en pourriel : les grands fournisseurs se méfient des nouvelles IP de serveur. L'envoi passe par un fournisseur réputé pour que vos messages soient livrés, tandis que votre boîte et vos données restent sur votre VPS. Ce relais est distinct du courriel de notification de la suite.

        ### Analyse antipourriel et antivirus

        Le courriel entrant est vérifié contre le pourriel (réputation de l'expéditeur, pointage du contenu) et chaque pièce jointe est analysée contre les virus avant d'atteindre votre boîte, la même protection qu'une suite hébergée. L'antivirus est partagé avec Nextcloud lorsque les deux sont déployés, donc les fichiers que vous y téléversez sont analysés par le même moteur.
