  - id: erpnext
    app_name: erpnext
    bench_pack: mariadb
    # Frappe's sitename = the hostname directory under sites/, hashed
    # into the DB schema and the asset URLs. Renaming a site requires
    # `bench rename-site`; the bench cannot install the same template
    # under two different FQDNs from a shared volume.
    hostname_baked: true
    upstream_url: https://erpnext.com/
    sso_mode: post-deploy-ui
    domain_host: "erp.{{ cloudflare_zone }}"
    domain_service: frontend
    domain_port: 8080
    compose_file: "compose/erpnext.compose.yml"
    # Atomic per-cycle MariaDB logical dump (Sprint 2.1).
    quiesce_pre: "docker exec \"$(docker ps -q -f label=com.docker.compose.service=db -f label=com.docker.compose.project~=erpnext | head -1)\" sh -c 'mariadb-dump --single-transaction --quick --routines --triggers --add-drop-table -u root -p\"$MARIADB_ROOT_PASSWORD\" --all-databases > /var/lib/mysql/.catena-dump.sql.new && mv /var/lib/mysql/.catena-dump.sql.new /var/lib/mysql/.catena-dump.sql'"
    quiesce_post: "true"
    quiesce_timeout_seconds: 60
    env_defaults:
      - "DOMAIN_HOST=erp.{{ cloudflare_zone }}"
      - "ERPNEXT_HOSTNAME=erp.{{ cloudflare_zone }}"
      - "ERPNEXT_ADMIN_PASSWORD={{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
      - "DB_ROOT_PASSWORD={{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    en:
      display_name: ERPNext
      what_it_is: Full open-source ERP suite -- accounting, inventory, HR/payroll, CRM, manufacturing, projects, and a built-in website/e-commerce module.
      replaces: ["SAP Business One", "Odoo", "Oracle NetSuite"]
      compose_description: |
        Open-source ERP (accounting/inventory/HR/CRM/manufacturing). Replaces SAP / Odoo / NetSuite.

        https://docs.catena.run/apps/erpnext/
      setup_steps: |
        1. Click **Deploy**. First boot takes 5-10 min -- the site must be created, MariaDB initialized, Python apps installed. Watch the `create-site` container logs in Portainer if you want to follow along.
        2. Visit your ERPNext domain. Sign in as `Administrator` / `ERPNEXT_ADMIN_PASSWORD` from the Environment tab.
        3. Complete the setup wizard: company name, fiscal year, base currency, chart of accounts template.
        4. *(Optional)* Enable Keycloak SSO: **Integrations** -> **Social Login Keys** -> **New** -> **Provider: OpenID Connect**. Fill:
           - **Client ID:** `OIDC_CLIENT_ID` from Environment
           - **Client Secret:** `OIDC_CLIENT_SECRET`
           - **Base URL:** `OIDC_ISSUER_URL`
           - Save. The login page shows **Login with OpenID Connect**.
      extra_notes: |
        **Resource note.** ERPNext is heavy -- 10+ containers, ~3 GB RAM + 2 CPUs recommended minimum. Consider running it on a dedicated VPS tier if you also deploy Nextcloud + chat + other apps alongside.

        **Upgrade path.** Major version bumps (v15 -> v16) require `bench migrate`. The compose template leaves `vps.auto-update=patch` on every service so weekly automated updates stay within v15.x.x -- majors are a deliberate operator action, not a 3 a.m. auto-update.
    fr:
      display_name: ERPNext
      what_it_is: Suite ERP open-source complète -- comptabilité, inventaire, RH/paie, CRM, production, projets, et un module site web / e-commerce intégré.
      replaces: ["SAP Business One", "Odoo", "Oracle NetSuite"]
      compose_description: |
        ERP open-source (compta/stock/RH/CRM/prod). Remplace SAP / Odoo / NetSuite.

        https://docs.catena.run/apps/erpnext/
      setup_steps: |
        1. Cliquez **Deploy**. Le premier démarrage dure 5-10 min -- le site est créé, MariaDB initialisé, les apps Python installées. Consultez les logs du conteneur `create-site` dans Portainer si vous voulez suivre.
        2. Visitez votre domaine ERPNext. Connectez-vous avec `Administrator` / `ERPNEXT_ADMIN_PASSWORD` de l'onglet Environment.
        3. Complétez l'assistant : nom de société, exercice fiscal, devise, plan comptable.
        4. *(Optionnel)* Activez Keycloak SSO : **Integrations** -> **Social Login Keys** -> **New** -> **Provider: OpenID Connect**. Remplissez :
           - **Client ID :** `OIDC_CLIENT_ID` depuis Environment
           - **Client Secret :** `OIDC_CLIENT_SECRET`
           - **Base URL :** `OIDC_ISSUER_URL`
           - Validez. La page de connexion affiche **Login with OpenID Connect**.
      extra_notes: |
        **Ressources.** ERPNext est lourd -- 10+ conteneurs, minimum ~3 GB RAM + 2 CPUs recommandés. Envisagez un VPS dédié si vous déployez aussi Nextcloud + chat + autres apps en parallèle.

        **Montées de version.** Les bumps majeurs (v15 -> v16) nécessitent `bench migrate`. Le template laisse `vps.auto-update=patch` sur chaque service : les mises à jour hebdomadaires automatiques restent en v15.x.x -- les majeurs sont une action opérateur délibérée, pas une auto-update à 3 h du matin.

  - id: actualbudget
    app_name: actualbudget
    bench_pack: embedded
    # Single-user sqlite; FQDN is read fresh by the client each time
    # and never persisted into stored data.
    hostname_baked: false
    upstream_url: https://actualbudget.org/
    sso_mode: none
    domain_host: "budget.{{ cloudflare_zone }}"
    domain_service: actual
    domain_port: 5006
    compose_file: "compose/actualbudget.compose.yml"
    # Atomic per-cycle SQLite Online Backup quiesce (Sprint 2.2).
    # actualbudget is the only SQLite-as-primary-DB template in the
    # catalog. The Online Backup API takes a SHARED lock that does
    # NOT block concurrent writers -- safe to run while the server
    # is live. Writes to `.new` sidecar then atomic-renames onto
    # `/data/server-files/.catena-snapshot.sqlite`. On restore the
    # operator replaces the live `account.sqlite` with the snapshot.
    quiesce_pre: "docker exec \"$(docker ps -q -f label=com.docker.compose.service=actual -f label=com.docker.compose.project~=actualbudget | head -1)\" sh -c 'sqlite3 /data/server-files/account.sqlite \".backup /data/server-files/.catena-snapshot.sqlite.new\" && mv /data/server-files/.catena-snapshot.sqlite.new /data/server-files/.catena-snapshot.sqlite'"
    quiesce_post: "true"
    quiesce_timeout_seconds: 30
    env_defaults:
      - "DOMAIN_HOST=budget.{{ cloudflare_zone }}"
    en:
      display_name: Actual Budget
      what_it_is: Self-hosted personal finance. Envelope budgeting, bank account syncing via SimpleFIN or GoCardless, encrypted end-to-end.
      replaces: ["YNAB (You Need A Budget)", "Mint", "EveryDollar"]
      compose_description: |
        Self-hosted personal finance + envelope budgeting. Replaces YNAB / Mint.

        https://docs.catena.run/apps/actualbudget/
      setup_steps: |
        1. Click **Deploy**. Wait ~30 s.
        2. Visit your Actual Budget domain. Set a server password on first visit (it's stored locally; remember it -- no recovery).
        3. Create a new budget or import an existing one (file menu -> Import from YNAB4 / YNAB5 / nYNAB).
        4. *(Optional)* Connect bank accounts via **Settings** -> **Connected Accounts** -> SimpleFIN (USD/CAD, paid) or GoCardless (EUR/GBP, free).
      extra_notes: |
        **Note on sign-in.** Actual Budget uses a single shared server password to unlock the UI, not per-user logins. Multi-user is supported at the budget level (share the budget file) but the server auth is a single secret. This matches how the upstream project is designed: typically one household per server. OIDC/SSO isn't supported.
    fr:
      display_name: Actual Budget
      what_it_is: Finances personnelles auto-hébergées. Budgétisation par enveloppes, synchro bancaire via SimpleFIN ou GoCardless, chiffré de bout en bout.
      replaces: ["YNAB (You Need A Budget)", "Mint", "EveryDollar"]
      compose_description: |
        Finances personnelles + budgétisation par enveloppes auto-hébergées. Remplace YNAB / Mint.

        https://docs.catena.run/apps/actualbudget/
      setup_steps: |
        1. Cliquez **Deploy**. Patientez ~30 s.
        2. Visitez votre domaine Actual Budget. Définissez un mot de passe serveur au premier accès (stocké localement ; retenez-le -- pas de récupération).
        3. Créez un nouveau budget ou importez-en un existant (menu fichier -> Importer depuis YNAB4 / YNAB5 / nYNAB).
        4. *(Optionnel)* Connectez des comptes bancaires via **Settings** -> **Connected Accounts** -> SimpleFIN (USD/CAD, payant) ou GoCardless (EUR/GBP, gratuit).
      extra_notes: |
        **À propos de la connexion.** Actual Budget utilise un mot de passe serveur partagé pour déverrouiller l'UI, pas des connexions par utilisateur. Le multi-utilisateurs fonctionne au niveau du budget (partage de fichier budget) mais l'auth serveur est un secret unique. C'est la conception upstream : typiquement un foyer par serveur. OIDC/SSO non supporté.

