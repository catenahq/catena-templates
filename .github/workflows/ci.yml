name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
permissions: {}
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: catenahq/contracts/.github/workflows/pr.yml@ede5b1277e10a673fd5ff7791e4abfd20dbd3738 # main
    permissions:
      contents: read
      actions: read
      pull-requests: write
      security-events: write
      issues: write
    secrets:
      DOCKERHUB_USERNAME: ${{ !startsWith(github.head_ref || github.ref_name, 'agent/') && github.actor != vars.AGENT_LOGIN && secrets.DOCKERHUB_USERNAME || '' }}
      DOCKERHUB_TOKEN: ${{ !startsWith(github.head_ref || github.ref_name, 'agent/') && github.actor != vars.AGENT_LOGIN && secrets.DOCKERHUB_TOKEN || '' }}
    with:
      runner: ubuntu-26.04
