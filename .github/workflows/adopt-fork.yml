name: adopt-fork

# A maintainer runs this by hand with the number of a fork's pull request, once
# they have read it. It copies the pull request's app onto the branch
# adopt/<pr> of this repository and opens the pull request from that branch
# into the fork's base branch, which the checks and the app tests run like any
# pull request of this repository. A pull request that is not open, or that does
# not come from a fork, is refused. Nothing of the fork is checked out, built or
# run: build/adopt.py reads the fork's files as blobs through the API and writes
# them as blobs here. A change that is not inside one app is refused. The
# number reaches the script through env: only.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: the number of the fork's pull request
        type: number
        required: true

permissions:
  contents: read

concurrency:
  group: adopt-fork-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  adopt:
    runs-on: ubuntu-26.04
    steps:
      - name: Mint a GitHub App token that can write branches and open pull requests
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      # The default branch holds the reviewed copy of the script.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Copy the app onto adopt/<pr> and open its pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: uv run build/adopt.py "$BASE_REPO" "$PR"
