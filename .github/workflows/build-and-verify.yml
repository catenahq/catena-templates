name: build-and-verify

# A push to a branch keeps the absolute gate. A pull request is judged on what
# it introduces: every job but schema and prose runs its gate through
# contracts' new-failures-only action, which fails only on failures the base
# commit does not have, and the prose gate looks at the files the change
# touches.
#
# Another repository with the same layout calls this workflow with
# `catalog: false`. Its tools then come from a checkout of catena-templates at
# `tools-ref` into .tools, TEMPLATES_ROOT names the caller's tree, the render
# drift covers its blueprints only, its own tests/ run, and the duplication job
# is skipped.

on:
  # Every pushed branch. Renovate, engine-bump and image-pin branches always
  # carry a pull request, which tests each push to them.
  push:
    branches-ignore: ['renovate/**', 'engine-bump/**', 'image-pin/**', 'scanctl/**']
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      catalog:
        description: true for the catalog itself, false for another repository's tree
        type: boolean
        default: true
      tools-ref:
        description: the catena-templates ref the tools are checked out at when catalog is false
        type: string
        default: main
      own-images:
        description: comma-separated image repositories (no tag) the caller builds itself
        type: string
        default: ''

permissions:
  contents: read

env:
  TEMPLATES_ROOT: ${{ format('{0}', inputs.catalog) == 'false' && github.workspace || '' }}
  TOOLS: ${{ format('{0}', inputs.catalog) == 'false' && '.tools' || '.' }}
  DRIFT_PATHS: ${{ format('{0}', inputs.catalog) == 'false' && 'blueprints' || 'blueprints templates.json catalog.json index.html' }}

jobs:
  render-idempotency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check out the tools
        if: env.TEMPLATES_ROOT != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: catenahq/catena-templates
          ref: ${{ inputs.tools-ref }}
          path: .tools
          persist-credentials: false
      - name: Render and verify no drift between sources/ and the generated artifacts
        uses: catenahq/contracts/.github/actions/new-failures-only@main
        with:
          working-directory: ${{ github.workspace }}
          repo-path: ${{ github.workspace }}
          run: |
            uv run "$TOOLS/build/render.py"
            if ! git diff --exit-code $DRIFT_PATHS; then
              echo ""
              echo "render output drifted from committed artifacts."
              echo "Run 'make render' locally, commit the diff, push."
              exit 1
            fi

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check out the tools
        if: env.TEMPLATES_ROOT != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: catenahq/catena-templates
          ref: ${{ inputs.tools-ref }}
          path: .tools
          persist-credentials: false
      - name: Render the generated files the validator reads
        if: env.TEMPLATES_ROOT != ''
        run: uv run "$TOOLS/build/render.py"
      - name: Validate sources/ and templates.json against their schemas
        run: uv run "$TOOLS/build/validate.py"

  # The hygiene gates live in catenahq/contracts and are run from there,
  # so this repo holds no copy of them. Both checkouts use an explicit
  # path to put contracts alongside this repo, the same layout local dev
  # uses.
  unicode-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: catena-templates
          # Needed for the merge-base the prose scope is measured against.
          fetch-depth: 0
          persist-credentials: false
      - name: Check out sibling contracts
        uses: catenahq/contracts/.github/actions/checkout-sibling@main
        with:
          repository: catenahq/contracts
          path: contracts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: check:unicode
        # A finding is its file, its kind and its line's text: the sed drops
        # the line number, so a moved line is not a new finding.
        uses: catenahq/contracts/.github/actions/new-failures-only@main
        with:
          working-directory: ${{ github.workspace }}/catena-templates
          repo-path: ${{ github.workspace }}/catena-templates
          failure-lines: '^  [^ :]+: .*'
          run: |
            node ../contracts/scripts/check-unicode.mjs 2>&1 \
              | sed -E '/^  [^ :]+:[0-9]+: /{N;s/^(  [^ :]+):[0-9]+: ([^\n]*)\n +(.*)$/\1: \2 | \3/}'
      - name: Repo rules (no tracked env file; .gitignore carries the env rule)
        uses: catenahq/contracts/.github/actions/new-failures-only@main
        with:
          working-directory: ${{ github.workspace }}/catena-templates
          repo-path: ${{ github.workspace }}/catena-templates
          run: node ../contracts/scripts/check-repo-rules.mjs
      # Pinned in contracts/.vale-version, which check-prose.mjs also
      # reads and enforces: the grammars decide which comments are
      # visible, so a different version is a different gate.
      - name: Install vale
        run: |
          version="$(cat contracts/.vale-version)"
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${version}/vale_${version}_Linux_64-bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" vale
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: check:prose
        working-directory: ./catena-templates
        # On a pull request, gate only on the files the change touches. A
        # prose finding that landed on the base branch is not this change's
        # doing, and failing every open dependency PR on it blames the wrong
        # commit. The whole tree is still scanned and anything carried is still
        # printed; the push and cron runs of the default branch keep the
        # absolute gate.
        env:
          PROSE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$PROSE_BASE" ]; then
            node ../contracts/scripts/check-prose.mjs --changed-since "$PROSE_BASE"
          else
            node ../contracts/scripts/check-prose.mjs
          fi

  lint-quiesce-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check out the tools
        if: env.TEMPLATES_ROOT != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: catenahq/catena-templates
          ref: ${{ inputs.tools-ref }}
          path: .tools
          persist-credentials: false
      - name: pytest, quiesce lint and postgres pin lint
        # Three gates in one run: a failure line of one must not hide a new
        # failure of another, so the exit status decides.
        uses: catenahq/contracts/.github/actions/new-failures-only@main
        with:
          working-directory: ${{ github.workspace }}
          repo-path: ${{ github.workspace }}
          run: |
            rc=0
            uv run --with pytest --with jsonschema --with pyyaml pytest tests/ -q || rc=1
            uv run "$TOOLS/build/lint_quiesce.py" || rc=1
            uv run "$TOOLS/build/lint_postgres_pins.py" || rc=1
            exit $rc

  duplication:
    # Copy-paste ratchet: .jscpd.json carries the baseline threshold;
    # exceeding it fails. Lower the threshold as duplication is paid
    # down, never raise it to admit new copy-paste.
    name: Duplication (jscpd)
    if: format('{0}', inputs.catalog) != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: jscpd (threshold in .jscpd.json)
        uses: catenahq/contracts/.github/actions/new-failures-only@main
        with:
          working-directory: ${{ github.workspace }}
          repo-path: ${{ github.workspace }}
          run: npx --yes jscpd@4 --silent
