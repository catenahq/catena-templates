name: app-dispatch

# Asks the bench to run the apps of a pushed commit: a `repository_dispatch`
# event `app-test` to the private catenahq/ops repository, whose app-tests
# workflow runs the lifecycle on the bench and posts the commit status
# `app-tests` back on this commit. Every branch is dispatched, adopt/<pr>
# branches and the renovate branches included. The default branch is judged
# from the commit before the push; any other branch as a whole, from where it
# left the default branch, and only when it changes one app or none: a branch
# that changes more fails here and is not sent. Setting the repository variable
# APP_CI_PAUSED to `true` stops the dispatch; no status is then posted and the
# required `app-tests` check stays pending.
#
# The payload is `{sha, base, ids, ref}`: the commit, the commit the change is
# judged from, the apps it touches (comma-separated slugs) and the branch. The
# ops workflow validates all four again before using them, and skips a commit
# its branch has since moved past. The dispatch needs a token that writes to
# ops: the catenahq-renovate GitHub App's (secrets RENOVATE_APP_CLIENT_ID and
# RENOVATE_APP_PRIVATE_KEY).

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  dispatch:
    if: >-
      !github.event.deleted &&
      vars.APP_CI_PAUSED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: The apps the push changes
        id: scope
        env:
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          base="$BEFORE"
          if [ "$BRANCH" != "$DEFAULT_BRANCH" ] || [ -z "${base//0/}" ] \
            || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git merge-base "$SHA" "origin/$DEFAULT_BRANCH")"
          fi
          git diff --name-only "$base" "$SHA" > "$RUNNER_TEMP/paths.txt"
          if [ "$BRANCH" != "$DEFAULT_BRANCH" ] && ! uv run build/versions.py scope < "$RUNNER_TEMP/paths.txt"; then
            echo "::error::a branch changes one app or none; this one is not sent to the bench"
            exit 1
          fi
          uv run build/app_check.py changed < "$RUNNER_TEMP/paths.txt" > "$RUNNER_TEMP/ids.txt"
          ids=()
          for id in $(cat "$RUNNER_TEMP/ids.txt"); do
            # An app the change deletes has nothing to run.
            if [ -f "blueprints/$id/docker-compose.yml" ]; then ids+=("$id"); fi
          done
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "ids=$(IFS=,; echo "${ids[*]:-}")" >> "$GITHUB_OUTPUT"
      - name: Mint a GitHub App token that can dispatch to ops
        # A new branch at an existing commit changes nothing: that commit has its status.
        if: steps.scope.outputs.base != github.sha
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ops
          permission-contents: write
      - name: Dispatch app-test to ops
        if: steps.scope.outputs.base != github.sha
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          BASE: ${{ steps.scope.outputs.base }}
          IDS: ${{ steps.scope.outputs.ids }}
          BRANCH: ${{ github.ref_name }}
        run: |
          gh api -X POST "repos/$OWNER/ops/dispatches" \
            -f event_type=app-test \
            -f "client_payload[sha]=$SHA" \
            -f "client_payload[base]=$BASE" \
            -f "client_payload[ids]=$IDS" \
            -f "client_payload[ref]=$BRANCH"
