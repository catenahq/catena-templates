name: app-dispatch

# Asks the bench to run the apps of a pushed commit: a `repository_dispatch`
# event `app-test` to the private catenahq/ops repository, whose app-tests
# workflow runs the lifecycle on the bench and posts the commit status
# `app-tests` back on this commit. Every branch is dispatched, adopt/<pr>
# branches and the renovate branches included. On the default branch each
# commit of the push is sent on its own, judged from its parent, so a run holds
# the one app its commit changes. Any other branch is sent as a whole, judged
# from where it left the default branch, and only when it changes one app or
# none: a branch that changes more fails here and is not sent. Setting the repository variable
# APP_CI_PAUSED to `true` stops the dispatch; no status is then posted and the
# required `app-tests` check stays pending.
#
# The payload is `{sha, base, ids, ref, repo}`: the commit, the commit the change
# is judged from, the apps it touches (comma-separated slugs), the branch and the
# name of the repository the event comes from. The ops workflow validates the
# commit, the base, the apps and the branch again before using them, and skips a
# commit its branch has since moved past. The dispatch needs a token that writes to ops: the catenahq-renovate
# GitHub App's (secrets RENOVATE_APP_CLIENT_ID and RENOVATE_APP_PRIVATE_KEY).
#
# Another repository with the same layout calls this workflow with
# `catalog: false`: its tools come from a checkout of catena-templates at
# `tools-ref` into .tools, and TEMPLATES_ROOT names the caller's tree.

on:
  push:
    branches: ['**']
  workflow_call:
    inputs:
      catalog:
        description: true for the catalog itself, false for another repository's tree
        type: boolean
        default: true
      tools-ref:
        description: the catena-templates ref the tools are checked out at when catalog is false
        type: string
        default: main
      own-images:
        description: comma-separated image repositories (no tag) the caller builds itself
        type: string
        default: ''
    secrets:
      RENOVATE_APP_CLIENT_ID:
        required: true
      RENOVATE_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

env:
  TEMPLATES_ROOT: ${{ format('{0}', inputs.catalog) == 'false' && github.workspace || '' }}
  TOOLS: ${{ format('{0}', inputs.catalog) == 'false' && '.tools' || '.' }}

jobs:
  dispatch:
    if: >-
      !github.event.deleted &&
      vars.APP_CI_PAUSED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check out the tools
        if: env.TEMPLATES_ROOT != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: catenahq/catena-templates
          ref: ${{ inputs.tools-ref }}
          path: .tools
          persist-credentials: false
      - name: The apps the push changes
        id: scope
        env:
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          # The apps the change from $1 to $2 touches that $2 still holds, comma-separated.
          apps() {
            local ids=() id
            for id in $(git diff --name-only "$1" "$2" | uv run "$TOOLS/build/app_check.py" changed); do
              # An app the change deletes has nothing to run.
              if git cat-file -e "$2:blueprints/$id/docker-compose.yml" 2>/dev/null; then ids+=("$id"); fi
            done
            (IFS=,; echo "${ids[*]:-}")
          }
          # One line per dispatch: the commit, the commit it is judged from, its apps.
          : > "$RUNNER_TEMP/dispatches.txt"
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ] && [ -n "${BEFORE//0/}" ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # Each commit of the push on its own, judged from its parent: a commit changes one app.
            for commit in $(git rev-list --reverse --first-parent "$BEFORE..$SHA"); do
              parent="$(git rev-parse "$commit^")"
              ids="$(apps "$parent" "$commit")"
              echo "$commit $parent $ids" >> "$RUNNER_TEMP/dispatches.txt"
            done
          else
            base="$(git merge-base "$SHA" "origin/$DEFAULT_BRANCH")"
            if [ "$BRANCH" != "$DEFAULT_BRANCH" ] \
              && ! git diff --name-only "$base" "$SHA" | uv run "$TOOLS/build/versions.py" scope; then
              echo "::error::a branch changes one app or none; this one is not sent to the bench"
              exit 1
            fi
            # A new branch at an existing commit changes nothing: that commit has its status.
            if [ "$base" != "$SHA" ]; then
              ids="$(apps "$base" "$SHA")"
              echo "$SHA $base $ids" >> "$RUNNER_TEMP/dispatches.txt"
            fi
          fi
          cat "$RUNNER_TEMP/dispatches.txt"
          if [ -s "$RUNNER_TEMP/dispatches.txt" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi
      - name: Mint a GitHub App token that can dispatch to ops
        if: steps.scope.outputs.any == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ops
          permission-contents: write
      - name: Dispatch app-test to ops
        if: steps.scope.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          while read -r sha base ids <&3; do
            gh api -X POST "repos/$OWNER/ops/dispatches" \
              -f event_type=app-test \
              -f "client_payload[sha]=$sha" \
              -f "client_payload[base]=$base" \
              -f "client_payload[ids]=$ids" \
              -f "client_payload[ref]=$BRANCH" \
              -f "client_payload[repo]=$REPO_NAME"
          done 3< "$RUNNER_TEMP/dispatches.txt"
