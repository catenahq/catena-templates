name: app-ci

# The cheap checks every app pull request and every commit of main passes
# before the bench lifecycle runs, on the runner label the caller passes
# (GitHub-hosted by default), for forks too (no secrets, a read-only token).
# `repo` checks the catalog as a whole; `app` checks each app the
# change touches: its stack file, the released app checker, its images' CVEs,
# provenance and files. App ids come from changed file names, so they reach scripts through
# env: only, and the plan job refuses any id outside the plain slug form.
#
# A pull request is judged on what it introduces. `repo` runs its checks
# through contracts' new-failures-only action, which fails only when the base
# commit passes them; `scope` reads the change against its base; the image scan
# judges the change against its base too; the other per-app checks judge the app
# as it is. A pull request's base is the first parent of its merge commit, the
# branch it merges into as it is now: the event's base.sha can name an older
# commit of that branch (a reopened pull request keeps the one it had).
#
# app-main calls this workflow once per commit of a push to main, with `sha`
# (the commit checked) and `base` (the commit it is judged from, its parent).
# A merge commit of main passes `scope` there, its sides being checked on their
# own; a pull request's merge commit is judged as usual. With `apps` set, app-main
# has judged that each app's last change is one app's: `scope` passes and `plan`
# lists those apps (the ones main still has) instead of the ones the diff touches.
#
# Another repository with the same layout calls this workflow with
# `catalog: false`. Its tools then come from a checkout of catena-templates at
# `tools-ref` into .tools, TEMPLATES_ROOT names the caller's tree, `repo` holds
# the swarm lint and the app checker in folder mode (no --catalog), and
# `own-images` lists the image repositories the caller builds, which the
# provenance step passes. The catalog itself builds an image for each folder of
# `images/`, published as ghcr.io/<owner>/<folder>; the provenance step adds
# those to the list.
#
# The heavy steps of `app` (image pulls, provenance, scanctl, ClamAV) judge the
# runtime. A first step reads the classes of the change (`build/versions.py
# classes`) and skips them when the change leaves the runtime alone and the
# app's last runtime change before the base (`build/versions.py runtime-change`)
# has an `app-ci` status of success posted by github-actions[bot] for a run of
# this repository (`build/app_check.py ci-passed`, which the job's `statuses: read`
# lets read it). A change of the runtime, a runtime change without that status
# and a status that cannot be read run them. The job summary says which path ran.
#
# An app held as neat files (`services.yml` in its folder) is judged by the
# `docker-compose.yml` the render packs from them. `repo` re-renders and fails
# when `git diff blueprints` shows that file, or any other generated one, out of
# step with its inputs.

on:
  pull_request:
  workflow_call:
    inputs:
      catalog:
        description: true for the catalog itself, false for another repository's tree
        type: boolean
        default: true
      tools-ref:
        description: the catena-templates ref the tools are checked out at when catalog is false
        type: string
        default: main
      own-images:
        description: comma-separated image repositories (no tag) the caller builds itself
        type: string
        default: ''
      runner:
        description: runs-on label of every job
        type: string
        default: ubuntu-latest
      sha:
        description: the commit checked; empty - the event's
        type: string
        default: ''
      base:
        description: the commit it is judged from; empty - the pull request's base
        type: string
        default: ''
      apps:
        description: comma-separated app ids to check instead of the apps the change touches; empty - the apps the change touches
        type: string
        default: ''

permissions:
  contents: read

# A newer push to the branch, or a newer commit of the pull request, cancels the
# run it supersedes; a call for one commit is a group of its own. The prefix
# keeps the group apart from that of a calling workflow in another repository.
concurrency:
  group: catena-templates-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.sha || github.ref }}${{ inputs.apps && format('-{0}', inputs.apps) || '' }}
  cancel-in-progress: true

env:
  TEMPLATES_ROOT: ${{ format('{0}', inputs.catalog) == 'false' && github.workspace || '' }}
  TOOLS: ${{ format('{0}', inputs.catalog) == 'false' && '.tools' || '.' }}

jobs:
  repo:
    name: make and app checker
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Check out the tools
        if: env.TEMPLATES_ROOT != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: catenahq/catena-templates
          ref: ${{ inputs.tools-ref }}
          path: .tools
          persist-credentials: false
      - name: The commit the change is judged from
        id: base
        env:
          BASE_SHA: ${{ inputs.base }}
        run: echo "sha=${BASE_SHA:-$(git rev-parse HEAD^1)}" >> "$GITHUB_OUTPUT"
      - name: make (render, lint, test) and catena-applint over the catalog
        # The checker ships in the public catena-admin image, so a fork's run
        # needs no credential to get it. Two nodes, as every catalog check runs.
        if: env.TEMPLATES_ROOT == ''
        uses: catenahq/contracts/.github/actions/new-failures-only@main
        with:
          working-directory: ${{ github.workspace }}
          repo-path: ${{ github.workspace }}
          base: ${{ steps.base.outputs.sha }}
          run: |
            make
            git diff --exit-code blueprints
            docker run --rm -v "$PWD:/work:ro" \
              --entrypoint /usr/local/share/catena-ee/bin/catena-applint \
              ghcr.io/catenahq/catena-admin:latest --catalog --nodes 2 /work/blueprints
      - name: Swarm lint and catena-applint over the blueprints
        # Folder mode: the tree is one repository's blueprints, not the catalog.
        if: env.TEMPLATES_ROOT != ''
        uses: catenahq/contracts/.github/actions/new-failures-only@main
        with:
          working-directory: ${{ github.workspace }}
          repo-path: ${{ github.workspace }}
          base: ${{ steps.base.outputs.sha }}
          run: |
            uv run "$TOOLS/build/render.py"
            git diff --exit-code blueprints
            uv run "$TOOLS/build/lint_swarm.py"
            docker run --rm -v "$PWD:/work:ro" \
              --entrypoint /usr/local/share/catena-ee/bin/catena-applint \
              ghcr.io/catenahq/catena-admin:latest --nodes 2 /work/blueprints

  scope:
    # A pull request or a commit of main changes one app, so one change is one tag.
    name: scope
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Check out the tools
        if: env.TEMPLATES_ROOT != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: catenahq/catena-templates
          ref: ${{ inputs.tools-ref }}
          path: .tools
          persist-credentials: false
      - name: The change touches at most one app
        env:
          BASE_SHA: ${{ inputs.base }}
          CHECKED_SHA: ${{ inputs.sha }}
          APPS: ${{ inputs.apps }}
        run: |
          set -euo pipefail
          if [ -n "$APPS" ]; then
            echo "app-main checked that the last change of each of $APPS is one app's"
            exit 0
          fi
          # A merge commit of main brings in the commits of its second side, each
          # checked on its own: the first-parent diff would hold all of them.
          if [ -n "$CHECKED_SHA" ] && [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -gt 2 ]; then
            echo "$CHECKED_SHA is a merge: its sides are checked on their own"
            exit 0
          fi
          git diff --name-only "${BASE_SHA:-$(git rev-parse HEAD^1)}" HEAD | uv run "$TOOLS/build/versions.py" scope

  plan:
    name: changed apps
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    outputs:
      apps: ${{ steps.changed.outputs.apps }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Check out the tools
        if: env.TEMPLATES_ROOT != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: catenahq/catena-templates
          ref: ${{ inputs.tools-ref }}
          path: .tools
          persist-credentials: false
      - name: Apps the change touches, and still has
        id: changed
        env:
          BASE_SHA: ${{ inputs.base }}
          APPS: ${{ inputs.apps }}
        run: |
          set -euo pipefail
          if [ -n "$APPS" ]; then
            slugs_re='^[a-z0-9][a-z0-9-]*(,[a-z0-9][a-z0-9-]*)*$'
            [[ "$APPS" =~ $slugs_re ]] || { echo "::error::apps are comma-separated plain app ids"; exit 1; }
            echo "${APPS//,/ }" > "$RUNNER_TEMP/ids.txt"
          else
            git diff --name-only "${BASE_SHA:-$(git rev-parse HEAD^1)}" HEAD > "$RUNNER_TEMP/paths.txt"
            uv run "$TOOLS/build/app_check.py" changed < "$RUNNER_TEMP/paths.txt" > "$RUNNER_TEMP/ids.txt"
          fi
          apps=()
          for id in $(cat "$RUNNER_TEMP/ids.txt"); do
            # An app the change deletes has nothing left to check.
            if [ -f "blueprints/$id/docker-compose.yml" ]; then apps+=("$id"); fi
          done
          json="$(printf '%s\n' "${apps[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  app:
    name: app (${{ matrix.app }})
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      statuses: read
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
      # The feature tag carries the databases the image shipped with.
      CLAMAV_IMAGE: clamav/clamav:1.5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Check out the tools
        if: env.TEMPLATES_ROOT != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: catenahq/catena-templates
          ref: ${{ inputs.tools-ref }}
          path: .tools
          persist-credentials: false
      - name: Scope of the change
        id: scope
        env:
          BASE_SHA: ${{ inputs.base }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-$(git rev-parse HEAD^1)}"
          classes="$(env -u GH_TOKEN uv run "$TOOLS/build/versions.py" classes "$APP" \
            --ref "$(git rev-parse HEAD)" --base "$base")" || classes=runtime
          heavy=true
          reason="the change touches the runtime"
          if ! grep -qx runtime <<< "$classes"; then
            runtime_change="$(env -u GH_TOKEN uv run "$TOOLS/build/versions.py" runtime-change "$APP" --ref "$base")" \
              || runtime_change=""
            if [ -z "$runtime_change" ]; then
              reason="the app has no runtime change before the base to rely on"
            elif uv run "$TOOLS/build/app_check.py" ci-passed "$runtime_change"; then
              heavy=false
              reason="the runtime is as app-ci passed it at $runtime_change"
            else
              reason="app-ci has no success at the last runtime change, $runtime_change"
            fi
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          if [ "$heavy" = true ]; then
            echo "$APP: heavy steps run: $reason" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "$APP: heavy steps skipped: $reason" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Swarm loader reads the stack file
        run: docker stack config --skip-interpolation -c "blueprints/$APP/docker-compose.yml" > /dev/null
      - name: The released app checker reads the app
        # The panel release the entry names in requires_catena (the newest
        # release when it names none) reads the app's block as a server running
        # that release does. The app's own file is judged as it is, so an
        # error inherited from its parent fails too.
        run: |
          set -euo pipefail
          image="$(uv run "$TOOLS/build/app_check.py" checker "$APP")"
          if ! docker pull "$image" > "$RUNNER_TEMP/checker-pull.txt" 2>&1; then
            cat "$RUNNER_TEMP/checker-pull.txt"
            echo "::error::The pull of $image failed. When the release is not published, a block field waits for the release that reads it."
            exit 1
          fi
          flags=(--nodes 2)
          if [ -z "$TEMPLATES_ROOT" ]; then flags=(--catalog --nodes 2); fi
          report="$RUNNER_TEMP/applint.json"
          status=0
          docker run --rm -v "$PWD:/work:ro" \
            --entrypoint /usr/local/share/catena-ee/bin/catena-applint \
            "$image" "${flags[@]}" --json /work/blueprints > "$report" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::catena-applint of $image ended with status $status"
            exit 1
          fi
          file="/work/blueprints/$APP/docker-compose.yml"
          jq -e --arg f "$file" 'any(.[]; .file == $f)' "$report" > /dev/null
          jq -r --arg f "$file" \
            '.[] | select(.file == $f) | .findings[] | select(.severity == "error") | "\($f): error \(.rule): \(.message)"' \
            "$report" > "$RUNNER_TEMP/applint-errors.txt"
          cat "$RUNNER_TEMP/applint-errors.txt"
          [ ! -s "$RUNNER_TEMP/applint-errors.txt" ]
      - name: Pull the app's images
        if: steps.scope.outputs.heavy == 'true'
        run: |
          set -euo pipefail
          uv run "$TOOLS/build/app_check.py" images "$APP" > "$RUNNER_TEMP/images.txt"
          while read -r image; do docker pull "$image"; done < "$RUNNER_TEMP/images.txt"
      - name: Provenance (project age and releases)
        if: steps.scope.outputs.heavy == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          CALLER_OWN_IMAGES: ${{ inputs.own-images }}
        run: |
          set -euo pipefail
          # The catalog builds an image for each folder of images/ and publishes it
          # as ghcr.io/<owner>/<folder>.
          own="$CALLER_OWN_IMAGES"
          if [ -z "$TEMPLATES_ROOT" ]; then
            for dir in images/*/; do
              [ -d "$dir" ] || continue
              own="$own${own:+,}ghcr.io/${OWNER,,}/$(basename "$dir")"
            done
          fi
          PROVENANCE_OWN_IMAGES="$own" uv run "$TOOLS/build/app_check.py" provenance "$APP"
      - if: steps.scope.outputs.heavy == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: scanctl on the app's images
        if: steps.scope.outputs.heavy == 'true'
        # Only trivy runs, over the one compose file's images. The change is
        # judged from its base (-baseline-ref): a vulnerability at or above high
        # with a fix, or a secret in an image, fails only when the change adds it,
        # as in security.yml's pull request scan; the ones already there do not
        # fail the step and are counted among the summary's advisory findings.
        env:
          BASE_SHA: ${{ inputs.base }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          base="${BASE_SHA:-$(git rev-parse HEAD^1)}"
          go install github.com/catenahq/scanctl/cmd/scanctl@latest
          cat > "$RUNNER_TEMP/scanctl-app.yml" <<EOF
          profile: sellable
          gate:
            floor: high
          tools:
            osv-scanner: {enabled: false}
            govulncheck: {enabled: false}
            gosec: {enabled: false}
            gitleaks: {enabled: false}
            semgrep: {enabled: false}
            zizmor: {enabled: false}
            guarddog: {enabled: false}
            trivy-license: {enabled: false}
          image_pins:
            - file: blueprints/$APP/docker-compose.yml
              pattern: '(?m)^\s*image:\s*["'']?([^"''\s#]+)'
          EOF
          "$(go env GOPATH)/bin/scanctl" run \
            -config "$RUNNER_TEMP/scanctl-app.yml" \
            -baseline-ref "$base" \
            -out "$RUNNER_TEMP/scanctl.sarif" \
            -summary "$RUNNER_TEMP/scanctl-summary.md" .
      - name: Scan summary
        if: always() && steps.scope.outputs.heavy == 'true'
        run: cat "$RUNNER_TEMP/scanctl-summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: ClamAV over each image's files
        if: steps.scope.outputs.heavy == 'true'
        # .clamav-allow.sfp joins the image's databases: the files it lists by
        # exact content pass. The regular files of an image, one name per inode
        # (hardlinked names hold the same content), are dealt round robin to one
        # clamscan per processor, each loading its own databases, so at most one
        # per 2 GB of available memory; each prints its summary. A device node
        # (dev/null in some images) holds nothing to scan and needs root to be
        # made: tar may fail on those alone.
        run: |
          set -euo pipefail
          allow="$(realpath "$TOOLS/.clamav-allow.sfp")"
          lists="$RUNNER_TEMP/clamav-lists"
          mem_kb="$(free -k | awk '/^Mem:/ {print $7}')"
          scanners="$(nproc)"
          if [ "$(( mem_kb / 2097152 ))" -lt "$scanners" ]; then scanners="$(( mem_kb / 2097152 ))"; fi
          if [ "$scanners" -lt 1 ]; then scanners=1; fi
          while read -r image; do
            echo "== $image"
            work="$(mktemp -d)"
            cid="$(docker create "$image")"
            set +e
            docker export "$cid" | tar -x --no-same-owner -C "$work" 2> "$RUNNER_TEMP/tar.err"
            status=("${PIPESTATUS[@]}")
            set -e
            cat "$RUNNER_TEMP/tar.err" >&2
            [ "${status[0]}" = 0 ]
            if [ "${status[1]}" != 0 ]; then
              grep -q ': Cannot mknod: Operation not permitted$' "$RUNNER_TEMP/tar.err"
              if grep -v -e ': Cannot mknod: Operation not permitted$' \
                  -e '^tar: Exiting with failure status due to previous errors$' "$RUNNER_TEMP/tar.err"; then
                exit 1
              fi
            fi
            docker rm "$cid" > /dev/null
            chmod -R u+rwX,a+rX "$work"
            rm -rf "$lists"
            mkdir "$lists"
            (cd "$work" && find . -type f -printf '%i /scan/%P\n') > "$RUNNER_TEMP/clamav-names"
            sort -u -k1,1 "$RUNNER_TEMP/clamav-names" | cut -d' ' -f2- > "$RUNNER_TEMP/clamav-files"
            echo "$(wc -l < "$RUNNER_TEMP/clamav-names") names, $(wc -l < "$RUNNER_TEMP/clamav-files") files," \
              "$(du -sh --apparent-size "$work" | cut -f1), $scanners scanners"
            split -e -n "r/$scanners" "$RUNNER_TEMP/clamav-files" "$lists/part."
            pids=()
            for list in "$lists"/part.*; do
              docker run --rm --user 0 -v "$work:/scan:ro" -v "$lists:/lists:ro" \
                -v "$allow:/var/lib/clamav/catena-allow.sfp:ro" --entrypoint clamscan \
                "$CLAMAV_IMAGE" --infected "--file-list=/lists/${list##*/}" < /dev/null &
              pids+=("$!")
            done
            failed=0
            for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
            [ "$failed" = 0 ]
            rm -rf "$work"
          done < "$RUNNER_TEMP/images.txt"

  app-checks:
    # One name for the branch ruleset to require: the per-app jobs are named
    # after their app, and a skipped job (no app changed) counts as passed.
    name: app-checks
    needs: [repo, plan, app]
    if: always()
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - name: Every job passed or had nothing to do
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              echo "a job finished $result"
              exit 1
            fi
          done
