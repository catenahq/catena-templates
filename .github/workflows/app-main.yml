name: app-main

# Gates every commit of a push to main, for repository admins' direct pushes
# and for merges alike. `list` names the commits of the push on the first-parent
# line, oldest first, each with its parent, and drops a commit whose tree and
# parent tree an app-ci run of a pull request already judged: that commit takes
# the run's result. `checks` calls app-ci once per remaining commit, which judges
# the commit from its parent. `verdict` posts the commit
# status `app-ci` on each commit: success when the commit's `scope` and
# `app-checks` jobs passed (or the reused run succeeded, its address as the
# target), else failure naming the jobs that did not. `dispatch`
# calls app-dispatch with the commits that passed, so the bench runs only those,
# and app-tag tags an app only when its last change on main holds an `app-ci`
# success.
#
# An admin starts this workflow by hand with `apps` (comma-separated app ids):
# `list` then names the last change of each app on main, `checks` judges each
# with the checks of the head of main (the app's files at the head are those of
# its last change) from the last change's parent, and `verdict` and `dispatch`
# post and send as for a push.
#
# This workflow serves catena-templates alone; other repositories call app-ci,
# app-dispatch and app-tag directly. The commits of a push are all processed:
# no concurrency group cancels a run.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apps:
        description: comma-separated app ids whose last change on main is judged again
        type: string
        required: true

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      TOOLS: .
    outputs:
      commits: ${{ steps.split.outputs.commits }}
      shas: ${{ steps.split.outputs.shas }}
      all: ${{ steps.split.outputs.all }}
      reused: ${{ steps.split.outputs.reused }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: The commits of the push, or the last changes of the named apps
        id: commits
        env:
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          APPS: ${{ inputs.apps }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          json="["
          sep=""
          pairs=""
          if [ "$EVENT" = workflow_dispatch ]; then
            # Each named app's last change is judged again, with the checks of the head.
            if [ "$REF" != refs/heads/main ]; then
              echo "::error::the last changes are judged again on main only, not on $REF"
              exit 1
            fi
            slugs_re='^[a-z0-9][a-z0-9-]*(,[a-z0-9][a-z0-9-]*)*$'
            if ! [[ "$APPS" =~ $slugs_re ]]; then
              echo "::error::apps are comma-separated plain app ids"
              exit 1
            fi
            head="$(git rev-parse HEAD)"
            list=""
            seen=","
            for app in ${APPS//,/ }; do
              case "$seen" in *",$app,"*) continue ;; esac
              seen="$seen$app,"
              if [ ! -f "blueprints/$app/docker-compose.yml" ]; then
                echo "::error::$app is not an app of main"
                exit 1
              fi
              last="$(uv run "$TOOLS/build/versions.py" last-change "$app" --ref HEAD)"
              if [ -z "$last" ] || ! parent="$(git rev-parse -q --verify "$last^")"; then
                echo "::error::$app has no last change with a parent to judge it from"
                exit 1
              fi
              if ! git diff --name-only "$parent" "$last" | uv run "$TOOLS/build/versions.py" scope; then
                echo "::error::the last change of $app ($last) touches more than one app and is not judged again"
                exit 1
              fi
              json="$json$sep{\"sha\":\"$last\",\"parent\":\"$parent\",\"check\":\"$head\",\"apps\":\"$app\"}"
              sep=","
              list="$list${list:+ }$last"
            done
          else
            # After a force push the old head is no branch's tip: fetch it by its id.
            if [ -n "${BEFORE//0/}" ] && ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              git fetch -q --no-tags origin "$BEFORE" 2>/dev/null || true
            fi
            # A new branch, or a before the checkout still lacks: the head alone.
            if [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              list="$SHA"
            else
              list="$(git rev-list --reverse --first-parent "$BEFORE..$SHA")"
            fi
            for commit in $list; do
              parent="$(git rev-parse "$commit^")"
              json="$json$sep{\"sha\":\"$commit\",\"parent\":\"$parent\",\"check\":\"$commit\",\"apps\":\"\"}"
              sep=","
              pairs="$pairs$commit $parent"$'\n'
            done
          fi
          count="$(wc -w <<< "$list")"
          if [ "$count" -gt 256 ]; then
            echo "::error::the push holds $count commits; a matrix runs at most 256"
            exit 1
          fi
          echo "commits=$json]" >> "$GITHUB_OUTPUT"
          echo "shas=${list//$'\n'/ }" >> "$GITHUB_OUTPUT"
          printf 'pairs<<PAIRS_END\n%sPAIRS_END\n' "$pairs" >> "$GITHUB_OUTPUT"

      # A commit whose change an app-ci run of a pull request already judged
      # (the same tree and base tree) takes that run's result and is not checked
      # again. A push only; a named-apps run judges again by intent.
      - name: Earlier app-ci results for the commits
        id: tree
        if: github.event_name == 'push' && steps.commits.outputs.pairs != ''
        uses: catenahq/contracts/.github/actions/same-tree@main
        with:
          name: app-ci
          workflow: .github/workflows/app-ci.yml
          commits: ${{ steps.commits.outputs.pairs }}
          judge-change: true
          siblings: catenahq/contracts
          record: false
          wait-minutes: 0
      - name: The commits still to check, and the reused results
        id: split
        env:
          COMMITS: ${{ steps.commits.outputs.commits }}
          SHAS: ${{ steps.commits.outputs.shas }}
          RESULTS: ${{ steps.tree.outputs.results }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          reused = {line.split()[0] for line in os.environ["RESULTS"].splitlines() if line.strip()}
          remaining = [c for c in json.loads(os.environ["COMMITS"]) if c["sha"] not in reused]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("commits=" + json.dumps(remaining, separators=(",", ":")) + "\n")
              out.write("shas=" + " ".join(c["sha"] for c in remaining) + "\n")
              out.write("all=" + os.environ["SHAS"] + "\n")
              out.write("reused<<REUSED_END\n" + os.environ["RESULTS"] + "\nREUSED_END\n")
          PY

  checks:
    name: app-ci ${{ matrix.commit.sha }}
    needs: list
    if: needs.list.outputs.commits != '[]'
    strategy:
      fail-fast: false
      matrix:
        commit: ${{ fromJSON(needs.list.outputs.commits) }}
    uses: ./.github/workflows/app-ci.yml
    with:
      sha: ${{ matrix.commit.check }}
      base: ${{ matrix.commit.parent }}
      apps: ${{ matrix.commit.apps }}
    permissions:
      actions: read
      contents: read
      statuses: read

  verdict:
    needs: [list, checks]
    if: always() && needs.list.result == 'success' && (needs.list.outputs.shas != '' || needs.list.outputs.reused != '')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      statuses: write
    outputs:
      passed: ${{ steps.post.outputs.passed }}
    steps:
      - name: Post app-ci on each commit
        id: post
        env:
          GH_TOKEN: ${{ github.token }}
          SHAS: ${{ needs.list.outputs.shas }}
          ALL: ${{ needs.list.outputs.all }}
          REUSED: ${{ needs.list.outputs.reused }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # SHAS are the commits this run checked, ALL every commit of the push in
          # order, REUSED lines "<commit> <state> <url>" for those that took an
          # earlier run's result.
          all="${ALL:-$SHAS}"
          reused_state=""
          reused_url=""
          reuse_of() {
            local sha state url
            reused_state=""
            reused_url=""
            while read -r sha state url; do
              if [ "$sha" = "$1" ]; then reused_state="$state"; reused_url="$url"; fi
            done <<< "${REUSED:-}"
          }
          # The conclusion of the job "app-ci <commit> / <job>", or missing.
          conclusion() {
            local name result found=missing
            while IFS=$'\t' read -r name result; do
              if [[ "$name" == *"$1"* && "$name" == *" / $2" ]]; then found="${result:-missing}"; fi
            done < "$RUNNER_TEMP/jobs.tsv"
            echo "$found"
          }
          # One line per job of this run (a re-run shows its latest jobs): name, conclusion.
          # The jobs API can lag behind jobs that have just finished: the list is read again,
          # up to 10 times 15 seconds apart, while a commit's scope or app-checks job shows no
          # conclusion.
          : > "$RUNNER_TEMP/jobs.tsv"
          for try in $(seq 10); do
            [ -n "$SHAS" ] || break
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
              --jq '.jobs[] | [.name, .conclusion] | @tsv' > "$RUNNER_TEMP/jobs.tsv"
            lagging=""
            for commit in $SHAS; do
              for job in scope app-checks; do
                if [ "$(conclusion "$commit" "$job")" = missing ]; then lagging="$commit / $job"; fi
              done
            done
            if [ -z "$lagging" ] || [ "$try" = 10 ]; then break; fi
            echo "read $try: $lagging shows no conclusion yet"
            sleep 15
          done
          passed=""
          for commit in $all; do
            reuse_of "$commit"
            target_url="$RUN_URL"
            if [ -n "$reused_state" ]; then
              target_url="$reused_url"
              if [ "$reused_state" = success ]; then
                state=success
                description="app-ci passed: the same change as $reused_url"
                passed="$passed${passed:+ }$commit"
              else
                state=failure
                description="app-ci failed: the same change as $reused_url"
              fi
            else
              failing=""
              for job in scope app-checks; do
                if [ "$(conclusion "$commit" "$job")" != success ]; then failing="$failing${failing:+, }$job"; fi
              done
              if [ -z "$failing" ]; then
                state=success
                description="app-ci passed"
                passed="$passed${passed:+ }$commit"
              else
                state=failure
                description="app-ci failed: $failing"
              fi
            fi
            echo "$commit: $description"
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$commit" \
              -f "state=$state" -f context=app-ci \
              -f "description=${description:0:140}" -f "target_url=$target_url" > /dev/null
          done
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: verdict
    if: ${{ !cancelled() && needs.verdict.result == 'success' && needs.verdict.outputs.passed != '' }}
    uses: ./.github/workflows/app-dispatch.yml
    with:
      commits: ${{ needs.verdict.outputs.passed }}
    secrets:
      RENOVATE_APP_CLIENT_ID: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
      RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
    permissions:
      contents: read
