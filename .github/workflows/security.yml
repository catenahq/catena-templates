name: security

# Bundled FOSS security scan via catenahq/scanctl (profile full), through its
# reusable workflow. Every finding in this repo's tree gates on every run. The
# catalog images come from scanctl.yml's image pins: a change gates on the
# CVEs it introduces in the blueprints it touches, and the daily run reports
# every image, which is where a CVE published against an untouched image
# surfaces. The Docker Hub login keeps that sweep under the account's pull
# limit; without the secrets the pulls run anonymously.

on:
  pull_request:
  # Every pushed branch. Renovate and engine-bump branches always carry a pull
  # request, which tests each push to them.
  push:
    branches-ignore: ['renovate/**', 'engine-bump/**', 'scanctl/**']
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  scanctl:
    uses: catenahq/scanctl/.github/workflows/github-reusable.yml@main
    # The called job asks for all three; a caller granting fewer fails to start.
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      profile: full
      # The self-hosted runner group excludes public repos.
      runner: ubuntu-latest
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
