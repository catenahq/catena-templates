name: security

# Bundled FOSS security scan via catenahq/scanctl (profile full), through its
# reusable workflow. Every finding in this repo's tree gates on every run. The
# catalog images come from scanctl.yml's image pins: a change gates on the
# CVEs it introduces in the blueprints it touches, and the daily run fails on
# every CVE with a fix in any catalog image, which is where a CVE published
# against an untouched image surfaces. The Docker Hub login keeps that sweep under the account's pull
# limit; without the secrets the pulls run anonymously.

on:
  pull_request:
  # Every pushed branch. Renovate, engine-bump and image-pin branches always
  # carry a pull request, which tests each push to them.
  push:
    branches-ignore: ['renovate/**', 'engine-bump/**', 'image-pin/**', 'scanctl/**']
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  security-events: write

# A newer push to the branch, or a newer commit of the pull request, cancels the
# run it supersedes; the scheduled run is in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanctl:
    uses: catenahq/scanctl/.github/workflows/github-reusable.yml@main
    # The called job asks for all three; a caller granting fewer fails to start.
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      profile: full
      # The self-hosted runner group excludes public repos.
      runner: ubuntu-latest
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
