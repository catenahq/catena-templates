name: app-tag

# Tags the apps a passing app-tests run names, on a commit of main. The ops
# app-tests workflow sends the event `app-passed` with `{sha, apps, run}`: the
# commit, the apps that passed on it (comma-separated slugs) and the address of
# the run. `build/versions.py plan --ref <sha>`, from the default branch's own
# checkout, reads each app at the commit against its tags:
#   create TAG  the app's files differ from its newest tag, or it has none: an
#               annotated tag `<app>/<version>-<revision>` on the commit
#   mark TAG    its newest tag was made by hand and holds the same files: that
#               tag is annotated where it stands
#   skip TAG    a passing run made its newest tag, which holds the same files,
#               or the newest tag is on a later commit
# The annotation opens with `app-tests passed` and names the commit and the run.
# The tags are written through the API with the catenahq-renovate GitHub App's
# token (secrets RENOVATE_APP_CLIENT_ID and RENOVATE_APP_PRIVATE_KEY), the one
# actor the tag ruleset lets create or move a `*/*` tag; ops sends the event
# with the same App. Runs are not queued behind each other, which would drop all
# but the newest waiting event: a run whose new tag another run created first
# reads the tags again and plans that app once more.
#
# Another repository with the same layout calls this workflow with
# `catalog: false`: its tools come from a checkout of catena-templates at
# `tools-ref` into .tools, and TEMPLATES_ROOT names the caller's tree.

on:
  repository_dispatch:
    types: [app-passed]
  workflow_call:
    inputs:
      catalog:
        description: true for the catalog itself, false for another repository's tree
        type: boolean
        default: true
      tools-ref:
        description: the catena-templates ref the tools are checked out at when catalog is false
        type: string
        default: main
      own-images:
        description: comma-separated image repositories (no tag) the caller builds itself
        type: string
        default: ''
    secrets:
      RENOVATE_APP_CLIENT_ID:
        required: true
      RENOVATE_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

env:
  TEMPLATES_ROOT: ${{ format('{0}', inputs.catalog) == 'false' && github.workspace || '' }}
  TOOLS: ${{ format('{0}', inputs.catalog) == 'false' && '.tools' || '.' }}

jobs:
  tag:
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.client_payload.sha }}
      APPS: ${{ github.event.client_payload.apps }}
      RUN: ${{ github.event.client_payload.run }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Validate the payload
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha is not 40 lowercase hex"; exit 1; }
          [[ "$APPS" =~ ^[a-z0-9][a-z0-9-]*(,[a-z0-9][a-z0-9-]*)*$ ]] \
            || { echo "::error::apps are not plain app slugs"; exit 1; }
          [[ "$RUN" =~ ^https://github\.com/$OWNER/ops/actions/runs/[0-9]+$ ]] \
            || { echo "::error::run is not the address of an ops run"; exit 1; }
      # The default branch's commit: its tools read the passed commit, which may predate them.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check out the tools
        if: env.TEMPLATES_ROOT != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: catenahq/catena-templates
          ref: ${{ inputs.tools-ref }}
          path: .tools
          persist-credentials: false
      - name: Plan each app's tag
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SHA" HEAD \
            || { echo "::error::$SHA is not on the default branch: nothing is tagged"; exit 1; }
          : > "$RUNNER_TEMP/plan.txt"
          for app in ${APPS//,/ }; do
            if ! git cat-file -e "$SHA:blueprints/$app/docker-compose.yml" 2>/dev/null; then
              echo "::error::$SHA holds no app $app"; exit 1
            fi
            plan="$(uv run "$TOOLS/build/versions.py" plan "$app" --ref "$SHA")"
            echo "$app $plan" >> "$RUNNER_TEMP/plan.txt"
          done
          cat "$RUNNER_TEMP/plan.txt"
      - name: Mint a GitHub App token that can write tags
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          # Writing a ref (git/refs) also takes the workflows permission when the tagged
          # history holds workflow changes (GitHub lists those endpoints under Workflows too).
          permission-workflows: write
      - name: Write the tags
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          message="app-tests passed at $SHA: $RUN"
          while read -r app action tag <&3; do
            for try in 1 2 3; do
              case "$action" in
                skip)
                  echo "$app: keeps $tag"; break ;;
                mark)
                  object="$(gh api -X POST "repos/$REPO/git/tags" -f "tag=$tag" -f "message=$message" \
                    -f "object=$(git rev-parse "$tag^{commit}")" -f type=commit --jq .sha)"
                  gh api -X PATCH "repos/$REPO/git/refs/tags/$tag" -f "sha=$object" -F force=true > /dev/null
                  echo "$app: marked $tag"; break ;;
                create)
                  object="$(gh api -X POST "repos/$REPO/git/tags" -f "tag=$tag" -f "message=$message" \
                    -f "object=$SHA" -f type=commit --jq .sha)"
                  if gh api -X POST "repos/$REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$object" > /dev/null; then
                    echo "$app: tagged $tag"; break
                  fi
                  [ "$try" -lt 3 ] || { echo "::error::$app: $tag could not be created"; exit 1; }
                  git fetch -q --force origin '+refs/tags/*:refs/tags/*'
                  plan="$(env -u GH_TOKEN uv run "$TOOLS/build/versions.py" plan "$app" --ref "$SHA")"
                  read -r action tag <<< "$plan" ;;
              esac
            done
          done 3< "$RUNNER_TEMP/plan.txt"
