name: app-tag

# Tags the apps a passing app-tests run names, on a commit of main. The ops
# app-tests workflow sends the event `app-passed` with `{sha, apps, run}`: the
# commit, the apps that passed on it (comma-separated slugs) and the address of
# the run. `build/versions.py plan --ref <sha>`, from the default branch's own
# checkout, reads each app at the commit against its tags:
#   create TAG  the app has no tag, or its files differ from its newest tag in
#               runtime (or in verification together with presentation): an
#               annotated tag `<app>/<version>-<revision>` on the commit
#   create TAG FROM
#               the files differ from the newest tag FROM, a passing run's, in
#               presentation alone: the commit has no run of its own, and the
#               annotation says the runtime and tests are FROM's
#   mark TAG    its newest tag was made by hand and the files differ from it in
#               verification alone or not at all: that tag is annotated where it
#               stands
#   skip TAG    a passing run made its newest tag and the files differ from it in
#               verification alone or not at all, or the newest tag is on a later
#               commit, or the default branch holds other files of the app than
#               the commit (`skip -` when the app has no tag)
# In the catalog itself (`catalog` true) a `create` or `mark` line stands only when
# the commit that last changed the app's files on the first-parent line up to the
# passed commit (`build/versions.py last-change`) holds an `app-ci` commit status
# of success, posted by github-actions[bot] with the address of a run of this
# repository (app-main posts it; `build/app_check.py ci-passed` reads it). Any
# other app is dropped with a warning: no tag without the app checks at the app's
# last change.
# A tag stands when app-ci passed at the app's last change on main and app-tests
# passed on a commit whose runtime and tests are the tagged commit's: the commit
# itself or, for a change of presentation alone, the run that tested the same
# runtime and tests.
# The annotation opens with `app-tests passed` and names the commit and the run;
# for `create TAG FROM` a blank line and "Runtime and tests as FROM; this revision
# changes the presentation alone." follow.
# The tags are written through the API with the catenahq-renovate GitHub App's
# token (secrets RENOVATE_APP_CLIENT_ID and RENOVATE_APP_PRIVATE_KEY), the one
# actor the tag ruleset lets create or move a `*/*` tag; ops sends the event
# with the same App. Runs are not queued behind each other, which would drop all
# but the newest waiting event: a run whose new tag another run created first
# reads the tags again and plans that app once more.
#
# Another repository with the same layout calls this workflow with
# `catalog: false`: its tools come from a checkout of catena-templates at
# `tools-ref` into .tools, and TEMPLATES_ROOT names the caller's tree.

on:
  repository_dispatch:
    types: [app-passed]
  workflow_call:
    inputs:
      catalog:
        description: true for the catalog itself, false for another repository's tree
        type: boolean
        default: true
      tools-ref:
        description: the catena-templates ref the tools are checked out at when catalog is false
        type: string
        default: main
      own-images:
        description: comma-separated image repositories (no tag) the caller builds itself
        type: string
        default: ''
      runner:
        description: runs-on label of every job
        type: string
        default: ubuntu-latest
    secrets:
      RENOVATE_APP_CLIENT_ID:
        required: true
      RENOVATE_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

env:
  TEMPLATES_ROOT: ${{ format('{0}', inputs.catalog) == 'false' && github.workspace || '' }}
  TOOLS: ${{ format('{0}', inputs.catalog) == 'false' && '.tools' || '.' }}

jobs:
  tag:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    env:
      SHA: ${{ github.event.client_payload.sha }}
      APPS: ${{ github.event.client_payload.apps }}
      RUN: ${{ github.event.client_payload.run }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Validate the payload
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha is not 40 lowercase hex"; exit 1; }
          [[ "$APPS" =~ ^[a-z0-9][a-z0-9-]*(,[a-z0-9][a-z0-9-]*)*$ ]] \
            || { echo "::error::apps are not plain app slugs"; exit 1; }
          [[ "$RUN" =~ ^https://github\.com/$OWNER/ops/actions/runs/[0-9]+$ ]] \
            || { echo "::error::run is not the address of an ops run"; exit 1; }
      # The default branch's commit: its tools read the passed commit, which may predate them.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Check out the tools
        if: env.TEMPLATES_ROOT != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: catenahq/catena-templates
          ref: ${{ inputs.tools-ref }}
          path: .tools
          persist-credentials: false
      - name: Plan each app's tag
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SHA" HEAD \
            || { echo "::error::$SHA is not on the default branch: nothing is tagged"; exit 1; }
          : > "$RUNNER_TEMP/plan.txt"
          for app in ${APPS//,/ }; do
            if ! git cat-file -e "$SHA:blueprints/$app/docker-compose.yml" 2>/dev/null; then
              echo "::error::$SHA holds no app $app"; exit 1
            fi
            plan="$(uv run "$TOOLS/build/versions.py" plan "$app" --ref "$SHA")"
            echo "$app $plan" >> "$RUNNER_TEMP/plan.txt"
          done
          cat "$RUNNER_TEMP/plan.txt"
      - name: Mint a GitHub App token that can write tags
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          # Writing a ref (git/refs) also takes the workflows permission when the tagged
          # history holds workflow changes (GitHub lists those endpoints under Workflows too).
          permission-workflows: write
          permission-statuses: read
      - name: Hold back an app whose last change on main has not passed app-ci
        if: format('{0}', inputs.catalog) != 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/kept.txt"
          while read -r app action tag from <&3; do
            if [ "$action" = skip ]; then
              echo "$app $action $tag${from:+ $from}" >> "$RUNNER_TEMP/kept.txt"
              continue
            fi
            last="$(env -u GH_TOKEN uv run "$TOOLS/build/versions.py" last-change "$app" --ref "$SHA")"
            if [ -n "$last" ] && uv run "$TOOLS/build/app_check.py" ci-passed "$last"; then
              echo "$app $action $tag${from:+ $from}" >> "$RUNNER_TEMP/kept.txt"
            else
              echo "::warning::$app: ${last:-no commit} has no app-ci success, so $tag is not written"
            fi
          done 3< "$RUNNER_TEMP/plan.txt"
          mv "$RUNNER_TEMP/kept.txt" "$RUNNER_TEMP/plan.txt"
      - name: Write the tags
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          passed="app-tests passed at $SHA: $RUN"
          while read -r app action tag from <&3; do
            for try in 1 2 3; do
              message="$passed"
              if [ "$action" = create ] && [ -n "$from" ]; then
                message="$passed"$'\n\n'"Runtime and tests as $from; this revision changes the presentation alone."
              fi
              case "$action" in
                skip)
                  echo "$app: keeps $tag"; break ;;
                mark)
                  object="$(gh api -X POST "repos/$REPO/git/tags" -f "tag=$tag" -f "message=$message" \
                    -f "object=$(git rev-parse "$tag^{commit}")" -f type=commit --jq .sha)"
                  gh api -X PATCH "repos/$REPO/git/refs/tags/$tag" -f "sha=$object" -F force=true > /dev/null
                  echo "$app: marked $tag"; break ;;
                create)
                  object="$(gh api -X POST "repos/$REPO/git/tags" -f "tag=$tag" -f "message=$message" \
                    -f "object=$SHA" -f type=commit --jq .sha)"
                  if gh api -X POST "repos/$REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$object" > /dev/null; then
                    echo "$app: tagged $tag"; break
                  fi
                  [ "$try" -lt 3 ] || { echo "::error::$app: $tag could not be created"; exit 1; }
                  git fetch -q --force origin '+refs/tags/*:refs/tags/*'
                  plan="$(env -u GH_TOKEN uv run "$TOOLS/build/versions.py" plan "$app" --ref "$SHA")"
                  read -r action tag from <<< "$plan" ;;
              esac
            done
          done 3< "$RUNNER_TEMP/plan.txt"
