      - pkg:pypi/msgpack@1.1.2
    statement: "no fixed upstream image: healthchecks/healthchecks v5.0.3 is the newest tag (2026-10-27) and carries msgpack 1.1.2 (fixed in 1.2.3); the engine bump takes the fix"
