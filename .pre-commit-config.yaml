# Pre-commit hooks.
#
# Setup (run once after cloning):
#   pipx install pre-commit  (or: pip install --user pre-commit)
#   pre-commit install --hook-type pre-commit --hook-type pre-push
#
# Behavior: before every commit, gitleaks scans the staged diff and
# blocks a leaked secret (same version as .github/workflows/gitleaks.yml,
# so the local verdict matches the CI gate); `one-app` blocks a commit
# that changes more than one app; `render` re-renders the generated files
# and blocks the commit when that changes any of them (stage the render).
#
# Bypass (use sparingly, only for documented false positives):
#   git commit --no-verify
# Better: add the exact regex / file path to .gitleaksignore so
# everyone benefits from the suppression.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # The bench tests one app at a time and a tag names one app.
      - id: one-app
        name: The commit changes at most one app
        language: system
        entry: bash -c 'git diff --cached --name-only | uv run build/versions.py scope'
        pass_filenames: false
        stages: [pre-commit]
      # A hand edit of a generated file is undone by the next render, in every branch.
      - id: render
        name: The generated files match their sources
        language: system
        entry: uv run build/render.py
        pass_filenames: false
        stages: [pre-commit]
      # Push-protection parity: scan the exact commit range being pushed, so a
      # secret committed with --no-verify (or before hooks were installed) is
      # blocked before it reaches the remote. Requires gitleaks on PATH (pin
      # the same version as above). Enabled by the pre-push hook type in setup.
      - id: gitleaks-push
        name: Detect secrets in pushed commits
        language: system
        entry: bash -c 'f=$PRE_COMMIT_FROM_REF; t=$PRE_COMMIT_TO_REF; git rev-parse -q --verify "$f^{commit}" >/dev/null 2>&1 && r="$f..$t" || r="$t"; exec gitleaks git --redact --no-banner --log-opts="$r"'
        stages: [pre-push]
        pass_filenames: false
        require_serial: true
